<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Enrich · Measurements</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --line:#2a2f3a;
    --ink:#e7e9ee; --muted:#9aa3b2; --accent:#5db58b; --accent2:#7c8a3f;
    --warn:#d8a657; --danger:#d06b6b; --chip:#232834;
    --ka:#5db58b; --curated:#d8a657; --llm:#9b8cd0;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--ink)}
  a{color:var(--accent);text-decoration:none}
  /* ---- top bar + Enrich's own hamburger ---- */
  header{display:flex;align-items:center;gap:14px;padding:12px 20px;
         border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
  .brand{font-weight:700;letter-spacing:.3px}
  .brand .dot{color:var(--accent)}
  .brand .sub{color:var(--muted);font-weight:400;margin-left:8px}
  .spacer{flex:1}
  .hamb{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
        border-radius:8px;padding:7px 11px;font-size:18px;line-height:1}
  .hamb:hover{border-color:var(--accent)}
  .navmenu{position:absolute;right:20px;top:54px;background:var(--panel2);border:1px solid var(--line);
           border-radius:10px;min-width:220px;box-shadow:0 12px 40px rgba(0,0,0,.5);
           display:none;overflow:hidden;z-index:30}
  .navmenu.open{display:block}
  .navmenu .head{padding:10px 14px;color:var(--muted);font-size:12px;text-transform:uppercase;
                 letter-spacing:.8px;border-bottom:1px solid var(--line)}
  .navmenu a{display:block;padding:11px 14px;color:var(--ink);border-bottom:1px solid var(--line)}
  .navmenu a:last-child{border-bottom:0}
  .navmenu a:hover{background:var(--panel)}
  .navmenu a.active{color:var(--accent)}
  .navmenu a .m{display:block;color:var(--muted);font-size:12px}
  /* ---- master/detail shell ---- */
  .shell{display:grid;grid-template-columns:330px 1fr;gap:0;height:calc(100vh - 57px)}
  .master{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  .toolbar{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
  .toolbar input{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
                 border-radius:8px;padding:8px 10px}
  .btn{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
       border-radius:8px;padding:8px 12px;font-size:13px;white-space:nowrap}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:#0c1410;border-color:var(--accent);font-weight:600}
  .btn.danger{color:var(--danger);border-color:#3a2a2a}
  .btn.danger:hover{border-color:var(--danger)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .list{overflow:auto;flex:1;min-height:0}
  .row{padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;
       align-items:center;gap:8px}
  .row:hover{background:var(--panel2)}
  .row.sel{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
  .row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .al{color:var(--muted);font-size:12px}
  .pill{font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
  .pill.king_arthur{color:var(--ka);border-color:#27433a}
  .pill.curated_reference{color:var(--curated);border-color:#43381f}
  .pill.llm_derived{color:var(--llm);border-color:#322c45}
  .pill.measured{color:#6ab7d8;border-color:#234049}
  .pill.count{color:var(--muted)}
  .count-note{padding:8px 14px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}
  /* ---- detail ---- */
  .detail{overflow:auto;padding:24px 28px}
  .detail h2{margin:0 0 4px}
  .detail .meta{color:var(--muted);margin-bottom:20px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px;max-width:760px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field.full{grid-column:1/-1}
  label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  input[type=text],input[type=number],select,textarea{
     background:var(--panel2);border:1px solid var(--line);color:var(--ink);
     border-radius:8px;padding:9px 11px;font:inherit;width:100%}
  textarea{min-height:90px;resize:vertical}
  .hint{font-size:12px;color:var(--muted)}
  .actions{display:flex;gap:10px;margin-top:24px;max-width:760px}
  .actions .spacer{flex:1}
  .empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);
         border:1px solid var(--line);border-radius:10px;padding:11px 18px;box-shadow:0 8px 30px rgba(0,0,0,.5);
         opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  .toast.err{border-color:var(--danger);color:#ffb4b4}
  .toast.ok{border-color:var(--accent)}
  .preview{margin-top:6px;font-size:13px;color:var(--muted)}
  .preview b{color:var(--ink)}
  .star{color:var(--curated)}
  .kind-density .count-only{display:none}
  .kind-count .density-only{display:none}
</style>
</head>
<body>
<header>
  <div class="brand">Enrich<span class="dot">.</span><span class="sub">Measurement reference</span></div>
  <div class="spacer"></div>
  <!-- hamburger injected by the shared enrich-nav.js (floating, top-right) -->
</header>

<div class="shell">
  <aside class="master">
    <div class="toolbar">
      <input id="search" type="text" placeholder="Search name or alias…" autocomplete="off"/>
      <button class="btn primary" id="newBtn">+ New</button>
    </div>
    <div class="count-note" id="countNote">Loading…</div>
    <div class="list" id="list"></div>
  </aside>

  <main class="detail" id="detail">
    <div class="empty">Select an ingredient, or click <span style="margin:0 4px">+ New</span> to add one.</div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const BASE = location.pathname.replace(/\/measures\b.*$/, "");   // -> "/enrich-api"
const api = (p) => BASE + "/measures" + p;
const CUP_ML = 236.5882365;   // US cup -> mL; ties grams-per-cup to density
let ROWS = [];
let current = null;   // null = nothing; {} = new; {id,...} = editing

/* ---------- toast ---------- */
let toastT;
function toast(msg, kind="ok"){
  const t=document.getElementById("toast");
  t.textContent=msg; t.className="toast show "+kind;
  clearTimeout(toastT); toastT=setTimeout(()=>t.className="toast",2600);
}

/* ---------- master list ---------- */
async function loadList(){
  const res = await fetch(api("/rows"));
  const data = await res.json();
  ROWS = data.rows || [];
  renderList();
}
function renderList(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const rows = ROWS.filter(r => !q || r.name.toLowerCase().includes(q)
                     || (r.aliases||[]).some(a=>a.toLowerCase().includes(q)));
  const ka = rows.filter(r=>r.provenance==="king_arthur").length;
  const cur = rows.filter(r=>r.provenance!=="king_arthur").length;
  document.getElementById("countNote").textContent =
    `${rows.length} shown · ${ka} King Arthur · ${cur} curated/other`;
  const list = document.getElementById("list");
  list.innerHTML = rows.map(r=>{
    const sel = current && current.id===r.id ? " sel" : "";
    const prov = r.kind==="count" ? "count" : r.provenance;
    const label = r.kind==="count" ? "count" : r.provenance.replace("_"," ");
    const al = (r.aliases||[]).length ? ` · ${r.aliases.length} alias${r.aliases.length>1?"es":""}` : "";
    return `<div class="row${sel}" data-id="${r.id}">
      <span class="nm">${esc(r.name)}<span class="al">${al}</span></span>
      <span class="pill ${prov}">${label}</span></div>`;
  }).join("") || `<div class="count-note">No matches.</div>`;
  list.querySelectorAll(".row").forEach(el=>el.onclick=()=>openRow(+el.dataset.id));
}
document.getElementById("search").oninput = renderList;

/* ---------- detail ---------- */
function blank(){ return {kind:"density",provenance:"curated_reference",aliases:[]}; }
async function openRow(id){
  const res = await fetch(api("/rows/"+id));
  if(!res.ok){ toast("Could not load row","err"); return; }
  current = await res.json();
  renderDetail();
}
function newRow(){ current = blank(); renderDetail(); }

function renderDetail(){
  if(!current){ document.getElementById("detail").innerHTML =
     `<div class="empty">Select an ingredient, or click + New.</div>`; return; }
  const r = current, isNew = !r.id;
  const provBadge = r.kind==="count" ? "" :
    `<span class="pill ${r.provenance}">${(r.provenance||"").replace("_"," ")}</span>`;
  document.getElementById("detail").innerHTML = `
    <h2>${isNew ? "New ingredient" : esc(r.name)} ${provBadge}</h2>
    <div class="meta">${isNew ? "Adding to Enrich's reference table"
        : `id ${r.id}${r.updated_at? " · updated "+esc(r.updated_at):""}`}</div>
    <div class="grid kind-${r.kind}" id="form">
      <div class="field"><label>Name *</label>
        <input type="text" id="f_name" value="${esc(r.name||"")}" placeholder="e.g. chicken broth"/></div>
      <div class="field"><label>Kind</label>
        <select id="f_kind">
          <option value="density"${r.kind==="density"?" selected":""}>density (volume ↔ weight)</option>
          <option value="count"${r.kind==="count"?" selected":""}>count (per item)</option>
        </select></div>
      <div class="field density-only"><label>Weight of 1 cup (g) — measured or estimated</label>
        <input type="number" step="any" id="f_gpc" value="${num(r.grams_per_cup)}" placeholder="weigh 1 cup → type the grams"/>
        <div style="display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap">
          <button type="button" class="btn" id="estimateBtn">✨ Estimate with AI</button>
          <span class="hint" id="estimateNote" style="text-transform:none">measure it if you can; otherwise estimate from name + aliases + description</span>
        </div></div>
      <div class="field density-only"><label>Density — g per mL</label>
        <input type="number" step="any" id="f_gpm" value="${num(r.g_per_ml)}" placeholder="e.g. 1.0"/>
        <span class="hint">water 1.0 · flour ~0.53 · honey ~1.42 · oil ~0.92 (auto from cup weight)</span></div>
      <div class="field count-only"><label>Grams per item</label>
        <input type="number" step="any" id="f_gpi" value="${num(r.grams_per_item)}" placeholder="e.g. large egg 50"/></div>
      <div class="field"><label>Provenance</label>
        <select id="f_prov">
          <option value="measured"${r.provenance==="measured"?" selected":""}>measured (you weighed it — authoritative)</option>
          <option value="king_arthur"${r.provenance==="king_arthur"?" selected":""}>king_arthur (authoritative)</option>
          <option value="curated_reference"${r.provenance==="curated_reference"?" selected":""}>curated_reference (asterisked*)</option>
          <option value="llm_derived"${r.provenance==="llm_derived"?" selected":""}>llm_derived (asterisked*)</option>
        </select>
        <span class="hint">measured &amp; king_arthur are authoritative; reference/LLM values show a <span class="star">*</span></span></div>
      <div class="field full"><label>Aliases (one per line)</label>
        <textarea id="f_aliases" placeholder="chicken stock&#10;beef broth&#10;vegetable stock">${esc((r.aliases||[]).join("\n"))}</textarea>
        <span class="hint">names that should resolve to this ingredient</span></div>
      <div class="field full"><label>Description <span style="text-transform:none;color:var(--accent)">— helps the AI estimate</span></label>
        <textarea id="f_desc" placeholder="e.g. thick chunky tomato-and-beef sauce for lasagna, like a Bolognese">${esc(r.description||"")}</textarea>
        <span class="hint">note the physical form: chunky/smooth, packed/loose, cooked/raw — that's what drives a good estimate</span></div>
      <div class="field full"><label>Source note</label>
        <input type="text" id="f_src" value="${esc(r.source_note||"")}" placeholder="where the value comes from"/></div>
      <div class="field full"><label>Notes</label>
        <textarea id="f_notes" placeholder="anything worth recording">${esc(r.notes||"")}</textarea></div>
      <div class="field full density-only"><label>Live preview</label>
        <div class="preview" id="preview">—</div></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="saveBtn">${isNew?"Create":"Save"}</button>
      <button class="btn" id="previewBtn">Test convert 1 cup</button>
      <div class="spacer"></div>
      ${isNew?"":`<button class="btn danger" id="delBtn">Delete</button>`}
    </div>`;
  const kindSel = document.getElementById("f_kind");
  kindSel.onchange = ()=>{ document.getElementById("form").className = "grid kind-"+kindSel.value; };
  // Cup-weight <-> density derivation: type what you measured, the other fills in.
  const gpc = document.getElementById("f_gpc"), gpm = document.getElementById("f_gpm");
  if(gpc && gpm){
    gpc.addEventListener("input", ()=>{ if(gpc.value!=="") gpm.value = (parseFloat(gpc.value)/CUP_ML).toFixed(5); });
    gpm.addEventListener("input", ()=>{ if(gpm.value!=="") gpc.value = (parseFloat(gpm.value)*CUP_ML).toFixed(1); });
  }
  document.getElementById("saveBtn").onclick = save;
  document.getElementById("previewBtn").onclick = preview;
  const estBtn = document.getElementById("estimateBtn"); if(estBtn) estBtn.onclick = estimateAI;
  const del = document.getElementById("delBtn"); if(del) del.onclick = remove;
  renderList();
}

function collect(){
  const g = id => (document.getElementById(id)||{}).value;
  const numOrNull = v => v===""||v==null ? null : parseFloat(v);
  let gpm = numOrNull(g("f_gpm"));
  const gpc = numOrNull(g("f_gpc"));
  // A measured cup-weight is the source of truth — derive density if it's the
  // only thing entered, so the conversion bridge is populated.
  if(gpm==null && gpc!=null) gpm = gpc / CUP_ML;
  return {
    name: (g("f_name")||"").trim(),
    kind: g("f_kind"),
    g_per_ml: gpm,
    grams_per_cup: gpc,
    grams_per_item: numOrNull(g("f_gpi")),
    provenance: g("f_prov"),
    aliases: (g("f_aliases")||"").split("\n").map(s=>s.trim()).filter(Boolean),
    source_note: (g("f_src")||"").trim() || null,
    notes: (g("f_notes")||"").trim() || null,
    description: (g("f_desc")||"").trim() || null,
  };
}

// ✨ One-time AI estimate of grams-per-cup, helped by name + aliases + description.
// Fills the fields for review; provenance suggested as llm_derived (asterisked)
// until a human measures it. Logged to Enrich's own token journal.
async function estimateAI(){
  const name=(document.getElementById("f_name").value||"").trim();
  if(!name){ toast("Enter a name first","err"); return; }
  const aliases=(document.getElementById("f_aliases").value||"").split("\n").map(s=>s.trim()).filter(Boolean);
  const description=(document.getElementById("f_desc").value||"").trim();
  const kind=document.getElementById("f_kind").value;
  const btn=document.getElementById("estimateBtn"), note=document.getElementById("estimateNote");
  const old=btn.textContent; btn.disabled=true; btn.textContent="Estimating…";
  if(note) note.textContent="asking the model…";
  try{
    const res=await fetch(api("/estimate"),{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name,aliases,description,kind})});
    const d=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error((d&&d.detail)||("HTTP "+res.status));
    document.getElementById("f_gpc").value=d.grams_per_cup;
    document.getElementById("f_gpm").value=d.g_per_ml;
    const prov=document.getElementById("f_prov"); if(prov) prov.value="llm_derived";
    if(note) note.innerHTML=`AI estimate: <b>${esc(String(d.grams_per_cup))} g/cup</b>`+
      (d.confidence?` · confidence ${esc(d.confidence)}`:"")+
      (d.basis?`<br><span style="color:var(--muted)">${esc(d.basis)}</span>`:"")+
      (d.assumptions?`<br><span style="color:var(--muted)">assumed: ${esc(d.assumptions)}</span>`:"")+
      `<br><span class="star">review, then Save</span> — measure it later to make it authoritative`;
    toast("Estimate ready — review & Save","ok");
  }catch(e){ if(note) note.textContent="Estimate failed: "+(e.message||e); toast("Estimate failed","err"); }
  finally{ btn.disabled=false; btn.textContent=old; }
}

async function save(){
  const body = collect();
  if(!body.name){ toast("Name is required","err"); return; }
  const isNew = !current.id;
  const res = await fetch(isNew? api("/rows") : api("/rows/"+current.id), {
    method: isNew?"POST":"PUT",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok){ toast((data&&data.detail)||"Save failed","err"); return; }
  current = data;
  await loadList();
  renderDetail();
  toast(isNew?"Created — engine reloaded":"Saved — engine reloaded","ok");
}

async function remove(){
  if(!current.id) return;
  if(!confirm(`Delete "${current.name}"? It rebuilds from the JSON seed if you re-seed.`)) return;
  const res = await fetch(api("/rows/"+current.id), {method:"DELETE"});
  if(!res.ok){ toast("Delete failed","err"); return; }
  current = null;
  await loadList();
  renderDetail();
  toast("Deleted — engine reloaded","ok");
}

/* Reuse the live /convert endpoint to preview 1 cup -> g for the current row. */
async function preview(){
  const b = collect();
  const pv = document.getElementById("preview");
  if(b.kind!=="density" || b.g_per_ml==null){ if(pv) pv.textContent="Set a density to preview."; return; }
  const res = await fetch(BASE+"/convert", {method:"POST",headers:{"Content-Type":"application/json"},
    body: JSON.stringify({amount:1,from_unit:"cup",to_unit:"g",density_g_per_ml:b.g_per_ml})});
  const d = await res.json().catch(()=>({}));
  if(pv && res.ok){
    const star = b.provenance!=="king_arthur" ? `<span class="star">*</span>` : "";
    const steps = (d.path||[]).map((s,i)=>`<li><span style="color:var(--muted)">${i+1}.</span> ${esc(s)}</li>`).join("");
    pv.innerHTML = `1 cup ${esc(b.name||"this")} ≈ <b>${Math.round(d.amount)}${star} g</b>` +
      `<ol style="margin:6px 0 0;padding-left:20px;font-family:ui-monospace,Menlo,Consolas,monospace;`+
      `font-size:12px;line-height:1.7;color:var(--ink)">${steps}</ol>`;
  } else if(pv){ pv.textContent="Preview unavailable."; }
}

/* ---------- utils ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function num(v){return v==null?"":v;}

document.getElementById("newBtn").onclick = newRow;
loadList().then(()=>document.getElementById("countNote") &&
  (document.getElementById("countNote").dataset.ready="1"));
</script>
<script src="enrich-nav.js"></script>
</body>
</html>
