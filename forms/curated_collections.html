<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Best Cooks Club — Admin · Curated Collections</title>
  <!-- The REVIEW-SOURCED selection surface, beside product_collections.html rather than
       replacing it. A curated collection is a product CLASS ("Loaf pans"); Run fetches what
       the named authorities published about it, ranks it against the stated weights, verifies
       every pick against our own data (ASIN identity, owner histograms, buy links stripped of
       the reviewer's tag) and materializes product records.

       The picks pane shows the REASONING, not just the winners: ranking here is model
       judgment rather than arithmetic, so "ahead of the next" is the audit trail — without it
       a rank can only be accepted, never challenged.

       Cloned from product_collections.html per memory/feedback_editor_template_not_runtime;
       typography and controls deliberately identical. -->
  <link rel="stylesheet" href="/forms/editor-shell.css?v=20260828b">
  <link rel="stylesheet" href="/forms/tokens.css?v=20260826b">
  <link rel="stylesheet" href="/forms/components.css?v=20260813b">
  <style>
    .pc-form .ed-field { margin-bottom: 10px; }
    .pc-form label { display: block; font-size: .78rem; font-weight: 600; margin-bottom: 3px; color: var(--ed-ink-soft); }
    .pc-form input, .pc-form textarea, .pc-form select { width: 100%; padding: 8px 10px;
      border: 1px solid var(--line); border-radius: 7px; font: inherit; font-size: .9rem; background: var(--card); }
    .pc-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pc-form-actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
    .muted { color: var(--ed-ink-soft); }
    /* One placement. */
    .pk { display: flex; gap: 11px; align-items: flex-start; padding: 11px 0;
      border-top: 1px solid var(--line); font-size: .88rem; }
    .pk:first-child { border-top: 0; }
    .pk-place { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; display: grid;
      place-items: center; font-size: .8rem; font-weight: 800; background: var(--bg);
      border: 1px solid var(--line); color: var(--ed-ink-soft); }
    .pk-place.p1 { background: #fbf1d4; color: #96700c; border-color: #eedfb4; }
    .pk-main { flex: 1; min-width: 0; display: flow-root; } /* flow-root contains the floated thumb */
    /* The thumb floats RIGHT inside the content block: every row's text keeps the
       same left edge (no jagged indent on image-less rows) and the prose flows
       around the picture, magazine-style. ~1/3 of the block, capped. */
    .pk-thumb-wrap { float: right; width: 33%; max-width: 210px; min-width: 110px;
      margin: 0 0 8px 14px; }
    .pk-thumb { display: block; width: 100%; height: auto; max-height: 240px;
      object-fit: contain; border: 1px solid var(--line); border-radius: 9px;
      background: #fff; padding: 6px; box-sizing: border-box; }
    .pk-t { font-weight: 600; }
    /* One size for the whole description body — the why-paragraph used to sit at the
       row's .88rem beside .82rem detail lines, which read as random size changes. */
    .pk-why { margin: 4px 0 0; font-size: .82rem; }
    .pk-line { margin: 3px 0 0; font-size: .82rem; }
    .pk-line b { font-weight: 600; color: var(--ed-ink-soft); }
    .pk-meta { font-size: .78rem; color: var(--ed-ink-soft); margin-top: 5px; }
    .pk-sc { flex: 0 0 auto; text-align: right; font-variant-numeric: tabular-nums; min-width: 92px; }
    .pk-sc b { font-size: 1rem; }
    .sec-h { font-size: .74rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      color: var(--ed-ink-soft); margin: 16px 0 2px; }
    .sec-h:first-of-type { margin-top: 0; }
    .warn { color: #b23b3b; }
    .pill-w { display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .03em;
      text-transform: uppercase; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line);
      color: var(--ed-ink-soft); margin-left: 5px; }
    .pill-w.ok { color: #1f8a54; border-color: #cfe9da; background: #eaf6ef; }
    .pill-w.bad { color: #b4552f; border-color: #f0d8cb; background: #fbefe8; }
    .banner { border: 1px solid #f0d8cb; background: #fbefe8; color: #8a3b21; border-radius: 8px;
      padding: 9px 11px; font-size: .84rem; margin: 8px 0; }
    #joblog { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .74rem;
      white-space: pre-wrap; max-height: 260px; overflow: auto; background: var(--bg);
      border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; margin-top: 8px; }
    #brief { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .76rem;
      white-space: pre-wrap; max-height: 460px; overflow: auto; background: var(--bg);
      border: 1px solid var(--line); border-radius: 8px; padding: 11px 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <button class="ed-back" id="edBack" aria-label="Toggle list"></button>
      <div class="ed-brand">Best Cooks Club</div>
    </div>
  </header>
  <div class="ed-scrim" id="edScrim"></div>

  <div class="ed-app">
    <aside class="ed-sidebar">
      <div class="ed-sidebar-head">
        <h2>Curated <span class="ed-count" id="count"></span></h2>
        <div class="ed-head-actions">
          <button class="ed-icon-btn" id="searchToggle" title="Search" aria-label="Search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
          <button class="ed-icon-btn" id="addToggle" title="Add a class" aria-label="Add">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>
      </div>
      <div class="ed-controls" id="controls" hidden>
        <input type="search" id="search" placeholder="Search classes…">
        <select id="sort">
          <option value="name">Sort: name (A–Z)</option>
          <option value="category">Sort: category</option>
          <option value="recent">Sort: recently run</option>
          <option value="stale">Sort: least recently run</option>
          <option value="size">Sort: most picks</option>
        </select>
      </div>
      <ul class="ed-list" id="list"><li class="ed-empty">Loading…</li></ul>
    </aside>

    <main class="ed-content"><div class="ed-page" id="page"></div></main>
  </div>

  <script src="/forms/library-shell.js?v=20260831b"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    LibraryShell.initNav({ currentPage: 'curated-collections' });
    const nav = LibraryShell.initEditorNav({
      backButton: '#edBack', scrim: '#edScrim',
      listLabel: 'Curated', listMode: 'docked', shellWidth: 1200,
    });
    const { escapeHtml, flash } = LibraryShell;

    let rows = [], byName = {}, cats = [];
    let selected = null, term = '', sortBy = 'name';
    let mode = 'view';            // 'view' | 'add' | 'edit'
    let detail = null;            // full collection + picks
    let es = null;                // job SSE

    async function load(keep){
      try {
        const d = await (await fetch('/curated-collections')).json();
        rows = d.collections || []; cats = d.ws_categories || [];
        byName = Object.fromEntries(rows.map(r => [r.name, r]));
        $('#count').textContent = rows.length ? `(${rows.length})` : '';
        if (keep && byName[keep]) selected = keep;
        renderList(); await renderDetail();
      } catch(e){ $('#page').innerHTML = `<p class="muted">Load failed: ${escapeHtml(e.message||e)}</p>`; }
    }

    /* ---------------- list ---------------- */
    function sorted(list){
      const by = {
        name:     (a,b) => a.name.localeCompare(b.name),
        category: (a,b) => (a.ws_path||'~').localeCompare(b.ws_path||'~') || a.name.localeCompare(b.name),
        recent:   (a,b) => (b.last_run_at||'').localeCompare(a.last_run_at||''),
        stale:    (a,b) => (a.last_run_at||'').localeCompare(b.last_run_at||''),
        size:     (a,b) => (b.pick_count||0) - (a.pick_count||0),
      }[sortBy] || ((a,b)=>a.name.localeCompare(b.name));
      return [...list].sort(by);
    }

    function renderList(){
      const t = term.trim().toLowerCase();
      const list = sorted(rows.filter(r => !t ||
        (r.name+' '+(r.display_name||'')+' '+(r.product_class||'')+' '+(r.ws_path||'')).toLowerCase().includes(t)));
      $('#list').innerHTML = list.length ? list.map(r => {
        // Say only what the title doesn't already say. product_class usually
        // EQUALS the display name, and product_count usually equals pick_count
        // — repeating either was the "Fine Mesh Strainer · Fine Mesh Strainer
        // · whole class · 3 picks · 3 products" noise (curator, 2026-08-28).
        const title = r.display_name || r.name;
        const cls = (r.product_class || '').trim();
        const showCls = cls && cls.toLowerCase() !== title.trim().toLowerCase();
        const bits = [];
        if (showCls) bits.push(escapeHtml(cls));
        if ((r.categories || []).length) bits.push(`${r.categories.length} categories`);
        if (r.last_error) bits.push('⚠ last run failed');
        else {
          bits.push(`${r.pick_count || 0} picks`);
          if (r.product_count && r.product_count !== r.pick_count) bits.push(`${r.product_count} products`);
          bits.push(r.last_run_at ? ago(r.last_run_at) : 'never run');
        }
        // Shared list-row component (ed-item) — these rows were classless li's
        // with an undefined .ed-sub, so they rendered as bare unstyled text.
        return `
        <li class="ed-item ${r.name===selected?'selected':''}" data-name="${escapeHtml(r.name)}">
          <div class="ed-item-top"><span class="ed-item-name">${escapeHtml(title)}</span></div>
          <div class="ed-item-meta">${bits.join(' · ')}</div>
        </li>`;
      }).join('') : '<li class="ed-empty">No classes yet</li>';
      $('#list').querySelectorAll('li[data-name]').forEach(li =>
        li.addEventListener('click', async () => {
          selected = li.dataset.name; mode='view'; detail=null;
          renderList(); await renderDetail(); nav.afterSelect();
        }));
    }

    function ago(iso){
      const d = Math.floor((Date.now() - Date.parse(iso)) / 86400000);
      return isNaN(d) ? '' : (d<=0 ? 'today' : d===1 ? '1d ago' : d+'d ago');
    }

    /* ---------------- detail ---------------- */
    async function ensureDetail(){
      if (detail && detail.name === selected) return detail;
      detail = await (await fetch(`/curated-collections/${encodeURIComponent(selected)}`)).json();
      return detail;
    }

    async function renderDetail(){
      if (mode === 'add') return renderForm(null);
      if (mode === 'edit' && selected) return renderForm(await ensureDetail());
      if (!selected || !byName[selected]) return renderIntro();
      let c;
      try { c = await ensureDetail(); }
      catch(e){ $('#page').innerHTML = `<p class="muted">Load failed: ${escapeHtml(e.message||e)}</p>`; return; }

      const allPicks = c.picks || [];
      const picks = allPicks.filter(p => !p.excluded);
      const excludedPicks = allPicks.filter(p => p.excluded);
      const withProduct = picks.filter(p => p.product_id);
      const cats_ = c.categories || [];
      $('#page').innerHTML = `
        <div class="ed-kicker"><button type="button" class="ed-purpose-toggle" id="back">← Curated collections</button></div>
        <h1 class="ed-title">${escapeHtml(c.display_name || c.name)}</h1>
        <div class="ed-status-strip">
          <span class="ed-pill"><i class="d"></i>${escapeHtml(c.product_class||'')}</span>
          <span class="ed-pill"><i class="d"></i>${cats_.length ? cats_.length+' categories' : 'whole class'}</span>
          <span class="ed-pill"><i class="d"></i>${picks.length} picks</span>
          <span class="ed-pill"><i class="d"></i>${withProduct.length} product records</span>
          <span class="ed-pill"><i class="d"></i>${c.last_run_at ? 'run '+ago(c.last_run_at) : 'never run'}</span>
          ${c.approved_by ? `<span class="ed-pill"><i class="d"></i>approved by ${escapeHtml(c.approved_by)}</span>` : ''}
        </div>
        <div style="display:flex;gap:8px;margin:6px 0 4px;align-items:center;flex-wrap:wrap">
          <button type="button" class="ed-btn primary" id="runBtn">▶ Run</button>
          <button type="button" class="ed-btn" id="editBtn">Edit</button>
          ${picks.length && !c.approved_by ? '<button type="button" class="ed-btn" id="approveBtn">Approve brief</button>' : ''}
          <label class="muted" style="font-size:.8rem;display:flex;gap:5px;align-items:center">
            <input type="checkbox" id="refreshDocs" style="width:auto"> re-fetch sources</label>
          <span class="muted" id="jobStatus" style="font-size:.82rem"></span>
          <button type="button" class="ed-btn" id="delBtn" style="margin-left:auto;color:#b23b3b">Delete</button>
        </div>
        ${c.last_error ? `<div class="banner"><b>Last run failed.</b> ${escapeHtml(c.last_error)}</div>` : ''}
        <div id="joblog" hidden></div>

        <section class="ed-block">
          <h3 class="ed-block-label">The class</h3>
          <p style="margin:0"><b>${escapeHtml(c.product_class||'')}</b>${
            c.ws_path?` <span class="muted">· ${escapeHtml(c.ws_path)}</span>`:''}</p>
          <p class="muted" style="font-size:.82rem;margin:6px 0 0">${
            cats_.length
              ? 'Categories asked for: ' + cats_.map(x=>escapeHtml(x)).join(' · ')
              : 'No categories — the whole class is ranked and the run is told not to invent any.'}</p>
          ${c.notes?`<p style="margin-top:8px">${escapeHtml(c.notes)}</p>`:''}
        </section>

        <section class="ed-block">
          <h3 class="ed-block-label">Picks
            <span class="muted" style="font-weight:400">— and why each one placed where it did</span></h3>
          ${picks.length ? renderPicks(picks) : '<p class="muted">— no run yet —</p>'}
          ${excludedPicks.length ? `
            <h3 class="ed-block-label" style="margin-top:14px">Excluded
              <span class="muted" style="font-weight:400">— rejected by you, banned from future runs</span><button
                type="button" class="info-dot" data-info-title="Excluded picks"
                data-info="Rejecting a pick bans the PRODUCT (by ASIN, then brand+title), not just
                this row: the authorities keep recommending it, so a bare delete would come back
                on the next run. The row is kept with its reasoning for the record; runs skip the
                product and materialize ignores it until you restore. Restoring lifts the ban —
                the next run decides placements. A product record it already created is not
                touched."></button></h3>
            ${excludedPicks.map(p => `
              <div class="pk" style="opacity:.55">
                <div class="pk-place">✕</div>
                <div class="pk-main">
                  <div class="pk-t">${escapeHtml([p.manufacturer, p.product_title].filter(Boolean).join(' ').trim() || '—')}</div>
                  <div class="pk-meta">${p.asin?`ASIN <a href="${asinHref(p.asin)}" target="_blank" rel="noopener">${escapeHtml(p.asin)}</a> · `:''}${p.section?escapeHtml(p.section)+' · ':''}was #${p.place ?? '?'}</div>
                </div>
                <div class="pk-sc"><button type="button" class="ed-btn" data-restore="${escapeHtml(p.slot)}" style="padding:2px 8px;font-size:.74rem">Restore</button></div>
              </div>`).join('')}` : ''}
        </section>

        ${c.brief_text ? `
        <section class="ed-block">
          <h3 class="ed-block-label">The brief</h3>
          <details><summary class="muted" style="cursor:pointer;font-size:.84rem">Show the written brief (${c.brief_text.length.toLocaleString()} chars)</summary>
            <div id="brief">${escapeHtml(c.brief_text)}</div></details>
        </section>` : ''}`;

      $('#back').addEventListener('click', () => { selected=null; detail=null; renderList(); renderDetail(); });
      $('#editBtn').addEventListener('click', () => { mode='edit'; renderDetail(); });
      $('#runBtn').addEventListener('click', doRun);
      $('#approveBtn')?.addEventListener('click', doApprove);
      // Armed two-click, the sub-item standard: first click asks, second commits.
      $('#page').querySelectorAll('[data-exclude]').forEach(b => b.addEventListener('click', async () => {
        if (!b.dataset.armed) {
          b.dataset.armed = '1'; b.textContent = 'sure?'; b.style.fontWeight = '800';
          setTimeout(() => { if (b.isConnected) { b.dataset.armed=''; b.textContent='remove'; b.style.fontWeight=''; } }, 3000);
          return;
        }
        b.disabled = true;
        try {
          const r = await fetch(`/curated-collections/${encodeURIComponent(selected)}/picks/${encodeURIComponent(b.dataset.exclude)}`, { method:'DELETE' });
          if (!r.ok) throw new Error((await r.json()).detail || 'HTTP '+r.status);
          detail = null; await renderDetail();
        } catch(e){ b.disabled = false; b.textContent = 'failed'; console.error(e); }
      }));
      $('#page').querySelectorAll('[data-restore]').forEach(b => b.addEventListener('click', async () => {
        b.disabled = true;
        try {
          const r = await fetch(`/curated-collections/${encodeURIComponent(selected)}/picks/${encodeURIComponent(b.dataset.restore)}/restore`, { method:'POST' });
          if (!r.ok) throw new Error((await r.json()).detail || 'HTTP '+r.status);
          detail = null; await renderDetail();
        } catch(e){ b.disabled = false; b.textContent = 'failed'; console.error(e); }
      }));
      wireDelete();
    }

    function renderPicks(picks){
      // Overall first, then each category — publication order, which is also the order the
      // server returns them in.
      const groups = [];
      for (const p of picks){
        const key = p.section || '';
        const g = groups.find(x => x.key === key);
        (g || (groups.push({key, rows:[]}), groups[groups.length-1])).rows.push(p);
      }
      return groups.map(g => `
        <div class="sec-h">${g.key ? escapeHtml(g.key) : 'Top three overall'}</div>
        ${g.rows.map(pickRow).join('')}`).join('');
    }

    function money(v){ return (v==null || isNaN(v)) ? '—' : '$' + Number(v).toFixed(2); }

    // Clean /dp/ link built from the ASIN — deliberately NOT the harvested
    // amazon_link, which can carry a rival's affiliate tag (buy-links rule).
    // (The old AsinImage widget endpoint is DEAD — DNS gone; thumbnails come
    // from pick.image, captured by verify's listing lookup and hotlinked.)
    const asinHref = (asin) => `https://www.amazon.com/dp/${encodeURIComponent(asin)}`;

    // Brand + title without repeating the brand — stored titles usually lead with it
    // ("Braun" + "Braun MultiQuick 7…"). Mirrors render.py's _name(); compares on the
    // brand's first word so "All American (Wisconsin Aluminum Foundry)" still matches.
    function pkName(p){
      const brand=(p.manufacturer||'').trim(), title=(p.product_title||'').trim();
      const first=brand.toLowerCase().split(/[\s(]+/)[0];
      if (brand && title && first && title.toLowerCase().startsWith(first)) return title;
      return (brand+' '+title).trim() || '—';
    }

    // Amazon image URLs carry a size modifier (e.g. ._AC_SX342_.jpg); rewrite it
    // to _SL500_ for a display-worthy resolution. No modifier = already full size.
    const bigImg = (u) => u.replace(/\._[^/.]*_\.(jpe?g|png|webp)$/i, '._SL500_.$1');

    function pickRow(p){
      const offers = p.offers || [];
      const srcs = p.source_links || [];
      const img = p.image
        ? `<img class="pk-thumb" src="${escapeHtml(bigImg(p.image))}" alt="" loading="lazy" onerror="this.closest('.pk-thumb-wrap').style.display='none'">`
        : '';
      const thumb = img
        ? `<div class="pk-thumb-wrap">${p.asin
            ? `<a href="${asinHref(p.asin)}" target="_blank" rel="noopener" title="Open on Amazon">${img}</a>` : img}</div>`
        : '';
      return `
        <div class="pk">
          <div class="pk-place ${p.place===1?'p1':''}">${p.place ?? '?'}</div>
          <div class="pk-main">
            ${thumb}
            <div class="pk-t">${escapeHtml(pkName(p))}
              ${(p.capacity&&p.capacity.length<=60&&!/^n\/?a\b/i.test(p.capacity.trim()))?`<span class="muted" style="font-weight:400"> · ${escapeHtml(p.capacity)}</span>`:''}
              ${p.model_number?`<span class="muted" style="font-weight:400" title="Manufacturer's model number"> · ${escapeHtml(p.model_number)}</span>`:''}
              ${p.identity_warning ? '<span class="pill-w bad">identity</span>'
                : (p.verified_title ? '<span class="pill-w ok">verified</span>' : '')}</div>
            ${p.best_for?`<div class="pk-line"><b>Best for:</b> ${escapeHtml(p.best_for)}</div>`:''}
            ${p.why_it_ranks_here?`<p class="pk-why">${escapeHtml(p.why_it_ranks_here)}</p>`:''}
            ${p.important_tradeoff?`<div class="pk-line"><b>The catch:</b> ${escapeHtml(p.important_tradeoff)}</div>`:''}
            ${p.edge_over_next?`<div class="pk-line"><b>Ahead of the next:</b> ${escapeHtml(p.edge_over_next)}</div>`:''}
            ${p.identity_warning?`<div class="pk-line warn"><b>⚠</b> ${escapeHtml(p.identity_warning)} — no Amazon buy link was published for this pick.</div>`:''}
            <div class="pk-meta">
              ${money(p.typical_price)} typical${p.price_type==='sale'&&p.current_price?` · on sale ${money(p.current_price)}`:''}
              ${p.asin?` · ASIN <a href="${asinHref(p.asin)}" target="_blank" rel="noopener" title="Open on Amazon">${escapeHtml(p.asin)}</a>${p.asin_source?` <span class="muted">(${escapeHtml(p.asin_source)})</span>`:''}`:' · no verified ASIN'}
              ${offers.length?` · buy at ${offers.map(o=>escapeHtml(o.retailer||'?')).join(', ')}`:''}
            </div>
            <div class="pk-meta">
              ${p.product_id
                ? `<a href="/forms/products.html?product=${encodeURIComponent(p.product_id)}">product record ↗</a>
                   ${p.product_action?`<span class="muted"> (${escapeHtml(p.product_action)})</span>`:''}`
                : '<span class="muted">no product record</span>'}
              ${srcs.length?` · <span class="muted">sources:</span> ${srcs.slice(0,4).map((u,i)=>
                  `<a href="${escapeHtml(u)}" target="_blank" rel="noopener">${i+1}</a>`).join(' ')}`:''}
            </div>
          </div>
          <div class="pk-sc">
            ${p.realrank_score!=null
              ? `<b>${p.realrank_score}</b><div class="muted" style="font-size:.7rem">RealRank</div>`
              : '<b class="muted">—</b><div class="muted" style="font-size:.7rem">no histogram</div>'}
            ${p.owner_count?`<div class="muted" style="font-size:.7rem;margin-top:3px">${
              p.owner_rating??'—'}★ · ${Number(p.owner_count).toLocaleString()}</div>`:''}
            <div style="margin-top:4px"><button type="button" class="ed-btn" data-exclude="${escapeHtml(p.slot)}"
              title="Reject this pick — bans the product from future runs; restorable below"
              style="padding:1px 8px;font-size:.68rem;color:#b23b3b">remove</button></div>
          </div>
        </div>`;
    }

    /* ---------------- run + job window ---------------- */
    async function doRun(){
      const btn = $('#runBtn'), st = $('#jobStatus'), log = $('#joblog');
      btn.disabled = true; st.textContent = 'Starting…'; log.hidden = false; log.textContent = '';
      try {
        const r = await fetch(`/curated-collections/${encodeURIComponent(selected)}/run`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ refresh: !!$('#refreshDocs')?.checked }) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || 'HTTP '+r.status);
        st.textContent = d.already_running ? `job #${d.job_id} already running…` : `job #${d.job_id} running…`;
        if (es) es.close();
        es = new EventSource(`/jobs/${d.job_id}/stream`);
        es.addEventListener('log', e => {
          log.textContent += (e.data || '') + '\n'; log.scrollTop = log.scrollHeight;
        });
        es.addEventListener('status', e => { st.textContent = `job #${d.job_id} ${e.data}`; });
        es.addEventListener('done', async () => {
          es.close(); es = null; btn.disabled = false;
          detail = null; await load(selected);
        });
        es.onerror = () => { es && es.close(); es = null; btn.disabled = false; };
      } catch(e){ btn.disabled = false; st.textContent = 'Failed: ' + (e.message||e); }
    }

    async function doApprove(){
      const b = $('#approveBtn'); b.disabled = true;
      try {
        const r = await fetch(`/curated-collections/${encodeURIComponent(selected)}/approve`, {
          method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({}) });
        if (!r.ok) throw new Error('HTTP '+r.status);
        detail = null; await load(selected); flash && flash('Approved');
      } catch(e){ b.disabled = false; flash && flash('Approve failed: '+(e.message||e)); }
    }

    /* ---------------- add / edit ---------------- */
    function renderIntro(){
      $('#page').innerHTML = `
        <div class="ed-kicker"><span class="ed-purpose-toggle" style="cursor:default">Product selection · ${rows.length} classes</span></div>
        <h1 class="ed-title">Curated collections</h1>
        <p class="muted">Name a product class — "Loaf pans" — and Run reads what the named
          authorities published about it, ranks it, checks every pick against our own data, and
          writes the winners into the product catalog. The sibling of Collections/Search, which
          starts from a saved Amazon search instead. Pick one (☰) or ＋ to add.<button
          type="button" class="info-dot" data-info-title="Curated vs Search — the two supply lines"
          data-info="This page asks WHAT THE NAMED AUTHORITIES SAY: the run reads the expert
          reviews for the class, ranks picks with written reasoning (why it ranks here, the
          edge, the tradeoff), verifies each against Amazon (ASIN, owner histogram, RealRank
          cross-check), and materializes product records itself. Its sibling, Product
          collections (Search), asks WHAT THOUSANDS OF OWNERS SAY: an Amazon search cohort,
          Wilson-screened, RealRank-scored, medaled by you. The two never feed each other —
          they converge in the ONE product catalog (find-or-create by ASIN, then brand+title):
          the Dutch Ovens golds from Search merged into the very rows this page had created.
          Use Curated where reviewers have real coverage; use Search for classes no authority
          writes about."></button></p>`;
    }

    function renderForm(c){
      const isEdit = !!c;
      const v = c || {};
      $('#page').innerHTML = `
        <div class="ed-kicker"><button type="button" class="ed-purpose-toggle" id="cancel">← Cancel</button></div>
        <h1 class="ed-title">${isEdit ? 'Edit class' : 'Add a class'}</h1>
        <div class="pc-form">
          <div class="pc-row2">
            <div class="ed-field"><label>Name ${isEdit?'(locked — the join key)':'(defaults to the class)'}</label>
              <input id="f_name" value="${escapeHtml(v.name||'')}" ${isEdit?'disabled':''} placeholder="loaf-pans"></div>
            <div class="ed-field"><label>Display name</label>
              <input id="f_display" value="${escapeHtml(v.display_name||'')}" placeholder="optional"></div>
          </div>
          <div class="ed-field"><label>Product class *</label>
            <input id="f_class" value="${escapeHtml(v.product_class||'')}" placeholder="Loaf pans">
            <p class="muted" style="font-size:.78rem;margin:5px 0 0">What gets researched. Write it
              the way a reviewer would title a roundup.</p></div>
          <div class="ed-field"><label>Editor's choice — a product to pin (optional)</label>
            <input id="f_ec" value="${escapeHtml(v.editors_choice||'')}" placeholder="Breville Control Grip BSB510XL">
            <p class="muted" style="font-size:.78rem;margin:5px 0 0">A product the review sites
              didn't select that you want analyzed anyway — full identity, price, and owner-evidence
              treatment in its own labeled slot. It never displaces the review-sourced ranking,
              and its write-up says plainly when no source tested it.</p></div>
          <div class="ed-field"><label>Fallback search terms — one per line (optional)</label>
            <textarea id="f_terms" style="min-height:56px" placeholder="Multicooker&#10;pressure canning">${escapeHtml((v.search_terms||[]).join('\n'))}</textarea>
            <p class="muted" style="font-size:.78rem;margin:5px 0 0">The class name is always
              searched first. When a publisher's page flunks the on-class check (it never
              mentions the class), these are tried next, in order — use them for a
              publisher's own name for the class. They also count as on-class language.</p></div>
          <div class="ed-field"><label>Categories — one per line (optional)</label>
            <textarea id="f_cats" style="min-height:84px" placeholder="Best value&#10;Nonstick&#10;Pullman">${escapeHtml((v.categories||[]).join('\n'))}</textarea>
            <p class="muted" style="font-size:.78rem;margin:5px 0 0">Each one is a three-product
              section a product can win by being the only candidate in it, so they decide what
              gets recommended at all — a staff call, never the run's. <b>Leave blank to rank the
              whole class</b>; the run is then told explicitly not to invent any.</p></div>
          <div class="pc-row2">
            <div class="ed-field"><label>Category (WS taxonomy)</label>
              <input id="f_cat" list="dl_cat" value="${escapeHtml(v.ws_path||'')}" placeholder="auto on create">
              <datalist id="dl_cat">${cats.map(x=>`<option value="${escapeHtml(x.path)}">`).join('')}</datalist></div>
            <div class="ed-field"><label>Verification</label>
              <label class="muted" style="font-weight:400;display:flex;gap:6px;align-items:center;padding-top:7px">
                <input type="checkbox" id="f_net" style="width:auto" ${v.use_network===0?'':'checked'}>
                check listings + owner ratings online</label></div>
          </div>
          <div class="ed-field"><label>Notes</label>
            <textarea id="f_notes" style="min-height:70px">${escapeHtml(v.notes||'')}</textarea></div>
          <div class="pc-form-actions">
            <button type="button" class="ed-btn primary" id="save">${isEdit?'Save':'Create'}</button>
            <span class="muted" id="formStatus"></span>
          </div>
        </div>`;
      $('#cancel').addEventListener('click', () => { mode='view'; renderDetail(); });
      $('#save').addEventListener('click', () => saveForm(isEdit ? c : null));
      (isEdit ? $('#f_class') : $('#f_class')).focus();
    }

    async function saveForm(existing){
      const catPath = ($('#f_cat').value||'').trim();
      const cat = cats.find(x => x.path === catPath);
      const body = {
        display_name: ($('#f_display').value||'').trim(),
        product_class: ($('#f_class').value||'').trim(),
        categories: ($('#f_cats').value||''),
        search_terms: ($('#f_terms').value||''),
        editors_choice: ($('#f_ec').value||'').trim(),
        use_network: !!$('#f_net').checked,
        notes: ($('#f_notes').value||'').trim(),
      };
      if (cat) { body.ws_category_id = cat.id; body.ws_path = cat.path; }
      const st = $('#formStatus'); st.textContent = 'Saving…';
      try {
        let r;
        if (existing) {
          r = await fetch(`/curated-collections/${encodeURIComponent(existing.name)}`, {
            method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
        } else {
          body.name = ($('#f_name').value||'').trim();
          r = await fetch('/curated-collections', {
            method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
        }
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || 'HTTP '+r.status);
        mode='view'; detail=null; await load(d.name || (existing && existing.name));
        flash && flash('Saved');
      } catch(e){ st.textContent = 'Failed: ' + (e.message||e); }
    }

    function wireDelete(){
      const del = $('#delBtn');
      del?.addEventListener('click', async () => {
        if (del.dataset.armed !== '1'){
          del.dataset.armed='1'; del.textContent='Confirm delete?';
          setTimeout(()=>{ if(del.isConnected){ del.dataset.armed=''; del.textContent='Delete'; } }, 3000);
          return;
        }
        del.disabled = true; del.textContent = 'Deleting…';
        try {
          const r = await fetch(`/curated-collections/${encodeURIComponent(selected)}`, { method:'DELETE' });
          if (!r.ok) throw new Error('HTTP '+r.status);
          selected=null; detail=null; await load(); flash && flash('Deleted');
        } catch(e){ del.disabled=false; del.textContent='Delete'; flash && flash('Delete failed: '+(e.message||e)); }
      });
    }

    /* ---------------- controls ---------------- */
    $('#searchToggle').addEventListener('click', () => {
      const c = $('#controls'); c.hidden = !c.hidden; if (!c.hidden) $('#search').focus();
    });
    $('#search').addEventListener('input', e => { term = e.target.value; renderList(); });
    $('#sort').addEventListener('change', e => { sortBy = e.target.value; renderList(); });
    $('#addToggle').addEventListener('click', () => { selected=null; detail=null; mode='add'; renderList(); renderDetail(); nav.afterSelect(); });

    // Deep-link: ?collection=<name> opens that collection — the dish form's
    // class chips link here (dish -> class -> its collection, 2026-08-30).
    (() => {
      const want = new URLSearchParams(location.search).get('collection');
      load(want || undefined).then(() => {
        if (want && byName[want]) { mode = 'view'; renderList(); renderDetail(); nav.afterSelect(); }
      });
    })();
  </script>
</body>
</html>
