<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Best Cooks Club — Admin · Dishes (v2)</title>
  <!-- Dishes admin editor on the shared editor shell — THE dishes page (nav →
       here). Clone of the a/c/d/v template (the heaviest table); superseded the
       old forms/dishes.html (removed 2026-07-23). Wired to the real /dishes API.
       See memory/project_admin_editor_nav.md. -->
  <link rel="stylesheet" href="/forms/editor-shell.css?v=20260618c">
  <link rel="stylesheet" href="/forms/tokens.css?v=20260617b">
  <link rel="stylesheet" href="/forms/components.css?v=20260617c">
  <style>
    .d-check{ display:flex; align-items:center; gap:9px; }
    .d-check input{ width:auto; }
    .d-check label{ margin:0; text-transform:none; letter-spacing:0; font-size:.92em; color:var(--ink); }
    .ed-field .warn-hint{ color:var(--ed-warn); font-size:.78em; margin-top:5px; }
    .d-loglink{ color:var(--accent); text-decoration:none; }
    .d-loglink:hover{ text-decoration:underline; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <button class="ed-back" id="edBack" aria-label="Toggle list"></button>
      <div class="ed-brand">Best Cooks Club</div>
    </div>
  </header>
  <div class="ed-scrim" id="edScrim"></div>

  <div class="ed-app">
    <aside class="ed-sidebar">
      <div class="ed-sidebar-head">
        <h2>Dishes <span class="ed-count" id="count"></span></h2>
        <div class="ed-head-actions">
          <button class="ed-icon-btn" id="searchToggle" title="Search &amp; sort" aria-label="Search and sort">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
          <button class="ed-icon-btn" id="addToggle" title="New dish" aria-label="New dish">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>
      </div>

      <div class="ed-attn" id="attn"><div class="ed-attn-title" id="attnTitle"></div><div class="ed-attn-copy" id="attnCopy"></div></div>

      <div class="ed-controls" id="controls" hidden>
        <input type="search" id="search" placeholder="Search dishes…">
        <select id="sort" aria-label="Sort dishes">
          <option value="attention">Sort: needs attention</option>
          <option value="name">Sort: name (A–Z)</option>
          <option value="recipes">Sort: recipes kept (most)</option>
          <option value="updated">Sort: last refreshed</option>
        </select>
      </div>

      <div class="ed-legend">
        <span><i class="d ok"></i>fresh</span>
        <span><i class="d warn"></i>due / error</span>
        <span><i class="d none"></i>never run</span>
      </div>

      <ul class="ed-list" id="list"><li class="ed-empty">Loading…</li></ul>
    </aside>

    <main class="ed-content"><div class="ed-page" id="page"></div></main>
  </div>

  <script src="/forms/library-shell.js?v=20260731b"></script>
  <script>
    const $ = (s) => document.querySelector(s);

    LibraryShell.initNav({ currentPage: 'dishes' });
    const nav = LibraryShell.initEditorNav({
      backButton: '#edBack', scrim: '#edScrim',
      listLabel: 'Dishes', listMode: 'docked', shellWidth: 1200,
    });
    const { escapeHtml, fmtDate, flash } = LibraryShell;

    let dishes = {};            // keyed by name
    let selected = null;        // dish name | '__new__'
    let term = '';
    let sortKey = 'attention';
    let _limits = { serpapi: 200, final: 200 };   // dish caps from System → Limits

    /* ----------------------------- derivations ----------------------------- */
    const fitOf = (d) => d.last_ou_fit || {};
    const isFit = (d) => !!fitOf(d).used;
    const isError = (d) => !!(d.last_run_status && String(d.last_run_status).startsWith('error'));
    const neverRun = (d) => !d.last_refreshed;
    function needsAttention(d){ return neverRun(d) || isError(d) || !!d.is_due; }
    function flag(d){
      if (neverRun(d)) return 'none';
      if (isError(d) || d.is_due) return 'warn';
      return 'ok';
    }
    function num(v, dgt = 4){ if (v == null) return '—'; const n = Number(v); return isFinite(n) ? n.toFixed(dgt) : '—'; }
    function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
    function listMeta(d){
      if (neverRun(d)) return `${escapeHtml(d.chapter || '—')} · never run`;
      return `${escapeHtml(d.chapter || '—')} · ${d.last_run_count ?? 0} kept · ${fmtDate(d.last_refreshed)}`;
    }

    function sortedDishes(){
      const t = term.toLowerCase();
      const rows = Object.values(dishes).filter(d => !t || d.name.toLowerCase().includes(t) || (d.display_name || '').toLowerCase().includes(t) || (d.chapter || '').toLowerCase().includes(t));
      const sorters = {
        attention: (a, b) => (needsAttention(b) - needsAttention(a)) || a.name.localeCompare(b.name),
        name:    (a, b) => a.name.localeCompare(b.name),
        recipes: (a, b) => (b.last_run_count || 0) - (a.last_run_count || 0) || a.name.localeCompare(b.name),
        updated: (a, b) => String(b.last_refreshed || '').localeCompare(String(a.last_refreshed || '')) || a.name.localeCompare(b.name),
      };
      return rows.sort(sorters[sortKey] || sorters.attention);
    }

    /* ----------------------------- list ----------------------------- */
    function renderList(){
      const rows = sortedDishes();
      $('#count').textContent = `(${rows.length})`;
      const attn = Object.values(dishes).filter(needsAttention).length;
      const panel = $('#attn'), title = $('#attnTitle'), copy = $('#attnCopy');
      if (attn){ panel.classList.remove('none'); title.textContent = `${attn} need attention`; copy.textContent = 'Due for refresh, errored last run, or never run.'; }
      else { panel.classList.add('none'); title.textContent = 'All dishes fresh'; copy.textContent = 'Every dish has refreshed cleanly and is within TTL.'; }

      const ul = $('#list'); ul.innerHTML = '';
      if (!rows.length){ ul.innerHTML = '<li class="ed-empty">No matches</li>'; return; }
      for (const d of rows){
        const li = document.createElement('li');
        li.className = 'ed-item' + (d.name === selected ? ' selected' : '');
        li.innerHTML =
          `<div class="ed-item-top"><span class="ed-item-name">${escapeHtml(d.display_name || d.name)}</span><span class="ed-item-flag ${flag(d)}"></span></div>` +
          `<div class="ed-item-meta">${listMeta(d)}</div>`;
        li.addEventListener('click', () => { selected = d.name; renderList(); renderMain(); nav.afterSelect(); });
        ul.appendChild(li);
      }
    }

    /* ----------------------------- dispatch ----------------------------- */
    function dish(){ return dishes[selected]; }
    function renderMain(){
      if (selected === '__new__') return renderCreate();
      const d = dish();
      if (!d){ const first = sortedDishes()[0]; selected = first ? first.name : null; if (!selected){ $('#page').innerHTML = '<div class="ed-block" style="border-top:none"><p class="ed-empty-fit">No dishes yet.</p></div>'; return; } return renderMain(); }
      renderDetail(d);
    }

    function fmtCoeffs(f){
      if (!f || !f.coefficients) return '';
      const c = f.coefficients.map(x => Number(x));
      let line, pa80;
      if (f.model === 'linear'){ line = `predicted PA  =  ${num(c[0],4)}·DA  +  ${num(c[1],2)}`; pa80 = c[0]*80 + c[1]; }
      else if (f.model === 'quadratic'){ line = `predicted PA  =  ${num(c[0],4)}·DA²  +  ${num(c[1],4)}·DA  +  ${num(c[2],2)}`; pa80 = c[0]*6400 + c[1]*80 + c[2]; }
      else if (f.model === 'power'){ line = `predicted PA  =  ${num(c[0],4)}·DA ^ ${num(c[1],4)}`; pa80 = c[0]*Math.pow(80, c[1]); }
      else return c.map(x => num(x,4)).join(', ');
      return `${line}<span class="ex">at DA 80  →  PA ≈ ${isFinite(pa80) ? pa80.toFixed(1) : '—'}</span>`;
    }
    function coeffVars(f){
      const c = (f.coefficients || []).map(x => Number(x));
      if (f.model === 'linear')    return `slope·DA ${num(c[0],4)} · intercept ${num(c[1],2)}`;
      if (f.model === 'quadratic') return `DA² ${num(c[0],4)} · DA ${num(c[1],4)} · intercept ${num(c[2],2)}`;
      if (f.model === 'power')     return `scale ${num(c[0],4)} · exponent ${num(c[1],4)}`;
      return c.map(x => num(x,4)).join(', ');
    }

    function fitBlock(d){
      const f = fitOf(d);
      if (!isFit(d)){
        return `<section class="ed-block"><h3 class="ed-block-label">OU fit</h3>
          <p class="ed-empty-fit">No usable fit yet${f.n != null ? ` — only <strong>${f.n}</strong> scored records (needs ≥ 25)` : ''}. The dish grades against its <strong>chapter</strong> cohort until it has enough of its own.</p></section>`;
      }
      const q = f.r2_chosen >= 0.75 ? 'excellent' : f.r2_chosen >= 0.6 ? 'healthy' : f.r2_chosen >= 0.45 ? 'moderate' : 'weak';
      const candStr = ['linear','quadratic','power'].map(m => {
        const v = num(f['r2_' + m], 3);
        return m === f.model ? `<strong>${m} ${v}</strong>` : `${m} ${v}`;
      }).join(' <span class="sub">·</span> ');
      const sEff = f.sigma_effective, floored = (f.exc_sigma_floor != null && Number(sEff) > Number(f.sigma_observed));
      return `
        <section class="ed-block">
          <details class="ed-accordion">
            <summary>OU fit <span class="sub">· R² ${num(f.r2_chosen,2)} · ${q}</span></summary>
            <div class="ed-kv" style="margin-top:12px">
              <div class="k">Model type</div><div class="v">${cap(f.model)} regression</div>
              <div class="k">Regression</div><div class="v">page authority (PA) ~ domain authority (DA)</div>
              <div class="k">Fitted coefficients</div><div class="v">${coeffVars(f)}</div>
              <div class="k">Source-site records</div><div class="v">${f.n ?? '—'}</div>
              <div class="k">Coefficient of determination</div><div class="v">R² = ${num(f.r2_chosen,2)} <span class="sub">· ${q}</span></div>
              <div class="k">Residual scatter (σ)</div><div class="v">${num(f.sigma_observed,2)}</div>
              <div class="k">Effective σ</div><div class="v">${num(sEff,2)} <span class="sub">· floor ${num(f.exc_sigma_floor,1)}${floored ? ' (applied)' : ''}</span></div>
              <div class="k">Candidate fits</div><div class="v">${candStr}</div>
              <div class="k">Grade scale</div><div class="v">base ${f.exc_base ?? '—'} <span class="sub">· σ×${f.exc_sigma_mult ?? '—'}</span></div>
            </div>
            <h3 class="ed-block-label" style="margin-top:18px">Predicted authority model</h3>
            <pre class="ed-formula">${fmtCoeffs(f)}</pre>
          </details>
        </section>`;
    }

    function renderDetail(d){
      // Next scheduled auto-refresh (derived server-side as
      // last_refreshed + refresh_ttl_days). Manual-only dishes (no TTL) have
      // next_run_at = null and never auto-fire; the scheduler runs the due ones.
      // fmtDate is a relative "X ago" formatter — wrong for a FUTURE date (it
      // renders "-77964 min ago"); use an absolute short date instead.
      const fmtDay = (iso) => { try {
        return new Date(iso).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
      } catch(e){ return iso || '—'; } };
      const nextRunLabel = d.refresh_ttl_days == null
        ? 'manual — no auto-refresh'
        : (d.is_due ? 'due now' : `next run ${fmtDay(d.next_run_at)}`);
      const nextRunValue = d.refresh_ttl_days == null
        ? 'manual (no schedule)'
        : (d.is_due ? 'due now' : fmtDay(d.next_run_at));
      const ttlLabel = d.refresh_ttl_days == null ? 'manual' : (d.refresh_ttl_days + 'd');
      const statusCls = isError(d) ? 'warn' : (neverRun(d) ? '' : 'good');
      const queriesText = (d.queries || []).join('\n');

      $('#page').innerHTML = `
        <div class="ed-kicker">
          <button type="button" class="ed-purpose-toggle" id="purposeToggle">Admin · Edit Dish <span id="purposeArrow">▾</span></button>
          <div class="ed-purpose-pop" id="purposePop" hidden>
            <strong>Purpose:</strong> tune a dish’s search queries + cohort sizing, refresh it (re-runs SERP → Moz → extract → save into the curated top set), and review its OU fit and current winners. Name is the immutable join key — delete + recreate to rename.
          </div>
        </div>

        <h1 class="ed-title">${escapeHtml(d.display_name || d.name)}</h1>
        ${d.display_name_set ? `<p class="ed-submeta" style="margin:-2px 0 0">join key: <code>${escapeHtml(d.name)}</code> · immutable</p>` : ''}
        <div class="ed-status-strip">
          <span class="ed-pill ${statusCls}"><i class="d"></i>${neverRun(d) ? 'never run' : escapeHtml(d.last_run_status || 'unknown')}</span>
          <span class="ed-pill ${d.is_due ? 'warn' : ''}"><i class="d"></i>${nextRunLabel}</span>
          <span class="ed-pill"><i class="d"></i>top ${d.top_n_final} · TTL ${ttlLabel}</span>
          ${d.chapter ? `<span class="ed-pill"><i class="d"></i>${escapeHtml(d.chapter)}</span>` : ''}
        </div>
        <p class="ed-submeta">${d.last_run_count ?? 0} kept · last run ${fmtDate(d.last_refreshed)}${d.last_run_bottom_ou != null ? ' · bottom OU ' + num(d.last_run_bottom_ou,2) : ''}</p>

        <div class="ed-field full" style="margin:8px 0 18px">
          <label for="f_display">Display name <span style="text-transform:none;letter-spacing:0;color:var(--muted)">(cosmetic — what's shown everywhere; the join key “${escapeHtml(d.name)}” never changes). Blank = use the key.</span></label>
          <input id="f_display" type="text" value="${escapeHtml(d.display_name_set ? d.display_name : '')}" placeholder="${escapeHtml(d.name)}">
        </div>

        <section class="ed-block">
          <h3 class="ed-block-label">Search config</h3>
          <div class="ed-field full" style="margin-bottom:16px">
            <label for="f_queries">Google search query <span style="text-transform:none;letter-spacing:0;color:var(--muted)">(verbatim — one per line; <code>"…"</code>, <code>|</code> OR, <code>-site:</code> pass through to Google as typed)</span><button type="button" id="qInfoBtn" title="Google search syntax" style="margin-left:7px;border:1px solid var(--ed-line,#e2d6c3);background:#fff;color:var(--ed-accent,#9c5b34);width:19px;height:19px;border-radius:50%;font-size:.72rem;line-height:1;cursor:pointer;font-style:italic;font-weight:800;vertical-align:middle;font-family:Georgia,serif">i</button></label>
            <div id="qInfoPop" hidden style="margin:4px 0 10px;padding:12px 14px;border:1px solid var(--ed-line,#e2d6c3);border-radius:10px;background:#fffaf1;font-size:.86rem;line-height:1.5">
              <strong>Google search syntax</strong>
              <ul style="margin:6px 0 8px;padding-left:18px">
                <li><code>"exact phrase"</code> — exact match (straight quotes only; smart/curly are auto-fixed)</li>
                <li><code>-word</code> — exclude pages with that word <span style="color:var(--ed-warn,#b23b3b)">(drops <em>every</em> page containing it — careful)</span></li>
                <li><code>-site:domain.com</code> — exclude a site · <code>site:gr</code> — only that country's sites</li>
                <li><strong>Alternate phrasings → put each on its OWN line.</strong> Each runs as a separate search; results are merged. More reliable than <code>OR</code>.</li>
              </ul>
              <span style="color:var(--muted,#6b5b4f)">Only <code>"…"</code> and <code>-</code> are officially documented by Google. <code>OR</code> / <code>|</code> / parentheses pass through but are undocumented — precedence isn't guaranteed, so prefer separate lines. Blocklist exclusions are auto-appended each run (System → Search).</span><br>
              <a href="https://support.google.com/websearch/answer/2466433" target="_blank" rel="noopener" style="display:inline-block;margin-top:6px;color:var(--ed-accent,#9c5b34)">Full Google search operators reference ↗</a>
            </div>
            <textarea id="f_queries" class="ed-notes" style="min-height:90px" placeholder='"banana bread" | "banana nut bread"'>${escapeHtml(queriesText)}</textarea>
          </div>
          <div class="ed-form-grid">
            <div class="ed-field"><label for="f_serp">SERP candidates (top_n_serpapi)</label><input id="f_serp" type="number" min="1" max="${_limits.serpapi}" value="${d.top_n_serpapi ?? ''}"></div>
            <div class="ed-field"><label for="f_final">Kept winners (top_n_final)</label><input id="f_final" type="number" min="1" max="${_limits.final}" value="${d.top_n_final ?? ''}"></div>
            <div class="ed-field"><label for="f_ttl">Refresh TTL (days)</label><input id="f_ttl" type="number" min="1" value="${d.refresh_ttl_days == null ? '' : d.refresh_ttl_days}" placeholder="blank = manual only"></div>
            <div class="ed-field"><label>Auto-enrich on save</label>
              <div class="d-check"><input id="f_enrich" type="checkbox" ${d.auto_enrich ? 'checked' : ''}><label for="f_enrich">run enrich_recipe on each kept row (~$0.05/row)</label></div>
            </div>
          </div>
        </section>

        <section class="ed-block">
          <h3 class="ed-block-label">Curator notes</h3>
          <textarea id="f_notes" class="ed-notes" style="min-height:90px" placeholder="Scope, query tuning rationale, known issues…">${escapeHtml(d.notes || '')}</textarea>
          ${d.description ? `<p class="ed-notes-help" style="margin-top:10px">Auto description: ${escapeHtml(d.description)}</p>` : ''}
        </section>

        ${fitBlock(d)}

        <section class="ed-block">
          <h3 class="ed-block-label">Top recipes <span class="ed-count" id="topcount"></span></h3>
          <p class="ed-notes-help" style="margin:0 0 12px">The curated winners kept from the last refresh, by OU.</p>
          <ol class="ed-t10" id="toplist"><li class="ed-empty-fit">Loading…</li></ol>
        </section>

        <section class="ed-block">
          <details class="ed-accordion" id="ecAcc">
            <summary>Editor's Choice <span class="ed-pill" id="ecCount" style="margin-left:6px"></span></summary>
            <p class="ed-notes-help" style="margin:10px 0 12px">Pin a recipe URL to this dish. The next <b>Refresh</b> adds it to the candidate pool and scores it like any result — it appears in the winners above <b>if it ranks</b>. A pin is a membership, so the same recipe can be pinned to several dishes.</p>
            <div style="display:flex;gap:8px;margin:0 0 12px">
              <input type="url" id="ecUrl" placeholder="https://… recipe URL to pin" style="flex:1;min-width:0;padding:9px 11px;border:1px solid var(--line,#e2d6c3);border-radius:8px;font:inherit">
              <button type="button" class="ed-btn" id="ecAddBtn">Pin</button>
            </div>
            <ol class="ed-t10" id="eclist"><li class="ed-empty-fit">Loading…</li></ol>
          </details>
        </section>

        <section class="ed-block">
          <details class="ed-accordion">
            <summary>Scored cohort <span class="ed-count" id="cohortcount"></span></summary>
            <p class="ed-notes-help" style="margin:10px 0 12px">Every candidate the last fit scored — the full cohort by <code>rank_score</code> (OU/power blend), straight from the ledger. ★ = selected winner; winners show their thumbnail.</p>
            <ol class="ed-t10" id="cohortlist"><li class="ed-empty-fit">Loading…</li></ol>
          </details>
        </section>

        <section class="ed-block">
          <h3 class="ed-block-label">Last run</h3>
          <div class="ed-kv">
            <div class="k">Status</div><div class="v">${escapeHtml(d.last_run_status || '—')}</div>
            <div class="k">Recipes kept</div><div class="v">${d.last_run_count ?? '—'}</div>
            <div class="k">Bottom OU (cutoff)</div><div class="v">${num(d.last_run_bottom_ou,2)}</div>
            <div class="k">Last refreshed</div><div class="v">${fmtDate(d.last_refreshed)}</div>
            <div class="k">Next run</div><div class="v">${nextRunValue}</div>
            <div class="k">Log</div><div class="v">${d.last_run_log_url ? `<a class="d-loglink" href="${escapeHtml(d.last_run_log_url)}" target="_blank" rel="noopener">view log</a>` : '—'}</div>
          </div>
          <!-- Inline live run-log: Refresh streams the out-of-process job's log
               here (not just the nav popup), and the detail re-renders on done. -->
          <pre id="dishLog" style="display:none;max-height:340px;overflow:auto;margin:14px 0 0;padding:12px 14px;background:#1c1813;color:#e9e1d4;border-radius:10px;font-size:.76rem;line-height:1.45;white-space:pre-wrap;word-break:break-word"></pre>
        </section>

        <section class="ed-block">
          <details class="ed-accordion" id="rejectsAcc">
            <summary>Rejects <span class="ed-pill" id="rejCount" style="margin-left:6px"></span></summary>
            <p class="ed-notes-help" style="margin:10px 0 12px">URLs that ranked but were dropped (extract/save, or an anti-bot <b>fetch-fail</b>). <b>“would’ve qualified”</b> = its OU beats the cut bar, so it's worth recovering manually — open the link, run the bookmarklet, save normally.</p>
            <ol class="ed-t10" id="rejectlist"><li class="ed-empty-fit">Loading…</li></ol>
          </details>
        </section>

        <section class="ed-block">
          <details class="ed-accordion">
            <summary>Metadata</summary>
            <div class="ed-kv" style="margin-top:12px">
              <div class="k">Identity card</div><div class="v">${d.identity_card ? 'captured' : 'none'}</div>
              <div class="k">Embedding</div><div class="v">${d.embedding_model ? escapeHtml(d.embedding_model) + ' · ' + fmtDate(d.embedding_updated_at) : 'none'}</div>
              <div class="k">Created</div><div class="v">${fmtDate(d.created_at)}</div>
              <div class="k">Updated</div><div class="v">${fmtDate(d.updated_at)}</div>
            </div>
          </details>
        </section>

        <div class="ed-actions">
          <button type="button" class="ed-btn primary" id="saveBtn">Save</button>
          <button type="button" class="ed-btn" id="refreshBtn">Refresh</button>
          <button type="button" class="ed-btn danger" id="deleteBtn">Delete</button>
          <span class="ed-save-hint" id="hint"></span>
        </div>`;

      $('#purposeToggle').addEventListener('click', () => {
        const p = $('#purposePop'), a = $('#purposeArrow');
        p.hidden = !p.hidden; a.textContent = p.hidden ? '▾' : '▴';
      });
      const qInfo = $('#qInfoBtn');
      if (qInfo) qInfo.addEventListener('click', () => { const p = $('#qInfoPop'); if (p) p.hidden = !p.hidden; });
      $('#saveBtn').addEventListener('click', () => doSave(d));
      $('#refreshBtn').addEventListener('click', () => doRefresh(d));
      $('#deleteBtn').addEventListener('click', () => doDelete(d));
      $('#saveBtn').disabled = true;   // enabled by the dirty-tracker on first edit
      loadTopRecipes(d.name);
      loadCohort(d.name);
      loadRejects(d.name);
      loadEditorsChoice(d.name);
      $('#ecAddBtn').addEventListener('click', () => addPin(d.name));
      $('#ecUrl').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addPin(d.name); } });
      $('#eclist').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-unpin]'); if (!btn) return;
        removePin(d.name, btn.getAttribute('data-unpin'));
      });
    }

    // Rejects from the last run — URLs that ranked but were dropped (extract/
    // save, or an anti-bot fetch-fail authority-scored in Phase A). "would've
    // qualified" = OU beats the cut bar (bottom_ou) → worth a manual recovery.
    async function loadRejects(name){
      const wrap = $('#rejectlist'); if(!wrap) return;
      try {
        const r = await fetch(`/dishes/${encodeURIComponent(name)}/rejects`);
        if(!r.ok){ wrap.innerHTML = `<li class="ed-empty-fit">Failed (${r.status})</li>`; return; }
        const data = await r.json();
        const bar = data.bottom_ou;
        const rejects = data.rejects || [];
        const cnt = $('#rejCount'); if(cnt) cnt.textContent = rejects.length || '';
        if(!rejects.length){ wrap.innerHTML = '<li class="ed-empty-fit">No rejects on the last run.</li>'; return; }
        const ouOf = (x) => (typeof x.ou === 'number' ? x.ou : -999);
        const qual = (x) => (bar != null && typeof x.ou === 'number' && x.ou >= bar);
        rejects.sort((a,b) => (qual(b)-qual(a)) || (ouOf(b)-ouOf(a)));
        wrap.innerHTML = rejects.map(x => {
          const q = qual(x);
          const antibot = /anti-bot|fetch-fail/i.test(x.reason || '');
          let host = x.url; try { host = new URL(x.url).hostname.replace(/^www\./,''); } catch(_){}
          return `<li class="ed-t10-row" style="${q?'background:#fbf3e9;':''}">
            <span class="ed-t10-main">
              <span class="ed-t10-name"><a href="${escapeHtml(x.url)}" target="_blank" rel="noopener">${escapeHtml(host)}</a>${q?' <span class="ed-t10-grade" title="OU beats the cut bar">would’ve qualified</span>':''}${antibot?' <span class="ed-t10-grade" title="likely anti-bot block">anti-bot?</span>':''}</span>
              <span class="ed-t10-sub">${escapeHtml(x.reason || '')}</span>
            </span>
            <span class="ed-t10-stats">
              <span class="ed-t10-stat score"><span class="v">${typeof x.ou==='number'?x.ou.toFixed(1):'—'}</span><span class="l">ou</span></span>
              <span class="ed-t10-stat pct"><span class="v">${x.da ?? '—'}</span><span class="l">da</span></span>
              <span class="ed-t10-stat pct"><span class="v">${x.pa ?? '—'}</span><span class="l">pa</span></span>
            </span>
          </li>`;
        }).join('');
      } catch(e){ wrap.innerHTML = `<li class="ed-empty-fit">${escapeHtml(String(e.message||e))}</li>`; }
    }

    // Shared row for both the winners list and the cohort list. rank_score
    // is the headline; ou% / pwr% sit in fixed-width right-aligned columns
    // (.ed-t10-stats) so the numbers line up straight down each column.
    // Caller maps its payload to {rank_score, ou_pct, pwr_pct, name, domain,
    // thumb, grade, selected, href, title}.
    // Why a scored candidate isn't a winner — so a high-authority also-ran reads
    // "not selected · too thin" instead of looking like a ranking bug.
    const STATUS_LBL = { too_thin:'too thin', extract_failed:'couldn’t extract',
      save_failed:'save failed', fetch_failed:'fetch blocked', rejected:'rejected',
      reserve:'below the cut' };
    function scoreRow(r, i){
      const thumb = r.thumb ? `<span class="ed-t10-thumb"><img src="${escapeHtml(r.thumb)}" alt="" loading="lazy"></span>` : `<span class="ed-t10-thumb"></span>`;
      const star  = r.selected ? ' <span class="ed-t10-grade" title="selected winner">★</span>' : '';
      const grade = r.grade ? ` <span class="ed-t10-grade">${escapeHtml(r.grade)}</span>` : '';
      const statusChip = (!r.selected && r.status && STATUS_LBL[r.status])
        ? ` <span class="ed-t10-status" title="scored on authority, but not a kept winner">not selected · ${STATUS_LBL[r.status]}</span>` : '';
      const rk  = (typeof r.rank_score === 'number') ? r.rank_score.toFixed(1) : '—';
      const oup = (typeof r.ou_pct === 'number') ? Math.round(r.ou_pct) : '—';
      const pwp = (typeof r.pwr_pct === 'number') ? Math.round(r.pwr_pct) : '—';
      return `<a class="ed-t10-row" href="${escapeHtml(r.href || '#')}" target="_blank" rel="noopener" title="${escapeHtml(r.title || 'Open')}">
          <span class="ed-t10-rank">${i + 1}</span>${thumb}
          <span class="ed-t10-main"><span class="ed-t10-name">${escapeHtml(r.name)}${star}</span><span class="ed-t10-sub">${escapeHtml(r.domain)}${grade}${statusChip}</span></span>
          <span class="ed-t10-stats">
            <span class="ed-t10-stat score"><span class="v">${rk}</span><span class="l">score</span></span>
            <span class="ed-t10-stat pct"><span class="v">${oup}</span><span class="l">ou%</span></span>
            <span class="ed-t10-stat pct"><span class="v">${pwp}</span><span class="l">pwr%</span></span>
          </span>
        </a>`;
    }

    async function loadTopRecipes(name){
      const wrap = $('#toplist'); if (!wrap) return;
      try {
        const r = await fetch(`/dishes/${encodeURIComponent(name)}/top-recipes`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const payload = await r.json();
        // Order by the final blend score (rank_score); fall back to _master.rank.
        const recs = (payload.recipes || []).slice().sort((a, b) =>
          (b.rank_score ?? -Infinity) - (a.rank_score ?? -Infinity) || (a.rank ?? Infinity) - (b.rank ?? Infinity));
        const cnt = $('#topcount'); if (cnt) cnt.textContent = recs.length ? `(${recs.length})` : '';
        if (!recs.length){ wrap.innerHTML = '<li class="ed-empty-fit">No winners yet — refresh the dish.</li>'; return; }
        // Winners list — same-origin /r/<id> link (resolves on any host).
        wrap.innerHTML = recs.map((rec, i) => scoreRow({
          rank_score: rec.rank_score, ou_pct: rec.ou_percentile, pwr_pct: rec.power_percentile,
          name: rec.name,
          domain: rec.site_name || (rec.source_url || '').replace(/^https?:\/\//, '').split('/')[0],
          thumb: (rec.preview_image || rec.fallback_image || '').trim(),
          grade: rec.grade, selected: false,   // whole list is winners — no ★ needed
          href: rec.recipe_id ? `/r/${encodeURIComponent(rec.recipe_id)}` : (rec.source_url || '#'),
          title: 'Open recipe',
        }, i)).join('');
      } catch (e) {
        wrap.innerHTML = `<li class="ed-empty-fit">Couldn’t load winners (${escapeHtml(String(e.message || e))}).</li>`;
      }
    }

    // Editor's Choice — curator pins (a (dish, url) membership). The dish's next
    // Refresh adds these URLs to its candidate pool; they're scored into the ledger
    // and show in the winners above if they rank. No label on the recipe.
    async function loadEditorsChoice(name){
      const wrap = $('#eclist'); if (!wrap) return;
      try {
        const r = await fetch(`/dishes/${encodeURIComponent(name)}/editors-choice`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        const pins = data.pins || [];
        const cnt = $('#ecCount'); if (cnt) cnt.textContent = pins.length || '';
        if (!pins.length){ wrap.innerHTML = '<li class="ed-empty-fit">No pins yet — paste a URL above.</li>'; return; }
        wrap.innerHTML = pins.map(p => {
          let host = p.url; try { host = new URL(p.url).hostname.replace(/^www\./, ''); } catch (_){}
          return `<li class="ed-t10-row">
            <span class="ed-t10-main">
              <span class="ed-t10-name"><a href="${escapeHtml(p.url)}" target="_blank" rel="noopener">${escapeHtml(host)}</a></span>
              <span class="ed-t10-sub">${escapeHtml(p.note || p.url)}</span>
            </span>
            <button type="button" class="ed-btn danger" data-unpin="${escapeHtml(p.url_normalized)}" title="Unpin" style="padding:4px 11px">✕</button>
          </li>`;
        }).join('');
      } catch (e){ wrap.innerHTML = `<li class="ed-empty-fit">Couldn’t load pins (${escapeHtml(String(e.message || e))}).</li>`; }
    }

    async function addPin(name){
      const inp = $('#ecUrl'); const url = (inp.value || '').trim();
      if (!url){ inp.focus(); return; }
      const btn = $('#ecAddBtn'); btn.disabled = true;
      try {
        const r = await fetch(`/dishes/${encodeURIComponent(name)}/editors-choice`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url }) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.detail || `HTTP ${r.status}`);
        inp.value = '';
        const acc = $('#ecAcc'); if (acc) acc.open = true;
        await loadEditorsChoice(name);
      } catch (e){ alert('Could not pin: ' + (e.message || e)); }
      finally { btn.disabled = false; }
    }

    async function removePin(name, urlNorm){
      try {
        const r = await fetch(`/dishes/${encodeURIComponent(name)}/editors-choice?url_normalized=${encodeURIComponent(urlNorm)}`, { method: 'DELETE' });
        if (!r.ok){ const d = await r.json().catch(() => ({})); throw new Error(d.detail || `HTTP ${r.status}`); }
        await loadEditorsChoice(name);
      } catch (e){ alert('Could not unpin: ' + (e.message || e)); }
    }

    async function loadCohort(name){
      const wrap = $('#cohortlist'); if (!wrap) return;
      try {
        const r = await fetch(`/dishes/${encodeURIComponent(name)}/cohort`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const payload = await r.json();
        const rows = payload.cohort || [];
        const cnt = $('#cohortcount');
        if (cnt) cnt.textContent = rows.length ? `(${payload.selected}★ / ${payload.scored} scored / ${rows.length})` : '';
        if (!rows.length){ wrap.innerHTML = '<li class="ed-empty-fit">No scored cohort yet — refresh the dish.</li>'; return; }
        // Direct ledger read: full cohort by rank_score. Winners (joined to a
        // saved master_recipe) show name+thumbnail+grade; non-extracted
        // candidates show domain + scores only.
        wrap.innerHTML = rows.map((c, i) => {
          const domain = (c.url || '').replace(/^https?:\/\//, '').replace(/^www\./, '').split('/')[0];
          return scoreRow({
            rank_score: c.rank_score, ou_pct: c.ou_percentile, pwr_pct: c.power_percentile,
            name: c.name || domain, domain,
            thumb: (c.preview_image || '').trim(),
            grade: c.grade, selected: !!c.selected, status: c.cohort_status,
            href: c.url || '#', title: 'Open source page',
          }, i);
        }).join('');
      } catch (e) {
        wrap.innerHTML = `<li class="ed-empty-fit">Couldn’t load cohort (${escapeHtml(String(e.message || e))}).</li>`;
      }
    }

    async function doSave(d){
      const hint = $('#hint'); const btn = $('#saveBtn');
      const queries = $('#f_queries').value.split('\n').map(s => s.trim()).filter(Boolean);
      if (!queries.length){ hint.style.color = 'var(--ed-warn)'; hint.textContent = 'At least one search query is required'; return; }
      const serp = parseInt($('#f_serp').value, 10);
      const final = parseInt($('#f_final').value, 10);
      if (!(serp > 0) || !(final > 0)){ hint.style.color = 'var(--ed-warn)'; hint.textContent = 'Candidate/winner counts must be positive'; return; }
      const ttlRaw = $('#f_ttl').value.trim();
      const body = {
        queries, top_n_serpapi: serp, top_n_final: final,
        refresh_ttl_days: ttlRaw === '' ? null : parseInt(ttlRaw, 10),
        notes: $('#f_notes').value.trim(),
        auto_enrich: $('#f_enrich').checked,
        display_name: ($('#f_display') ? $('#f_display').value.trim() : '') || null,
      };
      hint.style.color = ''; btn.disabled = true; btn.textContent = 'Saving…'; btn.classList.remove('done');
      try {
        const r = await fetch(`/dishes/${encodeURIComponent(d.name)}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);
        dishes[d.name] = data;
        renderList();
        // Re-render the detail too, so the derived pills (TTL, next-run, status)
        // reflect the saved values — renderList alone left them stale. renderDetail
        // re-wires the buttons and disables Save (clean post-save state).
        renderDetail(data);
        const sb = $('#saveBtn'), sh = $('#hint');
        if (sb){ sb.textContent = 'Saved ✓'; sb.classList.add('done'); }
        if (sh) sh.textContent = 'Saved';
        setTimeout(() => { const b = $('#saveBtn'); if (b){ b.textContent = 'Save'; b.classList.remove('done'); } }, 1900);  // stays disabled until next edit
      } catch (e) {
        btn.disabled = false; btn.textContent = 'Save';
        hint.style.color = 'var(--ed-warn)'; hint.textContent = String(e.message || e);
      }
    }

    async function doRefresh(d){
      const btn = $('#refreshBtn');
      btn.disabled = true; btn.textContent = 'Queuing…';
      try {
        const r = await fetch(`/dishes/${encodeURIComponent(d.name)}/refresh`, { method: 'POST' });
        const data = await r.json().catch(() => ({}));
        if (!r.ok && r.status !== 202) throw new Error(data.detail || `HTTP ${r.status}`);
        // Phase 4: run the job OUT-OF-PROCESS — the server spawns
        // `python -m jobs exec --job-id N`, so the UI stays responsive, jobs for
        // different dishes run in parallel without interfering, and a server
        // restart can't kill the run. We just tail its log via the SSE stream.
        const sp = await fetch(`/jobs/${data.job_id}/spawn`, { method: 'POST' });
        if (!sp.ok) {
          const se = await sp.json().catch(() => ({}));
          // Fall back to the in-server drain if the spawn endpoint is unavailable.
          flash(`Spawn failed (${se.detail || sp.status}); running in-server…`, true);
          if (LibraryShell.runQueuedJobs) LibraryShell.runQueuedJobs();
        } else {
          flash(`Refreshing “${d.name}” out-of-process (job #${data.job_id})…`);
          streamDishLog(data.job_id, d.name);   // live log INLINE in the dish page
        }
      } catch (e) {
        flash(String(e.message || e), true);
      } finally {
        btn.disabled = false; btn.textContent = 'Refresh';
      }
    }

    // Stream an out-of-process job's log INLINE in the dish detail (#dishLog),
    // tailing GET /jobs/<id>/stream (the SSE reads the DB + log file the
    // subprocess writes — fully cross-process). On done, re-fetch the dish and
    // re-render the detail so Last run / pills / the view-log link update; the
    // accumulated log is re-painted into the freshly-rendered panel.
    function streamDishLog(jobId, dishName){
      let buf = '';
      const paint = () => {
        const pre = $('#dishLog'); if (!pre) return;
        pre.style.display = ''; pre.textContent = buf; pre.scrollTop = pre.scrollHeight;
      };
      const add = (line) => { buf += (buf ? '\n' : '') + line; paint(); };
      add(`▶ Running job #${jobId} for “${dishName}” (out-of-process)…`);
      const es = new EventSource('/jobs/' + jobId + '/stream');
      es.addEventListener('log', (e) => { try { add(JSON.parse(e.data).line); } catch (_) {} });
      es.addEventListener('status', (e) => { try { add('· ' + JSON.parse(e.data).status); } catch (_) {} });
      es.addEventListener('done', async (e) => {
        let st = 'done'; try { st = JSON.parse(e.data).status; } catch (_) {}
        add(`■ ${st}.`);
        es.close();
        try {
          const r = await fetch(`/dishes/${encodeURIComponent(dishName)}`);
          if (r.ok) {
            const data = await r.json();
            dishes[dishName] = data;
            if (selected === dishName) { renderList(); renderDetail(data); paint(); }
            else renderList();
          }
        } catch (_) {}
        flash(`“${dishName}” refresh ${st}.`);
      });
      es.addEventListener('error', () => { /* transient — EventSource auto-reconnects */ });
    }

    async function doDelete(d){
      if (!confirm(`Delete dish “${d.name}”?\n\nThis also removes its curated top recipes from master.`)) return;
      try {
        const r = await fetch(`/dishes/${encodeURIComponent(d.name)}`, { method: 'DELETE' });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);
        delete dishes[d.name];
        const first = sortedDishes()[0]; selected = first ? first.name : null;
        renderList(); renderMain();
        flash('Dish deleted');
      } catch (e) { flash(String(e.message || e), true); }
    }

    function renderCreate(){
      $('#page').innerHTML = `
        <div class="ed-kicker"><button type="button" class="ed-purpose-toggle" disabled style="cursor:default">Admin · New Dish</button></div>
        <h1 class="ed-title" style="margin:0 0 18px">Add a dish</h1>
        <section class="ed-block" style="border-top:none;padding-top:0">
          <div class="ed-field full" style="margin-bottom:16px"><label for="n_name">Dish name <span style="text-transform:none;letter-spacing:0;color:var(--muted)">(immutable join key)</span></label><input id="n_name" type="text" placeholder="e.g. Spaghetti and Meat Sauce" autocomplete="off"></div>
          <div class="ed-field full" style="margin-bottom:16px"><label for="n_queries">Google search query <span style="text-transform:none;letter-spacing:0;color:var(--muted)">(verbatim, one per line)</span></label><textarea id="n_queries" class="ed-notes" style="min-height:90px" placeholder='&quot;spaghetti and meat sauce&quot; | &quot;spaghetti with meat sauce&quot;'></textarea></div>
          <div class="ed-form-grid">
            <div class="ed-field"><label for="n_serp">SERP candidates</label><input id="n_serp" type="number" min="1" max="${_limits.serpapi}" value="25"></div>
            <div class="ed-field"><label for="n_final">Kept winners</label><input id="n_final" type="number" min="1" max="${_limits.final}" value="10"></div>
            <div class="ed-field"><label for="n_ttl">Refresh TTL (days)</label><input id="n_ttl" type="number" min="1" placeholder="blank = manual only"></div>
          </div>
        </section>
        <div class="ed-actions" style="position:static;background:none;padding:8px 0 0">
          <button type="button" class="ed-btn primary" id="createBtn">Create</button>
          <button type="button" class="ed-btn" id="cancelBtn">Cancel</button>
          <span class="ed-save-hint" id="hint"></span>
        </div>`;
      $('#n_name').focus();
      $('#cancelBtn').addEventListener('click', () => { const first = sortedDishes()[0]; selected = first ? first.name : null; renderList(); renderMain(); });
      $('#createBtn').addEventListener('click', doCreate);
    }

    async function doCreate(){
      const hint = $('#hint'); const btn = $('#createBtn');
      const name = $('#n_name').value.trim();
      const queries = $('#n_queries').value.split('\n').map(s => s.trim()).filter(Boolean);
      if (!name){ hint.style.color = 'var(--ed-warn)'; hint.textContent = 'Dish name is required'; $('#n_name').focus(); return; }
      if (!queries.length){ hint.style.color = 'var(--ed-warn)'; hint.textContent = 'At least one search query is required'; return; }
      const body = {
        name, queries,
        top_n_serpapi: parseInt($('#n_serp').value, 10) || 25,
        top_n_final: parseInt($('#n_final').value, 10) || 10,
        refresh_ttl_days: $('#n_ttl').value.trim() === '' ? null : parseInt($('#n_ttl').value, 10),
      };
      hint.style.color = ''; btn.disabled = true; btn.textContent = 'Creating…';
      try {
        const r = await fetch('/dishes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);
        await loadDishes(data.name || name);
        flash('Dish created — refresh it to populate winners');
      } catch (e) {
        btn.disabled = false; btn.textContent = 'Create';
        hint.style.color = 'var(--ed-warn)'; hint.textContent = String(e.message || e);
      }
    }

    /* ----------------------------- data + wiring ----------------------------- */
    async function loadDishes(selectName){
      const r = await fetch('/dishes');
      if (!r.ok){ $('#list').innerHTML = `<li class="ed-empty">Failed to load (${r.status})</li>`; return; }
      const list = await r.json();
      dishes = {};
      for (const d of list) dishes[d.name] = d;
      if (selectName && dishes[selectName]) selected = selectName;
      // Land on the first dish so the page is populated, not a splash.
      if (selected == null) { const first = sortedDishes()[0]; if (first) selected = first.name; }
      renderList();
      renderMain();
    }

    $('#searchToggle').addEventListener('click', () => {
      const c = $('#controls'); c.hidden = !c.hidden;
      $('#searchToggle').classList.toggle('active', !c.hidden);
      if (!c.hidden) $('#search').focus();
    });
    // Dirty-tracker: Save stays disabled until something in the detail changes.
    const _markDirty = () => { const b = $('#saveBtn'); if (b) b.disabled = false; };
    $('#page').addEventListener('input', _markDirty);
    $('#page').addEventListener('change', _markDirty);
    $('#addToggle').addEventListener('click', () => { selected = '__new__'; renderList(); renderMain(); nav.afterSelect(); });
    $('#search').addEventListener('input', (e) => { term = e.target.value; renderList(); });
    $('#sort').addEventListener('change', (e) => { sortKey = e.target.value; renderList(); });

    // Pull the dish caps (System → Limits) so the number inputs show a max
    // hint. The server is the real guard; this just stops the spinner early.
    fetch('/system-config').then(r => r.ok ? r.json() : []).then(rows => {
      const m = {}; for (const s of rows) m[s.key] = s.value;
      if (m.dish_max_serpapi != null) _limits.serpapi = m.dish_max_serpapi;
      if (m.dish_max_final != null) _limits.final = m.dish_max_final;
      renderMain();  // re-render so the inputs pick up the max
    }).catch(() => {});

    loadDishes();
  </script>
</body>
</html>
