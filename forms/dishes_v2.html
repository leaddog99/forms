<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Best Cooks Club — Admin · Dishes (v2)</title>
  <!-- Dishes admin editor on the shared editor shell — THE dishes page (nav →
       here). Clone of the a/c/d/v template (the heaviest table); superseded the
       old forms/dishes.html (removed 2026-07-23). Wired to the real /dishes API.
       See memory/project_admin_editor_nav.md. -->
  <link rel="stylesheet" href="/forms/editor-shell.css?v=20260828b">
  <link rel="stylesheet" href="/forms/tokens.css?v=20260826b">
  <link rel="stylesheet" href="/forms/components.css?v=20260813b">
  <style>
    .d-check{ display:flex; align-items:center; gap:9px; }
    .d-check input{ width:auto; }
    .d-check label{ margin:0; text-transform:none; letter-spacing:0; font-size:.92em; color:var(--ink); }
    .ed-field .warn-hint{ color:var(--ed-warn); font-size:.78em; margin-top:5px; }
    .d-loglink{ color:var(--accent); text-decoration:none; }
    .d-loglink:hover{ text-decoration:underline; }
    /* Page-specific colors (tokens.css contract: --warn/--ok-class tokens stay in
       the page). ONE definition each — these were scattered inline per row. */
    .ec-band{ border-left:3px solid #8250df; background:rgba(130,80,223,.05); display:block; padding:9px 11px; }
    .ec-tag{ color:#8250df; font-weight:600; font-size:.82em; letter-spacing:.02em; }
    .ec-cite{ margin-top:5px; padding-left:9px; border-left:2px solid rgba(130,80,223,.35); color:var(--muted,#555); font-style:italic; font-size:.88em; }
    .ec-nocite{ margin-top:5px; color:var(--muted,#999); font-size:.82em; }
    .row-flag-warn{ background:#fdf0ee; }   /* editor demoted / disagreement */
    .row-flag-good{ background:#eef6ee; }   /* editor nominated */
    .row-flag-near{ background:#fbf3e9; }   /* near-miss / would've qualified */
    /* Search-line query box: grows with its content (autosized), never scrolls it
       out of sight. One visual line when short; wraps when long. */
    .qr-q{ resize:none; overflow:hidden; line-height:1.45; }
    /* Sortable stat header over the winners/cohort lists */
    .t10-sorthead{ display:flex; align-items:baseline; padding:2px 11px 6px; font-size:.62rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
    .t10-sorthead-legend{ font-size:.72rem; letter-spacing:0; text-transform:none; }
    .t10-sorthead [data-sortkey]{ cursor:pointer; text-align:right; }
    .t10-sorthead [data-sortkey]:hover{ color:var(--accent-dark); text-decoration:underline; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <button class="ed-back" id="edBack" aria-label="Toggle list"></button>
      <div class="ed-brand">Best Cooks Club · Dishes</div>
    </div>
  </header>
  <div class="ed-scrim" id="edScrim"></div>

  <div class="ed-app">
    <aside class="ed-sidebar">
      <div class="ed-sidebar-head">
        <input type="search" id="search" placeholder="Search dishes…" autofocus>
        <span class="ed-count" id="count"></span>
        <div class="ed-head-actions">
          <button class="ed-icon-btn" id="addToggle" title="New dish" aria-label="New dish">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>
      </div>

      <div class="ed-attn" id="attn"><div class="ed-attn-title" id="attnTitle"></div><div class="ed-attn-copy" id="attnCopy"></div></div>

      <div class="ed-controls" id="controls">
        <select id="sort" aria-label="Sort dishes">
          <option value="attention">Sort: needs attention</option>
          <option value="name">Sort: name (A–Z)</option>
          <option value="recipes">Sort: recipes kept (most)</option>
          <option value="updated">Sort: last refreshed</option>
        </select>
      </div>

      <div class="ed-legend">
        <span><i class="d ok"></i>fresh</span>
        <span><i class="d warn"></i>due / error</span>
        <span><i class="d none"></i>never run</span>
      </div>

      <ul class="ed-list" id="list"><li class="ed-empty">Loading…</li></ul>
    </aside>

    <main class="ed-content"><div class="ed-page" id="page"></div></main>
  </div>

  <script src="/forms/library-shell.js?v=20260830b"></script>
  <script>
    const $ = (s) => document.querySelector(s);

    LibraryShell.initNav({ currentPage: 'dishes' });
    const nav = LibraryShell.initEditorNav({
      backButton: '#edBack', scrim: '#edScrim',
      listLabel: 'Dishes', listMode: 'docked', shellWidth: 1200,
    });
    const { escapeHtml, fmtDate, flash, hostOf } = LibraryShell;

    let dishes = {};            // keyed by name
    let selected = null;        // dish name | '__new__'
    let term = '';
    let sortKey = 'attention';
    let _limits = { serpapi: 200, final: 200 };   // dish caps from System → Limits
    let _createPrefill = null;  // set from ?create=<name>, consumed by renderCreate
    // Harvest languages. Mirrors _LANG_NAMES in intake/translate.py — that list is
    // the source of truth (it decides what the translator can actually handle), so
    // add a language THERE first and reflect it here. '' = not stated.
    const SOURCE_LANGS = [
      ['', '— not stated (guess from the query) —'],
      ['en', 'English'], ['zh', 'Chinese'], ['ja', 'Japanese'], ['ko', 'Korean'],
      ['el', 'Greek'], ['it', 'Italian'], ['fr', 'French'], ['es', 'Spanish'],
      ['de', 'German'], ['pt', 'Portuguese'], ['ru', 'Russian'], ['tr', 'Turkish'],
      ['ar', 'Arabic'], ['he', 'Hebrew'], ['nl', 'Dutch'], ['pl', 'Polish'],
      ['sv', 'Swedish'], ['th', 'Thai'], ['vi', 'Vietnamese'], ['hi', 'Hindi'],
    ];

    /* ------------------------- search-line row editor -------------------------
       A dish's queries are ROWS {q, n, gl, hl}: each line is its own Google
       search with its own result count and locale; null = follow the dish
       (n → "SERP candidates", locale → "Sources in"), resolved at run time.
       Structured fields, not free-form syntax — the server validates again. */
    // Mirror of dishes._GL_FOR_LANG: country for languages whose code differs.
    const GL_FOR_LANG = {el:'gr', en:'us', ja:'jp', zh:'cn', ko:'kr', da:'dk', sv:'se', cs:'cz', uk:'ua'};
    const glForLang = (hl) => GL_FOR_LANG[hl] || hl;
    const QIN = 'padding:9px 11px;border:1px solid var(--line,#e2d6c3);border-radius:8px;font:inherit;box-sizing:border-box';

    function qRowHtml(r = {}){
      const langOpts = [['', '— dish default —'], ...SOURCE_LANGS.slice(1)]
        .map(([c, l]) => `<option value="${c}" ${(r.hl || '') === c ? 'selected' : ''}>${l}</option>`).join('');
      return `<div class="qrow" style="display:flex;gap:8px;margin-bottom:8px;align-items:flex-start">
        <textarea rows="1" class="qr-q" placeholder='verbatim query — "…" exact, -word / -site:… exclude' style="flex:1;min-width:0;${QIN}">${escapeHtml(r.q || '')}</textarea>
        <input type="number" class="qr-n" min="1" placeholder="dflt" title="Candidates fetched for THIS line (blank = the dish's SERP candidates default)" value="${r.n ?? ''}" style="width:70px;${QIN}">
        <select class="qr-hl" title="Search language for this line (dish default = follow 'Sources in')" style="width:150px;${QIN}">${langOpts}</select>
        <input type="text" class="qr-gl" maxlength="2" placeholder="auto" title="Google country index, 2-letter (auto-derived from the language; override for e.g. English-language results ranking in Greece: language English + country gr)" value="${escapeHtml(r.gl || '')}" style="width:56px;text-transform:lowercase;${QIN}">
        <input type="number" class="qr-keep" min="1" placeholder="—" title="Reserved winner seats for this line (ⓘ in the header explains)" value="${r.keep ?? ''}" style="width:56px;${QIN}">
        <button type="button" class="qr-del ed-btn" title="Remove line" style="padding:6px 10px">✕</button>
      </div>`;
    }

    function queryRowsBlockHtml(boxId){
      return `
        <div id="${boxId}">
          <div style="display:flex;gap:8px;margin-bottom:4px;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted,#6b5b4f)">
            <span style="flex:1">Query (verbatim)<button type="button" class="info-dot" data-info-title="Search lines — syntax, locales, examples" data-info="<b>Syntax</b> — <code>&quot;exact phrase&quot;</code> exact match (straight quotes; curly are auto-fixed) &middot; <code>-word</code> exclude pages with that word (drops EVERY page containing it) &middot; <code>-site:domain.com</code> exclude a site &middot; <code>site:gr</code> only that country&#39;s TLD.<br><b>Alternate phrasings go on their own lines</b> — each runs as a separate search and results merge; more reliable than <code>OR</code> (undocumented precedence). Blocklist exclusions are auto-appended each run (System &rarr; Search).<br><br><b>Results</b> — candidates fetched for that line only (blank = the dish&#39;s SERP-candidates default).<br><b>Language / Country</b> — WHICH Google answers, in what language (blank = follow Sources-in). They diverge on purpose: language <i>English</i> + country <code>gr</code> = English pages that rank in Greece — not the same as <code>site:gr</code>, since most Greek publishers aren&#39;t on .gr.<br><br><b>Examples</b><br><code>&quot;carrot cake&quot; recipe</code> + results blank + language dish-default &rarr; default count, follows Sources-in<br><code>γιουβαρλάκια αυγολέμονο</code> + results 120 + language Greek &rarr; 120 candidates from Greek Google, in Greek<br><code>moules frites</code> + language English + country fr &rarr; English-language pages that rank on google.fr">i</button></span><span style="width:70px">Results</span><span style="width:150px">Language</span><span style="width:56px">Country</span><span style="width:56px">Reserve<button type="button" class="info-dot" data-info-title="Reserved winner seats" data-info="Winners are normally seated purely by the authority ranking — and that ranking is biased toward the anglophone link graph. Measured on Soupe au Pistou: the French line&#39;s marmiton.org (DA&nbsp;83) lost every seat to US pages on page-authority alone.<br><br><b>Reserve</b> holds this many of the dish&#39;s winner seats for THIS line&#39;s own candidates, ranked among themselves by the same scoring. The remaining seats stay open to everyone (a reserved line&#39;s candidates can win those too — the reserve is a floor, not a cap). If the line can&#39;t fill its reserve, the unused seats return to the open pool.<br><br>Blank = no reservation; everything behaves as before.">i</button></span><span style="width:38px"></span>
          </div>
          <div class="qrows-list"></div>
          <button type="button" class="ed-btn qrows-add" style="padding:6px 12px">+ Add line</button>
        </div>`;
    }

    function initQueryRows(boxId, rows){
      const box = document.getElementById(boxId);
      const list = box.querySelector('.qrows-list');
      list.innerHTML = (rows && rows.length ? rows : [{}]).map(qRowHtml).join('');
      // Query boxes grow to fit their content — a long multi-operator query
      // wraps into view instead of scrolling out of sight.
      const autosize = (el) => { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; };
      list.querySelectorAll('.qr-q').forEach(autosize);
      const dirty = () => box.dispatchEvent(new Event('input', {bubbles: true}));
      box.querySelector('.qrows-add').addEventListener('click', () => {
        list.insertAdjacentHTML('beforeend', qRowHtml({}));
        const q = list.lastElementChild.querySelector('.qr-q');
        autosize(q); q.focus();
        dirty();
      });
      box.addEventListener('click', (e) => {
        const del = e.target.closest('.qr-del'); if (!del) return;
        const row = del.closest('.qrow');
        if (list.children.length > 1) row.remove();
        else {
          // Last line: ✕ means "start over" — clear EVERY field, not just the
          // text (leftover n/locale on an empty line would block the save).
          row.querySelector('.qr-q').value = ''; autosize(row.querySelector('.qr-q'));
          row.querySelector('.qr-n').value = '';
          row.querySelector('.qr-hl').value = '';
          row.querySelector('.qr-gl').value = '';
        }
        dirty();
      });
      box.addEventListener('input', (e) => {
        const q = e.target.closest('.qr-q'); if (q) autosize(q);
      });
      // A query is ONE search — Enter doesn't make newlines, it adds a line row.
      box.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.target.closest('.qr-q')){
          e.preventDefault();
          box.querySelector('.qrows-add').click();
        }
      });
      // Picking a language auto-fills its country; still editable afterwards.
      box.addEventListener('change', (e) => {
        const sel = e.target.closest('.qr-hl'); if (!sel) return;
        sel.closest('.qrow').querySelector('.qr-gl').value = sel.value ? glForLang(sel.value) : '';
      });
      // Belt-and-braces dirty signal (2026-08-30): the Reserve spinner edit
      // reached the value without tripping the #page input/change tracker for
      // the curator. Any key or mouse release on a line input IS an edit —
      // dispatch the same bubbling 'input' the add/del buttons use, but only
      // when a value actually differs from what the row rendered with, so
      // mere clicking around never lights Save falsely.
      const _vals = () => JSON.stringify([...box.querySelectorAll('input,textarea,select')].map(i => i.value));
      let _base = _vals();
      box.addEventListener('keyup', () => { if (_vals() !== _base) { _base = _vals(); dirty(); } });
      box.addEventListener('mouseup', () => setTimeout(() => {
        if (_vals() !== _base) { _base = _vals(); dirty(); } }, 0));
    }

    // "120 recs" almost bit twice (curator, 2026-08-28): "Default results per
    // line" reads as a RUN total, but three lines at 120 fetch 360. Say the
    // arithmetic where the number is typed. Sums per-line overrides where set.
    function paintFetchTotal(boxId, serpId, hintId){
      const hint = document.getElementById(hintId);
      const box = document.getElementById(boxId);
      if (!hint || !box) return;
      const dflt = parseInt(document.getElementById(serpId)?.value, 10) || 0;
      const ns = [...box.querySelectorAll('.qr-n')].map(i => parseInt(i.value, 10) || dflt);
      const total = ns.reduce((a, b) => a + b, 0);
      const hasOverride = [...box.querySelectorAll('.qr-n')].some(i => i.value.trim());
      hint.textContent = ns.length
        ? `${ns.length} line${ns.length === 1 ? '' : 's'}${hasOverride ? ' (with per-line overrides)' : ` × ${dflt}`} ≈ ${total} candidates fetched per run`
        : '';
    }
    // One delegated repaint: fires on any typing in the serp default or the
    // line rows (add/remove dispatch input too), for whichever form is open.
    document.addEventListener('input', () => {
      paintFetchTotal('qrows_edit', 'f_serp', 'fetchTotal_edit');
      paintFetchTotal('qrows_new', 'n_serp', 'fetchTotal_new');
    });

    function collectQueryRows(boxId){
      const out = [];
      for (const el of document.getElementById(boxId).querySelectorAll('.qrow')){
        const q = el.querySelector('.qr-q').value.trim();
        const nRaw = el.querySelector('.qr-n').value.trim();
        const hl = el.querySelector('.qr-hl').value || null;
        const glRaw = el.querySelector('.qr-gl').value.trim().toLowerCase();
        if (!q){
          // A line with settings but no query would silently vanish on save —
          // say so instead of quietly dropping the curator's work.
          if (nRaw !== '' || hl || glRaw)
            return {error: 'A search line has settings but no query text — type the query, or remove the line with ✕'};
          continue;
        }
        const n = nRaw === '' ? null : parseInt(nRaw, 10);
        if (nRaw !== '' && !(n > 0)) return {error: `Results for “${q}” must be a positive number`};
        if (glRaw && !/^[a-z]{2}$/.test(glRaw)) return {error: `Country for “${q}” must be a two-letter code`};
        const keepRaw = (el.querySelector('.qr-keep')?.value ?? '').trim();
        const keep = keepRaw === '' ? null : parseInt(keepRaw, 10);
        if (keepRaw !== '' && !(keep > 0)) return {error: `Reserve for “${q}” must be a positive number (or blank)`};
        out.push({q, n, gl: glRaw || (hl ? glForLang(hl) : null), hl, keep});
      }
      if (!out.length) return {error: 'At least one search query is required'};
      return {rows: out};
    }

    /* ----------------------------- derivations ----------------------------- */
    const fitOf = (d) => d.last_ou_fit || {};
    const isFit = (d) => !!fitOf(d).used;
    const isError = (d) => !!(d.last_run_status && String(d.last_run_status).startsWith('error'));
    const neverRun = (d) => !d.last_refreshed;
    function needsAttention(d){ return neverRun(d) || isError(d) || !!d.is_due; }
    function flag(d){
      if (neverRun(d)) return 'none';
      if (isError(d) || d.is_due) return 'warn';
      return 'ok';
    }
    function num(v, dgt = 4){ if (v == null) return '—'; const n = Number(v); return isFinite(n) ? n.toFixed(dgt) : '—'; }
    function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
    // Inline form-validation message next to Save/Create. ONE place sets the
    // warn color (was copy-pasted at every validation site).
    function warnHint(msg){ const h = $('#hint'); if (h){ h.style.color = 'var(--ed-warn)'; h.textContent = msg; } }
    function listMeta(d){
      if (neverRun(d)) return `${escapeHtml(d.chapter || '—')} · never run`;
      return `${escapeHtml(d.chapter || '—')} · ${d.last_run_count ?? 0} kept · ${fmtDate(d.last_refreshed)}`;
    }

    function sortedDishes(){
      const t = term.toLowerCase();
      const rows = Object.values(dishes).filter(d => !t || d.name.toLowerCase().includes(t) || (d.display_name || '').toLowerCase().includes(t) || (d.chapter || '').toLowerCase().includes(t));
      const sorters = {
        attention: (a, b) => (needsAttention(b) - needsAttention(a)) || a.name.localeCompare(b.name),
        name:    (a, b) => a.name.localeCompare(b.name),
        recipes: (a, b) => (b.last_run_count || 0) - (a.last_run_count || 0) || a.name.localeCompare(b.name),
        updated: (a, b) => String(b.last_refreshed || '').localeCompare(String(a.last_refreshed || '')) || a.name.localeCompare(b.name),
      };
      return rows.sort(sorters[sortKey] || sorters.attention);
    }

    /* ----------------------------- list ----------------------------- */
    function renderList(){
      const rows = sortedDishes();
      $('#count').textContent = `(${rows.length})`;
      const attn = Object.values(dishes).filter(needsAttention).length;
      const panel = $('#attn'), title = $('#attnTitle'), copy = $('#attnCopy');
      if (attn){ panel.classList.remove('none'); title.textContent = `${attn} need attention`; copy.textContent = 'Due for refresh, errored last run, or never run.'; }
      else { panel.classList.add('none'); title.textContent = 'All dishes fresh'; copy.textContent = 'Every dish has refreshed cleanly and is within TTL.'; }

      const ul = $('#list'); ul.innerHTML = '';
      if (!rows.length){ ul.innerHTML = '<li class="ed-empty">No matches</li>'; return; }
      for (const d of rows){
        const li = document.createElement('li');
        li.className = 'ed-item' + (d.name === selected ? ' selected' : '');
        li.innerHTML =
          `<div class="ed-item-top"><span class="ed-item-name">${escapeHtml(d.display_name || d.name)}</span><span class="ed-item-flag ${flag(d)}"></span></div>` +
          `<div class="ed-item-meta">${listMeta(d)}</div>`;
        li.addEventListener('click', () => { selected = d.name; renderList(); renderMain(); nav.afterSelect(); });
        ul.appendChild(li);
      }
    }

    /* ----------------------------- dispatch ----------------------------- */
    function dish(){ return dishes[selected]; }
    function renderMain(){
      if (selected === '__new__') return renderCreate();
      const d = dish();
      if (!d){ const first = sortedDishes()[0]; selected = first ? first.name : null; if (!selected){ $('#page').innerHTML = '<div class="ed-block" style="border-top:none"><p class="ed-empty-fit">No dishes yet.</p></div>'; return; } return renderMain(); }
      renderDetail(d);
    }

    // One spec per fit model — formula line, coefficient labels, and the DA-80
    // spot check all read from here (fmtCoeffs/coeffVars had the same
    // model-switch written twice; adding a model meant editing both).
    const FIT_MODELS = {
      linear:    { line: c => `predicted PA  =  ${num(c[0],4)}·DA  +  ${num(c[1],2)}`,
                   vars: c => `slope·DA ${num(c[0],4)} · intercept ${num(c[1],2)}`,
                   pa80: c => c[0]*80 + c[1] },
      quadratic: { line: c => `predicted PA  =  ${num(c[0],4)}·DA²  +  ${num(c[1],4)}·DA  +  ${num(c[2],2)}`,
                   vars: c => `DA² ${num(c[0],4)} · DA ${num(c[1],4)} · intercept ${num(c[2],2)}`,
                   pa80: c => c[0]*6400 + c[1]*80 + c[2] },
      power:     { line: c => `predicted PA  =  ${num(c[0],4)}·DA ^ ${num(c[1],4)}`,
                   vars: c => `scale ${num(c[0],4)} · exponent ${num(c[1],4)}`,
                   pa80: c => c[0]*Math.pow(80, c[1]) },
    };
    function fmtCoeffs(f){
      if (!f || !f.coefficients) return '';
      const c = f.coefficients.map(Number), m = FIT_MODELS[f.model];
      if (!m) return c.map(x => num(x,4)).join(', ');
      const pa80 = m.pa80(c);
      return `${m.line(c)}<span class="ex">at DA 80  →  PA ≈ ${isFinite(pa80) ? pa80.toFixed(1) : '—'}</span>`;
    }
    function coeffVars(f){
      const c = (f.coefficients || []).map(Number), m = FIT_MODELS[f.model];
      return m ? m.vars(c) : c.map(x => num(x,4)).join(', ');
    }

    function fitBlock(d){
      const f = fitOf(d);
      if (!isFit(d)){
        return `<section class="ed-block"><h3 class="ed-block-label">OU fit</h3>
          <p class="ed-empty-fit">No usable fit yet${f.n != null ? ` — only <strong>${f.n}</strong> scored records (needs ≥ 25)` : ''}. The dish grades against its <strong>chapter</strong> cohort until it has enough of its own.</p></section>`;
      }
      const q = f.r2_chosen >= 0.75 ? 'excellent' : f.r2_chosen >= 0.6 ? 'healthy' : f.r2_chosen >= 0.45 ? 'moderate' : 'weak';
      const candStr = ['linear','quadratic','power'].map(m => {
        const v = num(f['r2_' + m], 3);
        return m === f.model ? `<strong>${m} ${v}</strong>` : `${m} ${v}`;
      }).join(' <span class="sub">·</span> ');
      const sEff = f.sigma_effective, floored = (f.exc_sigma_floor != null && Number(sEff) > Number(f.sigma_observed));
      return `
        <section class="ed-block">
          <details class="ed-accordion">
            <summary>OU fit <span class="sub">· R² ${num(f.r2_chosen,2)} · ${q}</span></summary>
            <div class="ed-kv" style="margin-top:12px">
              <div class="k">Model type</div><div class="v">${cap(f.model)} regression</div>
              <div class="k">Regression</div><div class="v">page authority (PA) ~ domain authority (DA)</div>
              <div class="k">Fitted coefficients</div><div class="v">${coeffVars(f)}</div>
              <div class="k">Source-site records</div><div class="v">${f.n ?? '—'}</div>
              <div class="k">Coefficient of determination</div><div class="v">R² = ${num(f.r2_chosen,2)} <span class="sub">· ${q}</span></div>
              <div class="k">Residual scatter (σ)</div><div class="v">${num(f.sigma_observed,2)}</div>
              <div class="k">Effective σ</div><div class="v">${num(sEff,2)} <span class="sub">· floor ${num(f.exc_sigma_floor,1)}${floored ? ' (applied)' : ''}</span></div>
              <div class="k">Candidate fits</div><div class="v">${candStr}</div>
              <div class="k">Grade scale</div><div class="v">base ${f.exc_base ?? '—'} <span class="sub">· σ×${f.exc_sigma_mult ?? '—'}</span></div>
            </div>
            <h3 class="ed-block-label" style="margin-top:18px">Predicted authority model</h3>
            <pre class="ed-formula">${fmtCoeffs(f)}</pre>

    }

    function renderDetail(d){

            <p class="ed-notes-help" style="margin:10px 0 12px">URLs that ranked but were dropped (extract/save, or an anti-bot <b>fetch-fail</b>). <b>“would’ve qualified”</b> = its OU beats the cut bar, so it's worth recovering manually — open the link, run the bookmarklet, save normally.</p>

            <p class="ed-notes-help" style="margin:10px 0 12px">Every URL the last run looked at, not just the winners.<button type="button" class="info-dot" data-info-title="Candidate ledger" data-info="<b>Reconsiderable</b> = dropped by a judgement we could argue with (the OU floor, a detection miss, a missing Moz score). Drops that are matters of <b>fact</b> — your blocklist, an archive page, a roundup — are counted but not listed, because nothing should overturn them.">i</button></p>

            <div style="display:flex;gap:8px;align-items:center;margin:0 0 10px">
              <button type="button" class="ed-btn" id="sigMeasureBtn" title="(Re-)measure this dish's cohort signals — one corpus scan, nothing billable">📊 Measure</button>
              <span class="ed-save-hint" id="sigHint"></span>
            </div>
            <div id="sigBody"><p class="ed-empty-fit">Loading&hellip;</p></div>
          </details>
        </section>

        <section class="ed-block">
          <details class="ed-accordion" id="dpcAcc">
            <summary>Product classes <span class="ed-pill" id="dpcPill" style="margin-left:6px"></span></summary>
            <p class="ed-notes-help" style="margin:10px 0 12px">The classes worth advertising beside this dish's recipes — <b>only what you approve can ever render</b>, and decisions save instantly.<button type="button" class="info-dot" data-info-title="Product classes" data-info="<b>✨ Propose</b> interprets the measured cohort signals (one model call); every proposal cites its evidence. Approved and rejected decisions survive re-proposal. Tier: 1 = the dish&#39;s differentiators (lead the block), 2 = core gear, 3 = optional/implied. <b>Decisions save instantly</b> on click — the form&#39;s Save button is for search config only and stays quiet here.">i</button></p>
            <div style="display:flex;gap:8px;align-items:center;margin:0 0 10px">
              <button type="button" class="ed-btn" id="dpcProposeBtn" title="Run the proposal job for this dish (~one Sonnet call)">✨ Propose</button>
              <span class="ed-save-hint" id="dpcHint"></span>

            <div id="dpcBody"><p class="ed-empty-fit">Loading&hellip;</p></div>

        <section class="ed-block">

            <div class="ed-kv" style="margin-top:12px">
              <div class="k">Identity card</div><div class="v">${(d.identity_card_present ?? !!d.identity_card) ? 'captured' : 'none'}</div>
              <div class="k">Embedding</div><div class="v">${d.embedding_model ? escapeHtml(d.embedding_model) + ' · ' + fmtDate(d.embedding_updated_at) : 'none'}</div>
              <div class="k">Created</div><div class="v">${fmtDate(d.created_at)}</div>

        <div class="ed-actions">

      $('#purposeToggle').addEventListener('click', () => {

      paintFetchTotal('qrows_edit', 'f_serp', 'fetchTotal_edit');
      $('#saveBtn').addEventListener('click', () => doSave(d));
      $('#refreshBtn').addEventListener('click', () => doRefresh(d));
      $('#deleteBtn').addEventListener('click', () => doDelete(d));
      $('#saveBtn').disabled = true;   // enabled by the dirty-tracker on first edit
      loadTopRecipes(d.name);
      loadCohort(d.name);

      loadCandidates(d.name);
      loadEditorsChoice(d.name);

      // Lazy: signals fetch only when the accordion first opens — the JSON is

    // Candidate ledger for the last run (docs/ai-editor-mediation.md). The Rejects
    // panel above shows only what died at extract/save; this shows the whole funnel,
    // including the 35-of-78 an OU floor can discard without leaving a trace anywhere
    // but a log file. Facts are counted, never listed — listing them invites someone
    // to argue with the blocklist.
    async function loadCandidates(name){
      const wrap = $('#candlist'); if(!wrap) return;
      try {
        const r = await fetch(`/candidates?collection_type=dish&collection_key=${encodeURIComponent(name)}`);
        if(!r.ok){ wrap.innerHTML = `<li class="ed-empty-fit">Couldn’t load the candidate ledger (HTTP ${r.status}).</li>`; return; }
        const d = await r.json();
        const rec = d.reconsider || [];
        const cnt = $('#candCount'); if(cnt) cnt.textContent = rec.length || '';
        const sum = $('#candSummary');
        if(sum){
          const s = d.summary || {};
          const total = Object.values(s).reduce((a,b)=>a+b,0);
          sum.innerHTML = total
            ? `<div class="k">Considered</div><div class="v">${total}</div>
               <div class="k">Kept</div><div class="v">${s.kept || 0}</div>
               <div class="k">Reconsiderable</div><div class="v">${rec.length}</div>
               <div class="k">Settled as fact</div><div class="v">${d.excluded_as_fact || 0}</div>`
            : '';
        }
        if(!total_or_zero(d)){ wrap.innerHTML = '<li class="ed-empty-fit">No ledger yet — it is written by the next run.</li>'; return; }
        // The editor's shadow verdicts on the KEPT set, shown above the drops: a
        // demote is the disagreement worth reading first, and it is advisory only
        // (applied=false) until Phase 2. Ordered by the editor's own ranking so the
        // reordering is legible next to the arithmetic's.
        const kept = (d.kept || []).filter(k => k.mediation);
        const ed = $('#candEditor');
        if (ed) {
          if (!kept.length) { ed.innerHTML = d.mediated ? '' :
            '<p class="ed-notes-help" style="margin:0 0 12px">No editorial review of this run yet.</p>'; }
          else {
            kept.sort((a,b) => (a.mediation.ordinal_rank||99) - (b.mediation.ordinal_rank||99));
            ed.innerHTML = `<p class="ed-notes-help" style="margin:0 0 8px"><b>AI editor — advisory only.</b> Its ranking and bands are recorded, not applied.</p>
              <ol class="ed-t10">` + kept.map(k => {
              const m = k.mediation, moved = (m.ordinal_rank && m.ordinal_rank !== k.final_rank);
              const bad = m.verdict === 'demote';
              return `<li class="ed-t10-row${bad ? ' row-flag-warn' : ''}">
                <span class="ed-t10-main">
                  <span class="ed-t10-name"><a href="${escapeHtml(k.url)}" target="_blank" rel="noopener">${escapeHtml(k.title || k.url)}</a>
                    <span class="ed-t10-grade" title="editor's verdict">${escapeHtml(m.verdict)}</span>
                    ${moved?`<span class="ed-t10-grade" title="editor's rank vs the run's">#${m.ordinal_rank} was #${k.final_rank}</span>`:''}</span>
                  <span class="ed-t10-sub">${escapeHtml(m.evidence || '')}</span>
                </span>
                <span class="ed-t10-stats">
                  <span class="ed-t10-stat score"><span class="v">${m.band != null ? m.band.toFixed(1) : '—'}</span><span class="l">band</span></span>
                </span>
              </li>`; }).join('') + '</ol>';
          }
        }
        if(!rec.length){ wrap.innerHTML = '<li class="ed-empty-fit">Nothing to reconsider: every drop was a matter of fact.</li>'; return; }
        wrap.innerHTML = rec.map(x => {
          const host = hostOf(x.url);
          const near = x.stage === 'rank_cut';
          const nom = x.mediation && x.mediation.verdict === 'nominate';
          return `<li class="ed-t10-row${nom ? ' row-flag-good' : (near ? ' row-flag-near' : '')}">
            <span class="ed-t10-main">
              <span class="ed-t10-name"><a href="${escapeHtml(x.url)}" target="_blank" rel="noopener">${escapeHtml(x.title || host)}</a>
                <span class="ed-t10-grade" title="stage it was dropped at">${escapeHtml(x.stage)}</span>
                ${nom?'<span class="ed-t10-grade" title="the editor thinks this is worth fetching and judging properly">nominated</span>':''}</span>
              <span class="ed-t10-sub">${escapeHtml(x.reason || '')}</span>
            </span>
            <span class="ed-t10-stats">
              <span class="ed-t10-stat score"><span class="v">${typeof x.ou==='number'?x.ou.toFixed(1):'—'}</span><span class="l">ou</span></span>
              <span class="ed-t10-stat pct"><span class="v">${x.da ?? '—'}</span><span class="l">da</span></span>
              <span class="ed-t10-stat pct"><span class="v">${x.pa ?? '—'}</span><span class="l">pa</span></span>
            </span>
          </li>`;
        }).join('');
      } catch(e){ wrap.innerHTML = `<li class="ed-empty-fit">${escapeHtml(String(e.message||e))}</li>`; }
    }
    // An empty ledger is a legitimate state (no run since it shipped), not an error.
    function total_or_zero(d){
      return Object.values(d.summary || {}).reduce((a,b)=>a+b,0) > 0;
    }

    // Rejects from the last run — URLs that ranked but were dropped (extract/
    // save, or an anti-bot fetch-fail authority-scored in Phase A). "would've
    // qualified" = OU beats the cut bar (bottom_ou) → worth a manual recovery.
    async function loadSignals(name){
      const body = $('#sigBody'), pill = $('#sigPill');
      if (!body) return;
      let sig;
      try {
        const r = await fetch(`/dishes/${encodeURIComponent(name)}/signals`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        sig = await r.json();
      } catch (e) {
        body.innerHTML = `<p class="ed-empty-fit">Couldn’t load (${escapeHtml(String(e.message || e))}).</p>`;
        return;
      }
      if (!sig || !sig.cohort_n){
        body.innerHTML = '<p class="ed-empty-fit">Not measured yet — click <b>📊 Measure</b> above.</p>';
        return;
      }
      if (pill) pill.textContent = `${sig.cohort_n} recipes · ${fmtDate(sig.computed_at)}`;
      const liftCls = (l) => l >= 10 ? 'font-weight:700' : (l < 3 ? 'color:var(--muted)' : '');
      // Fixed 1-decimal everywhere — "5x" next to "13.4x" breaks the column;
      // every number carries exactly one decimal so the digits align.
      const n1 = (v) => (typeof v === 'number' ? v.toFixed(1) : '—');
      // Sortable columns. Default = term A–Z; clicking a numeric column sorts
      // DESC first (that's the reading you want from a measurement column),
      // clicking again flips. Each table keeps its own state.
      const renderTable = (holderId, rows, withEx, state) => {
        const arrow = (k) => state.key === k ? (state.dir === 1 ? ' ▲' : ' ▼') : '';
        const th = (k, label, right) =>
          `<th style="padding:3px 8px${right ? ';text-align:right' : ';text-align:left'}">
             <button type="button" data-sort="${k}" style="all:unset;cursor:pointer;color:var(--muted);font-size:1em">${label}${arrow(k)}</button></th>`;
        const sorted = [...rows].sort((a, b) => {
          const A = a[state.key], B = b[state.key];
          if (typeof A === 'string') return A.localeCompare(B) * state.dir;
          return ((A ?? -1) - (B ?? -1)) * state.dir;
        });
        const holder = document.getElementById(holderId);
        holder.innerHTML = `
        <table style="width:100%;border-collapse:collapse;font-size:.85em">
          <thead><tr style="color:var(--muted);font-size:.85em">
            ${th('term', 'term', false)}${th('pct', 'of cohort', true)}${th('lift', 'lift', true)}
            ${withEx ? '<th style="padding:3px 0 3px 8px;text-align:left">example line</th>' : ''}
          </tr></thead><tbody>
          ${sorted.map(r => `<tr style="border-top:1px solid var(--line,#eee)">
            <td style="padding:3px 8px 3px 0;${liftCls(r.lift)}">${escapeHtml(r.term)}</td>
            <td style="padding:3px 8px;text-align:right;font-variant-numeric:tabular-nums">${n1(r.pct)}%</td>
            <td style="padding:3px 8px;text-align:right;font-variant-numeric:tabular-nums;${liftCls(r.lift)}">${n1(r.lift)}×</td>
            ${withEx ? `<td style="padding:3px 0 3px 8px;color:var(--muted)" title="${escapeHtml((r.examples || []).join('\n'))}">${escapeHtml((r.examples || [''])[0])}</td>` : ''}
          </tr>`).join('')}
          </tbody></table>`;
        holder.querySelectorAll('[data-sort]').forEach(b => b.addEventListener('click', () => {
          const k = b.dataset.sort;
          if (state.key === k) state.dir *= -1;
          else { state.key = k; state.dir = (k === 'term') ? 1 : -1; }  // numeric → desc first
          renderTable(holderId, rows, withEx, state);
        }));
      };
      const prov = sig.provenance || {};
      const provBits = [...Object.entries(prov.ethnicities || {}), ...Object.entries(prov.regions || {})]
        .map(([k, v]) => `${escapeHtml(k)} (${v})`).join(' · ');
      body.innerHTML = `
        <h4 style="margin:0 0 6px;font-size:.85em">Ingredients</h4><div id="sigTblIng"></div>
        <h4 style="margin:14px 0 6px;font-size:.85em">Equipment</h4><div id="sigTblEq"></div>
        ${provBits ? `<h4 style="margin:14px 0 6px;font-size:.85em">Provenance</h4><p style="margin:0;font-size:.85em;color:var(--muted)">${provBits}</p>` : ''}`;
      renderTable('sigTblIng', sig.ingredients || [], true, { key: 'term', dir: 1 });
      renderTable('sigTblEq', sig.equipment || [], false, { key: 'term', dir: 1 });
    }

    /* ---------------- product-class approve chips (step 4) ---------------- */
    async function loadClassProposals(name){
      const body = $('#dpcBody'), pill = $('#dpcPill');
      if (!body) return;
      let d;
      try {
        const r = await fetch(`/dishes/${encodeURIComponent(name)}/class-proposals`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        d = await r.json();
      } catch (e) {
        body.innerHTML = `<p class="ed-empty-fit">Couldn’t load (${escapeHtml(String(e.message || e))}).</p>`;
        return;
      }
      const rows = d.rows || [];
      if (pill) pill.textContent = rows.length
        ? `${rows.filter(r => r.status === 'approved').length}✓ / ${rows.filter(r => r.status === 'proposed').length} proposed`
        : '';
      if (!rows.length){
        body.innerHTML = '<p class="ed-empty-fit">No proposals yet — press ✨ Propose.</p>';
        return;
      }
      const ev = (r) => (r.evidence || []).map(e =>
        e.pct != null ? `${escapeHtml(e.term)} ${Number(e.pct).toFixed(1)}%/${Number(e.lift).toFixed(1)}×`
                      : escapeHtml(e.term)).join(', ');
      const row = (r) => {
        const dim = r.status === 'rejected';
        const border = r.status === 'approved' ? '3px solid var(--accent)' :
                       r.status === 'rejected' ? '3px solid var(--line,#ddd)' : '3px solid #d9a514';
        const acts = r.status === 'proposed'
          ? `<button type="button" class="ed-btn dpc-act" data-cls="${escapeHtml(r.class_name)}" data-status="approved" style="padding:2px 10px">✓ Approve</button>
             <button type="button" class="ed-btn dpc-act" data-cls="${escapeHtml(r.class_name)}" data-status="rejected" style="padding:2px 10px">✕ Reject</button>`
          : `<button type="button" class="ed-btn dpc-act" data-cls="${escapeHtml(r.class_name)}" data-status="proposed" style="padding:2px 10px" title="Back to proposed">↩ ${r.status === 'approved' ? 'Revoke' : 'Restore'}</button>`;
        const tierSel = `<select class="dpc-tier" data-cls="${escapeHtml(r.class_name)}" style="padding:2px 4px;font:inherit;font-size:.82em" ${dim ? 'disabled' : ''}>
          ${[1,2,3].map(t => `<option value="${t}" ${r.tier === t ? 'selected' : ''}>T${t}</option>`).join('')}</select>`;
        return `<div style="display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-left:${border};margin-bottom:8px;background:var(--card,#fff);border-radius:0 8px 8px 0;${dim ? 'opacity:.55' : ''}">
          <div style="flex:1;min-width:0">
            <div><b>${escapeHtml(r.class_name)}</b>
              <span class="ed-pill" style="margin-left:6px">${escapeHtml(r.family)}</span>
              <span style="font-size:.76em;color:var(--muted)">${escapeHtml(r.pattern)} · ${escapeHtml(r.route)}</span>
              ${r.new_class ? '<span class="ed-pill" title="This class was created by the proposal — not yet a settled registry entry" style="margin-left:4px">new class</span>' : ''}</div>
            <div style="font-size:.82em;color:var(--muted);margin-top:2px">${escapeHtml(r.rationale || '')}</div>
            ${(r.evidence || []).length ? `<div style="font-size:.78em;color:var(--muted);margin-top:2px">evidence: ${ev(r)}</div>` : ''}
          </div>
          <div style="display:flex;gap:6px;align-items:center;flex:0 0 auto">${tierSel}${acts}</div>
        </div>`;
      };
      const grp = (label, list) => list.length
        ? `<h4 style="margin:12px 0 6px;font-size:.85em">${label} (${list.length})</h4>${list.map(row).join('')}` : '';
      body.innerHTML =
        grp('Proposed', rows.filter(r => r.status === 'proposed'))
        + grp('Approved', rows.filter(r => r.status === 'approved'))
        + grp('Rejected', rows.filter(r => r.status === 'rejected'));
      // Chip decisions SAVE INSTANTLY (their own transactions, like medals) —
      // the form's Save button is for search config only and correctly never
      // lights up here. Found 2026-08-29: without saying so, an approve read
      // as "didn't take". So: flash on success, loud hint on failure.
      const _update = async (payload, okMsg) => {
        const r = await fetch(`/dishes/${encodeURIComponent(name)}/class-proposals/update`, {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)});
        if (r.ok) { flash(okMsg); }
        else {
          const d = await r.json().catch(() => ({}));
          flash(`✗ not saved: ${d.detail || 'HTTP ' + r.status}` +
                (r.status === 401 || r.status === 403 ? ' — unlock admin from the header' : ''));
        }
        return r.ok;
      };
      body.querySelectorAll('.dpc-act').forEach(b => b.addEventListener('click', async () => {
        b.disabled = true;
        await _update({ class_name: b.dataset.cls, status: b.dataset.status },
                      `✓ ${b.dataset.cls} ${b.dataset.status} — saved`);
        loadClassProposals(name);
      }));
      body.querySelectorAll('.dpc-tier').forEach(s => s.addEventListener('change', () =>
        _update({ class_name: s.dataset.cls, tier: parseInt(s.value, 10) },
                `✓ ${s.dataset.cls} → T${s.value} — saved`)));
    }

    async function runProposals(name){
      const btn = $('#dpcProposeBtn'), hint = $('#dpcHint');
      btn.disabled = true; hint.textContent = 'proposing…';
      try {
        const r = await fetch(`/dishes/${encodeURIComponent(name)}/class-proposals/run`, { method: 'POST' });
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || `HTTP ${r.status}`);
        // Poll the job to completion (~15s: one model call), then reload.
        for (let i = 0; i < 45; i++){
          await new Promise(x => setTimeout(x, 2000));
          const j = await fetch(`/jobs/${d.job_id}`).then(x => x.json()).catch(() => null);
          if (j && j.status && j.status !== 'running' && j.status !== 'queued'){
            // The job is 'success' even when its one dish FAILED (per-dish
            // try/except) — read the result so a bad model reply says so
            // instead of leaving a silent empty panel (alla colatura, #1213).
            let res = {};
            try { res = typeof j.result === 'string' ? JSON.parse(j.result) : (j.result || {}); } catch (e) {}
            if (j.status === 'success' && res.failed && !res.proposed) {
              hint.textContent = '✗ the model reply was unusable — run ✨ Propose again';
            } else {
              hint.textContent = j.status === 'success' ? '✓ proposals updated' : `job ${j.status}`;
            }
            await loadClassProposals(name);
            btn.disabled = false;
            return;
          }
        }
        hint.textContent = 'still running — reopen the panel in a moment';
      } catch (e) {
        hint.textContent = `failed: ${e.message || e}`;
      }
      btn.disabled = false;
    }

    async function loadScores(name){
      const body = $('#scoresBody'), pill = $('#scoresPill');
      if (!body) return;
      let sig;
      try {
        const r = await fetch(`/dishes/${encodeURIComponent(name)}/signals`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        sig = await r.json();
      } catch (e) {
        body.innerHTML = `<p class="ed-empty-fit">Couldn’t load (${escapeHtml(String(e.message || e))}).</p>`;
        return;
      }
      const a = sig.authority || {};
      if (!sig.cohort_n || (!a.da && !a.pa && !a.ou)){
        body.innerHTML = '<p class="ed-empty-fit">Not measured yet — <b>📊 Measure</b> in Cohort signals stamps the scores too.</p>';
        return;
      }
      if (pill) pill.textContent = `${sig.cohort_n} recipes · ${fmtDate(sig.computed_at)}`;
      const n1 = (v) => (typeof v === 'number' ? v.toFixed(1) : '—');
      const row = (label, s, note) => s ? `
        <tr style="border-top:1px solid var(--line,#eee)">
          <td style="padding:4px 8px 4px 0"><b>${label}</b> <span style="color:var(--muted);font-size:.85em">${note}</span></td>
          <td style="padding:4px 8px;text-align:right;font-variant-numeric:tabular-nums">${n1(s.mean)}</td>
          <td style="padding:4px 8px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)">${n1(s.median)}</td>
          <td style="padding:4px 0 4px 8px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)">${s.n}</td>
        </tr>` : '';
      body.innerHTML = `
        <table style="width:100%;border-collapse:collapse;font-size:.9em;max-width:520px">
          <thead><tr style="color:var(--muted);font-size:.8em">
            <th style="text-align:left;padding:3px 8px 3px 0">metric</th>
            <th style="text-align:right;padding:3px 8px">mean</th>
            <th style="text-align:right;padding:3px 8px">median</th>
            <th style="text-align:right;padding:3px 0 3px 8px">n</th>
          </tr></thead><tbody>
          ${row('DA', a.da, 'domain authority — who covers this dish')}
          ${row('PA', a.pa, 'page authority — how strong the pages are')}
          ${row('OU', a.ou, 'effective OU — selection-dependent, read with care')}
          </tbody></table>`;
    }

    async function runSignals(name){
      const btn = $('#sigMeasureBtn'), hint = $('#sigHint');
      btn.disabled = true; hint.textContent = 'measuring…';
      try {
        const r = await fetch(`/dishes/${encodeURIComponent(name)}/signals/run`, { method: 'POST' });
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || `HTTP ${r.status}`);
        // Poll to completion — a single-dish measure is one corpus scan (~seconds).
        for (let i = 0; i < 30; i++){
          await new Promise(x => setTimeout(x, 1500));
          const j = await fetch(`/jobs/${d.job_id}`).then(x => x.json()).catch(() => null);
          if (j && j.status && j.status !== 'running' && j.status !== 'queued'){
            hint.textContent = j.status === 'success' ? '✓ signals updated' : `job ${j.status}`;
            await loadSignals(name);
            loadScores(name);
            btn.disabled = false;
            return;
          }
        }
        hint.textContent = 'still running — reopen the panel in a moment';
      } catch (e) {
        hint.textContent = `failed: ${e.message || e}`;
      }
      btn.disabled = false;
    }

    async function loadRejects(name){
      const wrap = $('#rejectlist'); if(!wrap) return;
      try {
        const r = await fetch(`/dishes/${encodeURIComponent(name)}/rejects`);
        if(!r.ok){ wrap.innerHTML = `<li class="ed-empty-fit">Couldn’t load rejects (HTTP ${r.status}).</li>`; return; }
        const data = await r.json();
        const bar = data.bottom_ou;
        const rejects = data.rejects || [];
        const cnt = $('#rejCount'); if(cnt) cnt.textContent = rejects.length || '';
        if(!rejects.length){ wrap.innerHTML = '<li class="ed-empty-fit">No rejects on the last run.</li>'; return; }
        const ouOf = (x) => (typeof x.ou === 'number' ? x.ou : -999);
        const qual = (x) => (bar != null && typeof x.ou === 'number' && x.ou >= bar);
        rejects.sort((a,b) => (qual(b)-qual(a)) || (ouOf(b)-ouOf(a)));
        wrap.innerHTML = rejects.map(x => {
          const q = qual(x);
          const antibot = /anti-bot|fetch-fail/i.test(x.reason || '');
          const host = hostOf(x.url);
          return `<li class="ed-t10-row${q ? ' row-flag-near' : ''}">
            <span class="ed-t10-main">
              <span class="ed-t10-name"><a href="${escapeHtml(x.url)}" target="_blank" rel="noopener">${escapeHtml(host)}</a>${q?' <span class="ed-t10-grade" title="OU beats the cut bar">would’ve qualified</span>':''}${antibot?' <span class="ed-t10-grade" title="likely anti-bot block">anti-bot?</span>':''}</span>
              <span class="ed-t10-sub">${escapeHtml(x.reason || '')}</span>
            </span>
            <span class="ed-t10-stats">
              <span class="ed-t10-stat score"><span class="v">${typeof x.ou==='number'?x.ou.toFixed(1):'—'}</span><span class="l">ou</span></span>
              <span class="ed-t10-stat pct"><span class="v">${x.da ?? '—'}</span><span class="l">da</span></span>
              <span class="ed-t10-stat pct"><span class="v">${x.pa ?? '—'}</span><span class="l">pa</span></span>
            </span>
          </li>`;
        }).join('');
      } catch(e){ wrap.innerHTML = `<li class="ed-empty-fit">${escapeHtml(String(e.message||e))}</li>`; }
    }

    // Shared row for both the winners list and the cohort list. rank_score
    // is the headline; ou% / pwr% sit in fixed-width right-aligned columns
    // (.ed-t10-stats) so the numbers line up straight down each column.
    // Caller maps its payload to {rank_score, ou_pct, pwr_pct, name, domain,
    // thumb, grade, selected, href, title}.
    // Why a scored candidate isn't a winner — so a high-authority also-ran reads
    // "not selected · too thin" instead of looking like a ranking bug.
    const STATUS_LBL = { too_thin:'too thin', extract_failed:'couldn’t extract',
      save_failed:'save failed', fetch_failed:'fetch blocked', rejected:'rejected',
      reserve:'below the cut' };
    // Sortable stat columns over a scoreRow list. Column widths mirror
    // .ed-t10-stat.score/.pct so the headers sit over their numbers; the
    // legend slot SAYS what "score" is instead of leaving it a bare number.
    const SORT_COLS = [['rank_score', 'score', 48], ['ou_pct', 'ou%', 32], ['pwr_pct', 'pwr%', 32]];
    function statHeaderHtml(sort, legend){
      const th = SORT_COLS.map(([k, lbl, w]) =>
        `<span data-sortkey="${k}" title="sort by ${lbl}" style="width:${w}px">${lbl}${sort.key === k ? (sort.dir < 0 ? ' ▾' : ' ▴') : ''}</span>`).join('');
      return `<li class="t10-sorthead"><span class="t10-sorthead-legend">${legend || ''}</span><span style="margin-left:auto;display:flex;gap:14px">${th}</span></li>`;
    }
    // One list = one sort state; header clicks re-sort locally (no refetch).
    // `render` paints header + rows; delegation survives the innerHTML swaps.
    function sortableStatList(wrap, rows, legend, prefixHtml){
      const sort = {key: 'rank_score', dir: -1};
      const render = () => {
        const v = (x) => (typeof x[sort.key] === 'number' ? x[sort.key] : -Infinity);
        const sorted = rows.slice().sort((a, b) => sort.dir < 0 ? v(b) - v(a) : v(a) - v(b));
        wrap.innerHTML = (prefixHtml || '') + statHeaderHtml(sort, legend)
          + sorted.map((x, i) => scoreRow(x, i)).join('');
      };
      wrap.addEventListener('click', (e) => {
        const h = e.target.closest('[data-sortkey]'); if (!h) return;
        e.preventDefault();
        const k = h.getAttribute('data-sortkey');
        if (sort.key === k) sort.dir = -sort.dir; else { sort.key = k; sort.dir = -1; }
        render();
      });
      render();
    }

    function scoreRow(r, i){
      const thumb = r.thumb ? `<span class="ed-t10-thumb"><img src="${escapeHtml(r.thumb)}" alt="" loading="lazy"></span>` : `<span class="ed-t10-thumb"></span>`;
      const star  = r.selected ? ' <span class="ed-t10-grade" title="selected winner">★</span>' : '';
      const grade = r.grade ? ` <span class="ed-t10-grade">${escapeHtml(r.grade)}</span>` : '';
      const statusChip = (!r.selected && r.status && STATUS_LBL[r.status])
        ? ` <span class="ed-t10-status" title="scored on authority, but not a kept winner">not selected · ${STATUS_LBL[r.status]}</span>` : '';
      const rk  = (typeof r.rank_score === 'number') ? r.rank_score.toFixed(1) : '—';
      const oup = (typeof r.ou_pct === 'number') ? Math.round(r.ou_pct) : '—';
      const pwp = (typeof r.pwr_pct === 'number') ? Math.round(r.pwr_pct) : '—';
      return `<a class="ed-t10-row" href="${escapeHtml(r.href || '#')}" target="_blank" rel="noopener" title="${escapeHtml(r.title || 'Open')}">
          <span class="ed-t10-rank">${i + 1}</span>${thumb}
          <span class="ed-t10-main"><span class="ed-t10-name">${escapeHtml(r.name)}${star}</span><span class="ed-t10-sub">${escapeHtml(r.domain)}${grade}${statusChip}</span></span>
          <span class="ed-t10-stats">
            <span class="ed-t10-stat score"><span class="v">${rk}</span><span class="l">score</span></span>
            <span class="ed-t10-stat pct"><span class="v">${oup}</span><span class="l">ou%</span></span>
            <span class="ed-t10-stat pct"><span class="v">${pwp}</span><span class="l">pwr%</span></span>
          </span>
        </a>`;
    }

    async function loadTopRecipes(name){
      const wrap = $('#toplist'); if (!wrap) return;
      try {
        const r = await fetch(`/dishes/${encodeURIComponent(name)}/top-recipes`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const payload = await r.json();
        // Normalize once into scoreRow's shape; sorting is the list helper's job.
        const recs = (payload.recipes || []).map(rec => ({
          rank_score: rec.rank_score, ou_pct: rec.ou_percentile, pwr_pct: rec.power_percentile,
          name: rec.name,
          domain: rec.site_name || hostOf(rec.source_url),
          thumb: (rec.preview_image || rec.fallback_image || '').trim(),
          grade: rec.grade, selected: false,   // whole list is winners — no ★ needed
          href: rec.recipe_id ? `/r/${encodeURIComponent(rec.recipe_id)}` : (rec.source_url || '#'),
          title: 'Open recipe',
        }));
        const cnt = $('#topcount'); if (cnt) cnt.textContent = recs.length ? `(${recs.length})` : '';
        const awards = payload.editors_choice || [];
        if (!recs.length && !awards.length){ wrap.innerHTML = '<li class="ed-empty-fit">No winners yet — refresh the dish.</li>'; return; }
        // Editor's Choice band — rendered ABOVE the ranked list and visibly apart
        // from it. These are awards, not competitors: they carry no rank_score
        // because they never entered a run, and showing their PA/DA/OU is
        // descriptive only. An award nobody can see is not an award, which is
        // what the previous "surfaces in the winners if it ranks" amounted to.
        const awardHtml = awards.map(a => {
          const host = a.site_name || hostOf(a.source_url);
          const nums = [a.pa != null ? `PA ${Math.round(a.pa)}` : null,
                        a.da != null ? `DA ${Math.round(a.da)}` : null,
                        a.ou != null ? `OU ${Number(a.ou).toFixed(1)}` : null]
                       .filter(Boolean).join(' · ');
          // The citation gets its own line, quoted. It is the justification for
          // overriding the statistical pass, so it should read as the reason the
          // award exists — not as metadata trailing the domain name.
          const cite = a.note
            ? `<div class="ec-cite">${escapeHtml(a.note)}</div>`
            : `<div class="ec-nocite">No citation given — <i>why does this deserve inclusion?</i></div>`;
          return `<li class="ed-t10-row ec-band">
            <span class="ed-t10-name">
              <span class="ec-tag">★ EDITOR'S CHOICE</span>

    // If a refresh for this dish is ALREADY in flight, show it. Previously the
    // live log only ever appeared in the tab that started the run: reload the
    // page, open the dish from another window, or come back later and a running
    // job was completely invisible — the page looked idle while a job wrote its
    // ledger. That invisibility is what makes someone press Refresh again and
    // meet a bare "HTTP 409".
    //
    // Also disables the Refresh button while it runs, so the second click that
    // produced the 409 cannot happen in the first place.
    async function attachRunningRefresh(dishName){
      try {
        const r = await fetch(`/jobs?entity_ref=${encodeURIComponent('dish:' + dishName)}&limit=5`);
        if (!r.ok) return;
        const jobs = await r.json().catch(() => []);
        const live = (Array.isArray(jobs) ? jobs : []).find(
          j => j.status === 'running' || j.status === 'queued');
        if (!live) return;
        // streamDishLog owns the button/cancel state; re-attaching to a job we
        // already tail (e.g. after a save re-rendered the page) just resyncs.
        if (!(_stream && _stream.jobId === live.id))
          flash(`“${dishName}” is refreshing now (job #${live.id}) — live log below.`);
        streamDishLog(live.id, dishName);
      } catch (_){ /* visibility is a nicety; never break the detail render */ }
    }

    async function doRefresh(d){
      const btn = $('#refreshBtn');
      btn.disabled = true; btn.textContent = 'Queuing…';
      // Re-arm the button ONLY on paths where no stream took over — a live
      // stream keeps it disabled so a second click (and a duplicate tail)
      // can't happen; streamDishLog restores it when the run ends.
      const rearm = () => { const b = $('#refreshBtn'); if (b){ b.disabled = false; b.textContent = '🔄 Refresh top recipes'; } };
      try {
        const r = await fetch(`/dishes/${encodeURIComponent(d.name)}/refresh`, { method: 'POST' });
        const data = await r.json().catch(() => ({}));
        // 409 = a refresh for this dish is ALREADY running. That is the guard
        // working, not a failure — and the server returns the in-flight job_id
        // precisely "so the UI can attach to that stream instead". Attaching
        // beats reporting: the user clicked Refresh because they wanted to see
        // it run, and it IS running.
        if (r.status === 409 && data.job_id) {
          flash(`“${d.name}” is already refreshing (job #${data.job_id}) — attaching to it.`);
          streamDishLog(data.job_id, d.name);
          return;
        }
        // The 409 body has no `detail` key, so the old fallthrough rendered a
        // bare "HTTP 409" and threw the job id away.
        if (!r.ok && r.status !== 202) throw new Error(data.detail || data.error || `Couldn’t queue the refresh (HTTP ${r.status})`);
        // Phase 4: run the job OUT-OF-PROCESS — the server spawns
        // `python -m jobs exec --job-id N`, so the UI stays responsive, jobs for
        // different dishes run in parallel without interfering, and a server
        // restart can't kill the run. We just tail its log via the SSE stream.
        const sp = await fetch(`/jobs/${data.job_id}/spawn`, { method: 'POST' });
        if (!sp.ok) {
          const se = await sp.json().catch(() => ({}));
          // Fall back to the in-server drain if the spawn endpoint is unavailable.
          flash(`Spawn failed (${se.detail || sp.status}); running in-server…`, true);
          if (LibraryShell.runQueuedJobs) LibraryShell.runQueuedJobs();
          rearm();   // no stream on this path, so nothing else re-arms the button
        } else {
          flash(`Refreshing “${d.name}” out-of-process (job #${data.job_id})…`);
          streamDishLog(data.job_id, d.name);   // live log INLINE in the dish page
        }
      } catch (e) {
        flash(String(e.message || e), true);
        rearm();
      }
    }

    // Stream an out-of-process job's log INLINE in the dish detail (#dishLog),
    // tailing GET /jobs/<id>/stream (the SSE reads the DB + log file the
    // subprocess writes — fully cross-process). On done, re-fetch the dish and
    // re-render the detail so Last run / pills / the view-log link update; the
    // accumulated log is re-painted into the freshly-rendered panel.
    // ONE live tail at a time (this is a single-detail-pane page). Re-calling
    // with the same job resyncs the freshly-rendered panel (repaint + button +
    // cancel) instead of opening a duplicate EventSource — the save-during-run
    // and second-click paths both land here. A different job closes the old
    // tail first.
    let _stream = null;   // { jobId, es, resync }
    function streamDishLog(jobId, dishName){
      if (_stream && _stream.jobId === jobId){ _stream.resync(); return; }
      if (_stream){ _stream.es.close(); _stream = null; }
      let buf = '';
      const paint = () => {
        const pre = $('#dishLog'); if (!pre) return;
        pre.style.display = ''; pre.textContent = buf; pre.scrollTop = pre.scrollHeight;
      };
      const add = (line) => { buf += (buf ? '\n' : '') + line; paint(); };
      const setRefreshBusy = (on) => {
        const b = $('#refreshBtn'); if (!b) return;
        b.disabled = on; b.textContent = on ? '🔄 Refreshing…' : '🔄 Refresh top recipes';
      };
      // Cancel follows the stream, exactly like the domains form: enabled for
      // the life of the run, POSTs the cooperative cancel (the job aborts
      // after the current candidate), disabled again on done. Wired HERE, not
      // at render time, so the already-running attach path gets it too.
      const setCancel = (on) => {
        const b = $('#cancelRefreshBtn'); if (!b) return;
        b.hidden = !on; b.disabled = !on; b.innerHTML = '&#9995; Cancel';
        b.onclick = on ? async () => {
          b.disabled = true; b.textContent = 'Cancelling…';
          add('✋ Cancel requested — stops after the current candidate…');
          try { await fetch(`/jobs/${jobId}/cancel`, { method: 'POST' }); } catch (_){}
        } : null;
      };
      setCancel(true);
      setRefreshBusy(true);
      add(`▶ Running job #${jobId} for “${dishName}” (out-of-process)…`);
      const es = new EventSource('/jobs/' + jobId + '/stream');
      _stream = { jobId, es, resync: () => { paint(); setCancel(true); setRefreshBusy(true); } };
      // EventSource retries forever by default — fine for a blip mid-run, but a
      // stream that only errors (server bounced, job gone) must eventually stop
      // reconnecting in the background. Any successful event resets the count.
      let errs = 0;
      es.addEventListener('log', (e) => { errs = 0; try { add(JSON.parse(e.data).line); } catch (_) {} });
      es.addEventListener('status', (e) => { errs = 0; try { add('· ' + JSON.parse(e.data).status); } catch (_) {} });
      es.addEventListener('done', async (e) => {
        let st = 'done'; try { st = JSON.parse(e.data).status; } catch (_) {}
        add(`■ ${st}.`);
        setCancel(false);
        setRefreshBusy(false);
        es.close();
        if (_stream && _stream.es === es) _stream = null;
        try {
          const r = await fetch(`/dishes/${encodeURIComponent(dishName)}`);
          if (r.ok) {
            const data = await r.json();
            dishes[dishName] = data;
            if (selected === dishName) { renderList(); renderDetail(data); paint(); }
            else renderList();
          }
        } catch (_) {}
        flash(`“${dishName}” refresh ${st}.`);
      });
      es.addEventListener('error', () => {
        if (++errs < 5) return;   // transient — let EventSource auto-reconnect
        es.close();
        if (_stream && _stream.es === es) _stream = null;
        setCancel(false);
        setRefreshBusy(false);
        add('⚠ Log stream disconnected (server restart?) — the job runs in its OWN process and is likely still going or already finished. Reopen this dish to re-attach, or see “view log” under Last run.');
      });
    }

    async function doDelete(d){
      // Honest preflight: no recipes are deleted (2026-08-30) — stamped
      // dish-only rows are RELEASED to re-match, publisher-claimed rows just
      // lose the dish stamp, matcher-resolved rows re-match on the next
      // sweep. Falls back to a generic line if the preflight can't be fetched.
      let msg = `Delete dish “${d.name}”?\n\nIts recipes are NOT deleted — they re-home to the nearest remaining dish on the next rematch.`;
      try {
        const p = await fetch(`/dishes/${encodeURIComponent(d.name)}/delete-preflight`).then(r => r.ok ? r.json() : null);
        if (p) {
          const bits = [];
          if (p.will_release) bits.push(`• ${p.will_release} released — kept in master, re-homed to the nearest remaining dish by the next rematch`);
          if (p.kept_publisher) bits.push(`• ${p.kept_publisher} kept (also on a publisher's list — only the dish stamp is cleared)`);
          if (p.will_rematch) bits.push(`• ${p.will_rematch} untouched — they re-match on the next sweep`);
          if (!bits.length) bits.push('• No recipes are affected');
          msg = `Delete dish “${d.name}”?\n\nNo recipes are deleted.\n${bits.join('\n')}`;
        }
      } catch (e) { /* keep generic message */ }
      if (!confirm(msg)) return;
      try {
        const r = await fetch(`/dishes/${encodeURIComponent(d.name)}`, { method: 'DELETE' });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.detail || `Delete failed (HTTP ${r.status})`);
        delete dishes[d.name];
        const first = sortedDishes()[0]; selected = first ? first.name : null;
        renderList(); renderMain();
        flash('Dish deleted');
      } catch (e) { flash(String(e.message || e), true); }
    }

    /* ----------------------------- data + wiring ----------------------------- */
    async function loadDishes(selectName){
      // A network-level failure used to be an unhandled rejection: the sidebar
      // sat on "Loading…" forever with no message and no way back.
      let list;
      try {
        const r = await fetch('/dishes');
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        list = await r.json();
      } catch (e){
        $('#list').innerHTML = `<li class="ed-empty">Couldn’t load dishes (${escapeHtml(String(e.message || e))}) — is the server up? <a href="#" id="retryLoad">Retry</a></li>`;
        const a = $('#retryLoad');
        if (a) a.addEventListener('click', (ev) => { ev.preventDefault(); $('#list').innerHTML = '<li class="ed-empty">Loading…</li>'; loadDishes(selectName); });
        return;
      }
      dishes = {};
      for (const d of list) dishes[d.name] = d;
      if (selectName && dishes[selectName]) selected = selectName;
      // Land on the first dish so the page is populated, not a splash.
      if (selected == null) { const first = sortedDishes()[0]; if (first) selected = first.name; }
      renderList();
      renderMain();
    }

    // Dirty-tracker: Save stays disabled until a DISH-EDIT field changes.
    // Scoped to the editable fields (f_* inputs + the search-line rows) — the
    // Editor's Choice inputs live on the same page but post through their own
    // button, and typing there must not light up Save with a false "unsaved
    // dish edits" signal.
    const _markDirty = (e) => {
      const t = e.target;
      if (!t || !(/^f_/.test(t.id || '') || (t.closest && t.closest('#qrows_edit')))) return;
      const b = $('#saveBtn'); if (b) b.disabled = false;
    };
    $('#page').addEventListener('input', _markDirty);
    $('#page').addEventListener('change', _markDirty);
    $('#addToggle').addEventListener('click', () => { selected = '__new__'; renderList(); renderMain(); nav.afterSelect(); });
    $('#search').addEventListener('input', (e) => { term = e.target.value; renderList(); });
    $('#sort').addEventListener('change', (e) => { sortKey = e.target.value; renderList(); });

    // Pull the dish caps (System → Limits) so the number inputs show a max
    // hint. The server is the real guard; this just stops the spinner early.
    fetch('/system-config').then(r => r.ok ? r.json() : []).then(rows => {
      const m = {}; for (const s of rows) m[s.key] = s.value;
      if (m.dish_max_serpapi != null) _limits.serpapi = m.dish_max_serpapi;
      if (m.dish_max_final != null) _limits.final = m.dish_max_final;
      // Update the max attributes IN PLACE — a full re-render here wiped
      // whatever the curator had already started typing. Future renders read
      // the updated _limits on their own.
      for (const [sel, key] of [['#f_serp', 'serpapi'], ['#n_serp', 'serpapi'], ['#f_final', 'final'], ['#n_final', 'final']]){
        const el = $(sel); if (el) el.max = _limits[key];
      }
    }).catch(() => {});

    // ?create=<name> deep link: land on the New Dish form prefilled. The
    // caller owns the profile — the name is the first search line, each
    // repeated &q= adds another, and &serp=/&final=/&ttl= override the form's
    // own defaults (dish-coverage's ➕ sends its 40/15/180 this way). Nothing
    // is saved until Create is pressed.
    const _params = new URLSearchParams(location.search);
    const _createName = (_params.get('create') || '').trim();
    if (_createName){
      const num = (k) => { const v = parseInt(_params.get(k), 10); return Number.isFinite(v) && v > 0 ? v : null; };
      _createPrefill = {
        name: _createName,
        rows: [_createName, ..._params.getAll('q')].filter(Boolean).map(q => ({ q })),
        serp: num('serp'), final: num('final'), ttl: num('ttl'),
      };
      selected = '__new__';
    }

    loadDishes();
  </script>
</body>
</html>
