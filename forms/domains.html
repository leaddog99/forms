<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Best Cooks Club — Admin · Domains</title>
  <!-- Domain master editor on the shared master/detail editor shell. A
       domain (full host) owns everything we know about a source site
       independent of any recipe: friendly name, story, country/language
       provenance, extraction tips, allow/deny, domain authority. The
       `domains` table is the source of truth; domain_display_names.json is
       its bootstrap seed. Cloned from chapters.html per
       memory/feedback_editor_template_not_runtime.md. -->
  <link rel="stylesheet" href="/forms/editor-shell.css?v=20260618c">
  <link rel="stylesheet" href="/forms/tokens.css?v=20260617b">
  <link rel="stylesheet" href="/forms/components.css?v=20260617c">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <button class="ed-back" id="edBack" aria-label="Toggle list"></button>
      <div class="ed-brand">Best Cooks Club</div>
      <!-- LibraryShell.initNav appends: .nav-spacer, .identity-badge, .nav-toggle(⋮) -->
    </div>
  </header>
  <div class="ed-scrim" id="edScrim"></div>

  <div class="ed-app">
    <aside class="ed-sidebar">
      <div class="ed-sidebar-head">
        <h2>Domains <span class="ed-count" id="count"></span></h2>
        <div class="ed-head-actions">
          <button class="ed-icon-btn" id="searchToggle" title="Search &amp; sort" aria-label="Search and sort">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
          <button class="ed-icon-btn" id="addToggle" title="New domain" aria-label="New domain">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>
      </div>

      <div class="ed-controls" id="controls" hidden>
        <input type="search" id="search" placeholder="Search domains…">
        <select id="sort" aria-label="Sort domains">
          <option value="domain">Sort: domain (A–Z)</option>
          <option value="name">Sort: display name</option>
          <option value="da">Sort: domain authority</option>
          <option value="rank">Sort: BCC rank (SEMrush traffic)</option>
          <option value="blocked">Sort: blocked first</option>
        </select>
        <div class="ed-rank-tools" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px">
          <button type="button" class="ed-btn" id="refreshRanksBtn" title="Re-import the newest SEMrush rank export (input/ or Downloads) and re-rank every domain">↻ Refresh SEMrush ranks</button>
          <span class="ed-save-hint" id="rankStatus" style="font-size:.82em;color:var(--ed-ink-soft)"></span>
        </div>
      </div>

      <div class="ed-legend">
        <span><i class="d ok"></i>allowed</span>
        <span><i class="d none"></i>blocked</span>
      </div>

      <ul class="ed-list" id="list"><li class="ed-empty">Loading…</li></ul>
    </aside>

    <main class="ed-content"><div class="ed-page" id="page"></div></main>
  </div>

  <script src="/forms/library-shell.js?v=20260618c"></script>
  <script>
    const $ = (s) => document.querySelector(s);

    LibraryShell.initNav({ currentPage: 'domains' });
    const nav = LibraryShell.initEditorNav({
      backButton: '#edBack', scrim: '#edScrim',
      listLabel: 'Domains', listMode: 'docked', shellWidth: 1200,
    });
    const { escapeHtml, fmtDate, flash } = LibraryShell;

    const STRATEGIES = ['plain', 'playwright', 'bookmarklet_only', 'unblocker', 'skip'];

    let domains = {};        // keyed by domain (host)
    let selected = null;     // host string, or '__new__'
    let term = '';
    let sortKey = 'domain';

    /* ----------------------------- derivations ----------------------------- */
    const isAllowed = (d) => d.allowed === undefined || !!d.allowed;
    function listMeta(d){
      const bits = [];
      if (d.display_name) bits.push(d.display_name);
      if (d.country) bits.push(d.country);
      if (d.bcc_rank != null) bits.push('BCC #' + d.bcc_rank);
      if (d.domain_authority != null) bits.push('DA ' + Math.round(d.domain_authority));
      const m = d.master_recipe_count || 0, u = d.user_recipe_count || 0;
      if (m || u) bits.push(`${m}m · ${u}u`);
      if (!isAllowed(d)) bits.push('blocked');
      return bits.join(' · ') || '—';
    }

    /* ----------------------------- list ----------------------------- */
    function sortedRows(){
      const t = term.toLowerCase();
      const rows = Object.values(domains).filter(d =>
        !t || d.domain.toLowerCase().includes(t) || (d.display_name || '').toLowerCase().includes(t));
      const sorters = {
        domain:  (a, b) => a.domain.localeCompare(b.domain),
        name:    (a, b) => (a.display_name || '').localeCompare(b.display_name || '') || a.domain.localeCompare(b.domain),
        da:      (a, b) => (b.domain_authority || 0) - (a.domain_authority || 0) || a.domain.localeCompare(b.domain),
        // BCC rank: allowed publishers carrying a SEMrush rank, best (1) first;
        // unranked/blocked domains sort to the bottom, then A–Z.
        rank:    (a, b) => ((a.bcc_rank ?? Infinity) - (b.bcc_rank ?? Infinity)) || a.domain.localeCompare(b.domain),
        blocked: (a, b) => (isAllowed(a) - isAllowed(b)) || a.domain.localeCompare(b.domain),
      };
      return rows.sort(sorters[sortKey] || sorters.domain);
    }

    function renderList(){
      const rows = sortedRows();
      $('#count').textContent = `(${rows.length})`;
      const ul = $('#list'); ul.innerHTML = '';
      if (!rows.length){ ul.innerHTML = '<li class="ed-empty">No matches</li>'; return; }
      for (const d of rows){
        const li = document.createElement('li');
        li.className = 'ed-item' + (d.domain === selected ? ' selected' : '');
        li.innerHTML =
          `<div class="ed-item-top"><span class="ed-item-name">${escapeHtml(d.domain)}</span><span class="ed-item-flag ${isAllowed(d) ? 'ok' : 'none'}"></span></div>` +
          `<div class="ed-item-meta">${escapeHtml(listMeta(d))}</div>`;
        li.addEventListener('click', () => { selected = d.domain; renderList(); renderDetail(); nav.afterSelect(); });
        ul.appendChild(li);
      }
    }

    /* ----------------------------- detail ----------------------------- */
    function field(id, label, value, opts = {}){
      const v = value == null ? '' : String(value);
      const full = opts.full ? ' full' : '';
      // Placeholder convention: an EXAMPLE value gets an "ex: " prefix so it can't be
      // mistaken for real data; a PROMPT/description (ends in "…") is left as-is.
      const ph = opts.ph ? (opts.ph.endsWith('…') ? opts.ph : `ex: ${opts.ph}`) : '';
      if (opts.textarea){
        return `<div class="ed-field${full}"><label for="${id}">${label}</label>` +
          `<textarea id="${id}" class="ed-notes"${opts.minh ? ` style="min-height:${opts.minh}px"` : ''} placeholder="${escapeHtml(ph)}">${escapeHtml(v)}</textarea></div>`;
      }
      if (opts.select){
        const opts_html = opts.select.map(o => `<option value="${o}"${o === v ? ' selected' : ''}>${o}</option>`).join('');
        return `<div class="ed-field${full}"><label for="${id}">${label}</label><select id="${id}">${opts_html}</select></div>`;
      }
      if (opts.checkbox){
        return `<div class="ed-field${full}"><label class="ed-check"><input type="checkbox" id="${id}"${value ? ' checked' : ''}> ${label}</label></div>`;
      }
      const ro = opts.readonly ? ' readonly' : '';
      return `<div class="ed-field${full}"><label for="${id}">${label}</label>` +
        `<input id="${id}" type="${opts.type || 'text'}" value="${escapeHtml(v)}"${ro} placeholder="${escapeHtml(ph)}"${opts.readonly ? ' tabindex="-1"' : ''}></div>`;
    }

    function renderDetail(){
      const panel = $('#page');
      if (selected === '__new__') return renderCreate();
      if (!selected || !domains[selected]){
        panel.innerHTML = `<div class="ed-block" style="border-top:none;padding-top:8px"><p class="ed-empty-fit">Select a domain to edit its friendly name, story, country/language provenance, extraction tips, allow/deny, and domain authority. A domain (full host, e.g. <code>cooking.nytimes.com</code>) is the canonical record for a source site — everything we know about it independent of any single recipe.</p></div>`;
        return;
      }
      const d = domains[selected];

      panel.innerHTML = `
        <div class="ed-kicker">
          <button type="button" class="ed-purpose-toggle" id="purposeToggle">Admin · Edit Domain <span id="purposeArrow">▾</span></button>
          <div class="ed-purpose-pop" id="purposePop" hidden>
            <strong>Purpose:</strong> the canonical per-publisher record. Friendly name flows onto every recipe’s source attribution; country/language seed the multilingual pipeline; extraction tips + allow/deny steer the batch fetcher; DA is the domain-grain authority (per-URL PA lives on metabase_url). Recipe ethnicity/cuisine stays dish-derived — <code>cuisine_focus</code> here is only a hint.
          </div>
        </div>

        <h1 class="ed-title">${escapeHtml(d.domain)}</h1>
        <div class="ed-status-strip">
          <span class="ed-pill ${isAllowed(d) ? 'ok' : 'warn'}"><i class="d"></i>${isAllowed(d) ? 'Allowed' : 'Blocked'}</span>
          ${d.root_domain ? `<span class="ed-pill"><i class="d"></i>root ${escapeHtml(d.root_domain)}</span>` : ''}
          ${d.domain_authority != null ? `<span class="ed-pill"><i class="d"></i>DA ${Math.round(d.domain_authority)}</span>` : ''}
          ${d.bcc_rank != null ? `<span class="ed-pill" title="rank among our allowed publishers by SEMrush organic traffic">BCC rank #${d.bcc_rank}</span>` : ''}
          ${d.semrush_rank != null ? `<span class="ed-pill" title="global SEMrush rank by organic traffic">SEMrush #${d.semrush_rank.toLocaleString()}</span>` : ''}
          ${d.da_last_scored ? `<span class="ed-pill"><i class="d"></i>DA scored ${escapeHtml(fmtDate(d.da_last_scored))}</span>` : ''}
          ${d.failure_count ? `<span class="ed-pill warn"><i class="d"></i>${d.failure_count} fetch fails</span>` : ''}
        </div>
        <p class="ed-submeta">Updated ${fmtDate(d.updated_at)}${d.created_at ? ' · created ' + fmtDate(d.created_at) : ''}</p>

        <section class="ed-block">
          <h3 class="ed-block-label">Editorial</h3>
          <div class="ed-form-grid">
            ${field('f_display_name', 'Display name', d.display_name, { ph: 'NYT Cooking' })}
            ${field('f_story', 'Story', d.story, { textarea: true, full: true, minh: 90, ph: 'A short editorial bio of this site…' })}
          </div>
        </section>

        <section class="ed-block">
          <h3 class="ed-block-label">Provenance &amp; extraction</h3>
          <div class="ed-form-grid">
            ${field('f_country', 'Country', d.country, { ph: 'Greece' })}
            ${field('f_language', 'Language (ISO 639-1)', d.language, { ph: 'el' })}
            ${field('f_fetch_strategy', 'Fetch strategy', d.fetch_strategy || 'plain', { select: STRATEGIES })}
            ${field('f_allowed', 'Allowed (ingest from this site)', isAllowed(d), { checkbox: true })}
            ${field('f_domain_authority', 'Domain authority (DA)', d.domain_authority, { type: 'number' })}
            ${field('f_extract_notes', 'Extraction notes', d.extract_notes, { textarea: true, full: true, minh: 70, ph: 'JSON-LD reliable · needs www for Moz · paywalled — use screenshot…' })}
          </div>
        </section>

        <section class="ed-block">
          <h3 class="ed-block-label">Top recipes — publisher refresh</h3>
          <p class="ed-notes-help" style="margin:0 0 12px">Harvest this publisher's most-notable recipes, verify each is a real recipe (drops index / listicle / section pages), score by page authority, and keep the top N. Pick a <b>discovery source</b> below — each has its own settings. ★ = kept; “in corpus” = already ingested.</p>

          <div class="src-groups" id="srcGroups">
            <div class="src-group" data-src="serp">
              <label class="src-head"><input type="radio" name="harvestSource" value="serp" ${(d.harvest_source || 'serp') === 'serp' ? 'checked' : ''}>
                Google — site: search <span class="src-sub">SerpAPI; depth set in pages of ~10 results</span></label>
              <div class="ed-form-grid">
                ${field('f_serp_query', 'Query (verbatim, incl. site:)', d.serp_query || '', { ph: 'site:bostonglobe.com recipe', full: true })}
                ${field('f_recipe_path', 'Recipe path (used if query blank)', d.recipe_path || '', { ph: 'recipes (else auto-detect)…' })}
                ${field('f_search_pages', 'Depth — pages (×10 results)', d.search_pages || 10, { type: 'number' })}
              </div>
            </div>
            <div class="src-group" data-src="backlinks_file">
              <label class="src-head"><input type="radio" name="harvestSource" value="backlinks_file" ${d.harvest_source === 'backlinks_file' ? 'checked' : ''}>
                SEMrush backlinks file <span class="src-sub">local export, ranked by referring domains — best for big sites</span></label>
              <div class="src-file" id="backlinksFileStatus">checking for file…</div>
              <div class="ed-form-grid" style="margin-top:10px">
                ${field('f_records', 'Records to pull from file', 100, { type: 'number' })}
              </div>
            </div>
          </div>

          <div class="ed-form-grid" style="margin:4px 0 2px">
            ${field('f_keep_top_n', 'Keep top N (both sources)', d.keep_top_n || 10, { type: 'number' })}
          </div>
          <label class="ed-check" style="display:flex;gap:8px;align-items:center;margin:8px 0 2px">
            <input type="checkbox" id="f_check_recipe" checked>
            <span>Verify each is a recipe (is_recipe) — <i>uncheck for paywalled publishers where a fetch can't see the recipe</i></span>
          </label>
          <label class="ed-check" style="display:flex;gap:8px;align-items:center;margin:2px 0 2px">
            <input type="checkbox" id="f_harvestable_skip" ${Number(d.harvestable) === 0 ? 'checked' : ''}>
            <span>Skip this publisher — no mechanical way to list recipes (Google refresh won't run)</span>
          </label>
          <div class="ed-actions" style="margin:10px 0 6px">
            <button type="button" class="ed-btn" id="refreshTopBtn" title="Run the query, verify recipes, score + keep the top N">🔄 Refresh top recipes</button>
            <button type="button" class="ed-btn danger" id="cancelTopBtn" title="Stop the running harvest (cooperative — aborts after the current candidate)" style="display:none">✋ Cancel</button>
            <button type="button" class="ed-btn danger" id="clearTopBtn" title="Wipe the current stored list (start over)">🗑 Clear list</button>
            <span class="ed-save-hint" id="topHint"></span>
          </div>
          <pre id="topLog" style="display:none;max-height:240px;overflow:auto;background:#1d1f23;color:#cdd3da;font-size:12px;line-height:1.45;padding:10px 12px;border-radius:8px;margin:0 0 10px;white-space:pre-wrap;"></pre>

          <!-- Recipes already in the corpus from this domain (browse/jump). Lifted
               above the harvested top list so the curator sees what's already ingested
               first; counts refresh on open. -->
          <p class="ed-notes-help" style="margin:14px 0 6px">Already in the corpus from this domain — pick one to jump:</p>
          <div class="ed-form-grid" style="margin:0 0 16px">
            <div class="ed-field"><label for="masterPicker">Master recipes <span class="ed-count" id="masterCount"></span></label>
              <select id="masterPicker"><option value="">Loading…</option></select></div>
            <div class="ed-field"><label for="userPicker">User recipes <span class="ed-count" id="userCount"></span></label>
              <select id="userPicker"><option value="">Loading…</option></select></div>
          </div>

          <div class="top-recipes-list" id="domainTopList"><div class="ed-empty-fit">Open or refresh to load the top recipes.</div></div>
        </section>

        <section class="ed-block">
          <h3 class="ed-block-label">Curator notes</h3>
          <textarea id="f_notes" class="ed-notes" placeholder="Anything else worth recording about this site…">${escapeHtml(d.notes || '')}</textarea>
        </section>

        <details class="ed-block" style="border-top:1px solid var(--line);padding-top:10px">
          <summary style="cursor:pointer;font-weight:600;color:var(--ed-ink-soft);font-size:.92em;list-style:revert">Advanced — logo, cuisine hint, custom extractor</summary>
          <div class="ed-form-grid" style="margin-top:12px">
            ${field('f_logo_url', 'Logo URL', d.logo_url, { ph: 'https://… (Clearbit auto-fills)' })}
            ${field('f_cuisine_focus', 'Cuisine focus (hint only)', d.cuisine_focus, { ph: 'Greek' })}
            ${field('f_custom_extractor', 'Custom extractor (module path)', d.custom_extractor, { ph: 'intake.parsers.foo' })}
          </div>
        </details>

        <div class="ed-actions">
          <button type="button" class="ed-btn primary" id="saveBtn">Save</button>
          <button type="button" class="ed-btn" id="enrichBtn" title="Profile this site with a quick LLM query (story, language, country, cuisine, logo)">✨ Enrich</button>
          <button type="button" class="ed-btn danger" id="deleteBtn">Delete</button>
          <span class="ed-save-hint" id="hint"></span>
        </div>`;

      $('#purposeToggle').addEventListener('click', () => {
        const p = $('#purposePop'), a = $('#purposeArrow');
        p.hidden = !p.hidden; a.textContent = p.hidden ? '▾' : '▴';
      });
      $('#saveBtn').addEventListener('click', () => doSave(d.domain));
      $('#saveBtn').disabled = true;   // enabled by the dirty-tracker on first edit
      $('#enrichBtn').addEventListener('click', () => doEnrich(d.domain));
      $('#deleteBtn').addEventListener('click', () => doDelete(d.domain));
      $('#refreshTopBtn').addEventListener('click', () => doRefreshTop(d.domain));
      $('#clearTopBtn').addEventListener('click', () => doClearTop(d.domain));
      document.querySelectorAll('input[name=harvestSource]').forEach(r =>
        r.addEventListener('change', applySrcSelection));
      applySrcSelection();
      loadBacklinksFile(d.domain);     // detect the SEMrush export → fills the file line
      loadDomainRecipes(d.domain);     // counts + browse dropdowns (refresh-on-open)
      loadDomainTop(d.domain);         // stored publisher top-N ledger
    }

    // Activate the chosen source group (highlight + enable its inputs); dim + disable
    // the other, so each source clearly owns its own settings.
    function applySrcSelection(){
      const chosen = (document.querySelector('input[name=harvestSource]:checked') || {}).value || 'serp';
      document.querySelectorAll('.src-group').forEach(g => {
        const active = g.dataset.src === chosen;
        g.classList.toggle('is-active', active);
        g.classList.toggle('is-dim', !active);
        // disable the inactive group's inputs (the radio itself stays enabled)
        g.querySelectorAll('input:not([type=radio]), select, textarea').forEach(el => { el.disabled = !active; });
      });
    }

    // Detect the local SEMrush export for this publisher and show it on the file line.
    async function loadBacklinksFile(domain){
      const el = $('#backlinksFileStatus'); if (!el) return;
      const radio = document.querySelector('input[name=harvestSource][value=backlinks_file]');
      try {
        const r = await fetch(`/domains/${encodeURIComponent(domain)}/backlinks-file`);
        const d = await r.json();
        if (d.present){
          el.className = 'src-file ok';
          el.textContent = `✓ input/${d.filename}`;
          if (radio) radio.disabled = false;
        } else {
          el.className = 'src-file missing';
          el.textContent = `no file — drop input/${d.expected} (a _subdir export also works)`;
          if (radio) radio.disabled = true;   // can't pick a source with no file
        }
      } catch {
        el.className = 'src-file missing'; el.textContent = 'could not check for file';
      }
      applySrcSelection();
    }

    // Render the publisher top-N list — same component/look as the dishes
    // top-recipes list (tile · rank · title · host · grade/corpus/★ · DA/PA/pwr ·
    // actions). Reuses the .top-recipe-* classes lifted from dishes.html.
    function renderDomainTop(list){
      const el = $('#domainTopList'); if (!el) return;
      if (!list || !list.length){ el.innerHTML = '<div class="ed-empty-fit">No top recipes yet — run a refresh.</div>'; return; }
      el.innerHTML = list.map((m, i) => {
        const host = (() => { try { return new URL(m.url).hostname.replace(/^www\./, ''); } catch { return m.url || '—'; } })();
        const title = escapeHtml(m.name || m.title || host);
        const bccHref = m.ingested && m.recipe_id ? `/r/${encodeURIComponent(m.recipe_id)}` : '';
        const tileHref = bccHref || m.url || '#';
        const tile = m.preview_image
          ? `<a class="top-recipe-tile" href="${escapeHtml(tileHref)}" target="_blank" rel="noopener"><img src="${escapeHtml(m.preview_image)}" alt="" loading="lazy"></a>`
          : `<div class="top-recipe-tile empty"></div>`;
        const badges =
          (m.selected ? ' <span class="top-badge sel" title="kept (top-N)">★ kept</span>' : '') +
          (m.grade ? ` <span class="top-badge">${escapeHtml(m.grade)}</span>` : '') +
          (m.ingested ? ' <span class="top-badge" title="already in the corpus">in corpus</span>' : '');
        const meta = [];
        if (typeof m.da === 'number') meta.push(`DA ${Math.round(m.da)}`);
        if (typeof m.pa === 'number') meta.push(`PA ${Math.round(m.pa)}`);
        if (typeof m.da === 'number' && typeof m.pa === 'number') meta.push(`pwr ${Math.round(m.da + m.pa)}`);
        const actions =
          (bccHref ? `<a class="top-action top-action-primary" href="${escapeHtml(bccHref)}" target="_blank" rel="noopener">Open in BCC</a>` : '') +
          `<a class="top-action top-action-secondary" href="${escapeHtml(m.url || '#')}" target="_blank" rel="noopener" title="${escapeHtml(m.url || '')}">View source <span class="top-action-arrow">↗</span></a>`;
        return `<div class="top-recipe-row">${tile}<div class="top-recipe-body">` +
          `<div class="top-recipe-main"><span class="top-rank">#${m.rank || i + 1}</span>` +
          `<span class="top-recipe-title">${title}</span> <span class="top-recipe-host">${escapeHtml(host)}</span>${badges}</div>` +
          `<div class="top-recipe-meta">${escapeHtml(meta.join(' · '))}</div>` +
          `<div class="top-recipe-actions">${actions}</div>` +
          `</div></div>`;
      }).join('');
    }

    async function loadDomainTop(domain){
      const el = $('#domainTopList'); if (!el) return;
      try {
        const r = await fetch(`/domains/${encodeURIComponent(domain)}/top`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        renderDomainTop((await r.json()).top || []);
      } catch (e) { el.innerHTML = `<li class="ed-empty-fit">Couldn’t load (${escapeHtml(String(e.message || e))}).</li>`; }
    }

    // Publisher refresh: run the (verbatim) query → verify recipes → Moz-score →
    // keep top-N (inline; slower when verify is on — it fetches each candidate).
    async function doRefreshTop(domain){
      const btn = $('#refreshTopBtn'), hint = $('#topHint');
      const keep = parseInt($('#f_keep_top_n')?.value, 10) || 10;
      const pages = parseInt($('#f_search_pages')?.value, 10) || 10;
      const records = parseInt($('#f_records')?.value, 10) || 100;
      const source = (document.querySelector('input[name=harvestSource]:checked') || {}).value || 'serp';
      const recipe_path = ($('#f_recipe_path')?.value || '').trim();
      const query = ($('#f_serp_query')?.value || '').trim();
      const check_recipe = !!$('#f_check_recipe')?.checked;
      btn.disabled = true; btn.textContent = '⏳ Harvesting…';
      const log = $('#topLog'); if (log){ log.style.display = 'block'; log.textContent = ''; }
      if (hint){ hint.style.color = ''; hint.textContent = 'Queuing refresh job…'; }
      try {
        const r = await fetch(`/domains/${encodeURIComponent(domain)}/refresh-top`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ keep, pages, records, source, recipe_path, query, check_recipe }) });
        const data = await r.json().catch(() => ({}));
        if (r.status === 409 && data.stream_url){ if (hint) hint.textContent = 'Already running — reattaching…'; streamRefresh(data.stream_url, domain, data.job_id); return; }
        if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);
        streamRefresh(data.stream_url, domain, data.job_id);
      } catch (e) {
        if (hint){ hint.style.color = 'var(--ed-warn)'; hint.textContent = `Refresh failed: ${e.message || e}`; }
        btn.disabled = false; btn.textContent = '🔄 Refresh top recipes';
      }
    }

    // Tail the refresh job's SSE log; on completion, re-load the stored top list.
    function streamRefresh(streamUrl, domain, jobId){
      const hint = $('#topHint'), log = $('#topLog'), btn = $('#refreshTopBtn'), cancelBtn = $('#cancelTopBtn');
      let cancelled = false, finished = false;
      // Show Cancel for the life of the stream → POST cooperative cancel (the job
      // aborts after the current candidate).
      if (cancelBtn){
        cancelBtn.style.display = ''; cancelBtn.disabled = !jobId; cancelBtn.textContent = '✋ Cancel';
        cancelBtn.onclick = async () => {
          if (!jobId) return;
          cancelled = true; cancelBtn.disabled = true; cancelBtn.textContent = 'Cancelling…';
          if (hint){ hint.style.color = ''; hint.textContent = 'Cancelling — stops after the current candidate…'; }
          try { await fetch(`/jobs/${jobId}/cancel`, { method: 'POST' }); } catch {}
        };
      }
      const done = (txt, warn) => { finished = true;
        btn.disabled = false; btn.textContent = '🔄 Refresh top recipes';
        if (cancelBtn) cancelBtn.style.display = 'none';
        if (hint){ hint.style.color = warn ? 'var(--ed-warn)' : ''; if (txt) hint.textContent = txt; } };
      // Render the TERMINAL outcome from a job result — shared by the SSE 'done'
      // event AND the safety net below. The job already persisted the list + config,
      // so Save stays disabled (correct); we just re-render and report.
      const renderResult = (status, res, errorMsg) => {
        loadDomainTop(domain);
        if (status === 'cancelled' || cancelled){ done('Cancelled.', false); return; }
        if (status === 'error'){ done(`Refresh errored — ${errorMsg || 'see the job log'}.`, true); return; }
        const ok = ((res && res.stored) || 0) > 0;
        done(ok ? `Done & saved — ${res.stored} stored (${res.discovered} found, ${res.recipe_pass} passed the recipe check).`
                : `Done — 0 stored (${(res && res.discovered) || 0} found, ${(res && res.recipe_pass) || 0} passed). Paywalled? Uncheck “verify”, refine the query, or check Skip.`,
             !ok && ((res && res.discovered) || 0) === 0);
      };
      // Safety net: read the job's terminal state directly. Covers reattaching to a
      // job that ALREADY finished (its SSE replays no 'done') + a dropped stream —
      // the two ways the display used to hang forever.
      const resolveFromJob = async () => {
        if (!jobId || finished) return false;
        try {
          const j = await (await fetch(`/jobs/${jobId}`)).json();
          if (['success', 'error', 'cancelled'].includes(j.status)){
            renderResult(j.status, j.result || {}, j.error_detail);
            return true;
          }
        } catch {}
        return false;
      };
      // If the job is already done at attach time, resolve now — never open a stream
      // that will never emit 'done'.
      resolveFromJob().then(already => {
        if (already) return;
        let es;
        try { es = new EventSource(streamUrl); }
        catch (e){ done(`Stream error: ${e.message || e}`, true); return; }
        es.addEventListener('log', (e) => {
          try { const d = JSON.parse(e.data); if (log){ log.textContent += (d.line || '') + '\n'; log.scrollTop = log.scrollHeight; } } catch {}
        });
        es.addEventListener('status', (e) => {
          try { const d = JSON.parse(e.data); if (hint && d.status) hint.textContent = `Job ${d.status}…`; } catch {}
        });
        es.addEventListener('done', (e) => {
          es.close();
          let res = {}; try { const d = JSON.parse(e.data || '{}'); res = typeof d.result === 'string' ? JSON.parse(d.result) : (d.result || {}); } catch {}
          renderResult(cancelled ? 'cancelled' : 'success', res);
        });
        es.onerror = async () => {
          es.close();
          // Stream dropped — the job likely finished. Recover its result before
          // falling back to the generic message.
          if (!(await resolveFromJob())) done('Stream dropped — reload to see the result.', true);
        };
      });
    }

    // Wipe the current stored list (botched harvest → start over).
    async function doClearTop(domain){
      const hint = $('#topHint');
      if (!confirm('Clear this publisher’s stored top list?')) return;
      try {
        const r = await fetch(`/domains/${encodeURIComponent(domain)}/top`, { method: 'DELETE' });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);
        renderDomainTop([]);
        if (hint){ hint.style.color = ''; hint.textContent = `Cleared ${data.cleared} row(s).`; }
      } catch (e) {
        if (hint){ hint.style.color = 'var(--ed-warn)'; hint.textContent = `Clear failed: ${e.message || e}`; }
      }
    }

    // Quick LLM profile of the site → fills story / language / country /
    // cuisine_focus / logo_url in the form for review. Does NOT save — marks
    // the form dirty so the curator eyeballs the result and clicks Save.
    async function doEnrich(domain){
      const btn = $('#enrichBtn'); const hint = $('#hint');
      btn.disabled = true; const label = btn.textContent; btn.textContent = 'Enriching…';
      if (hint){ hint.style.color = ''; hint.textContent = 'Profiling the site…'; }
      try {
        const r = await fetch(`/domains/${encodeURIComponent(domain)}/enrich`, { method: 'POST' });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);
        // Fill each field when the model returned something; leave existing
        // values for fields the model left blank.
        const set = (id, v) => { if (v){ const el = $('#' + id); if (el) el.value = v; } };
        set('f_story', data.story);
        set('f_language', data.language);
        set('f_country', data.country);
        set('f_cuisine_focus', data.cuisine_focus);
        set('f_logo_url', data.logo_url);
        $('#saveBtn').disabled = false;   // ready to commit
        if (hint){
          hint.style.color = data.recognized ? '' : 'var(--ed-warn)';
          hint.textContent = data.recognized
            ? 'Profiled — review and Save.'
            : 'Low confidence (guessed from the name) — review carefully before Save.';
        }
      } catch (e) {
        if (hint){ hint.style.color = 'var(--ed-warn)'; hint.textContent = `Enrich failed: ${e.message || e}`; }
      } finally {
        btn.disabled = false; btn.textContent = label;
      }
    }

    // Live per-domain recipe lists for the two browse dropdowns. The server
    // also stores the counts on the row as a side effect, so the next list
    // render shows them. Selecting an option opens that recipe in a new tab.
    async function loadDomainRecipes(domain){
      const mp = $('#masterPicker'), up = $('#userPicker');
      if (!mp || !up) return;
      const fill = (sel, bucket, noun) => {
        const items = bucket.items || [];
        const opts = [`<option value="">${items.length ? `${items.length} ${noun}…` : `No ${noun}`}</option>`]
          .concat(items.map(it => `<option value="${escapeHtml(it.recipe_id)}">${escapeHtml(it.name)}</option>`));
        sel.innerHTML = opts.join('');
        sel.disabled = !items.length;
      };
      try {
        const r = await fetch(`/domains/${encodeURIComponent(domain)}/recipes`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        fill(mp, data.master || {}, 'master recipes');
        fill(up, data.user || {}, 'user recipes');
        const mc = $('#masterCount'), uc = $('#userCount');
        if (mc) mc.textContent = `(${(data.master || {}).count || 0})`;
        if (uc) uc.textContent = `(${(data.user || {}).count || 0})`;
        // Reflect the freshly-stored counts in the in-memory row + list.
        if (domains[domain]){
          domains[domain].master_recipe_count = (data.master || {}).count || 0;
          domains[domain].user_recipe_count = (data.user || {}).count || 0;
        }
        const jump = (sel) => sel.addEventListener('change', (e) => {
          e.stopPropagation();   // don't trip the form dirty-tracker on a browse jump
          if (sel.value){ window.open(`/r/${encodeURIComponent(sel.value)}`, '_blank', 'noopener'); sel.value = ''; }
        });
        jump(mp); jump(up);
      } catch (e) {
        mp.innerHTML = up.innerHTML = `<option value="">Couldn’t load (${escapeHtml(String(e.message || e))})</option>`;
      }
    }

    // Collect the editable fields off the detail form into a PATCH payload.
    function collectFields(){
      const numOrNull = (v) => { const s = String(v).trim(); return s === '' ? null : Number(s); };
      return {
        display_name: $('#f_display_name').value.trim(),
        logo_url: $('#f_logo_url').value.trim(),
        story: $('#f_story').value.trim(),
        country: $('#f_country').value.trim(),
        language: $('#f_language').value.trim(),
        cuisine_focus: $('#f_cuisine_focus').value.trim(),
        fetch_strategy: $('#f_fetch_strategy').value,
        custom_extractor: $('#f_custom_extractor').value.trim(),
        extract_notes: $('#f_extract_notes').value.trim(),
        allowed: $('#f_allowed').checked ? 1 : 0,
        domain_authority: numOrNull($('#f_domain_authority').value),
        notes: $('#f_notes').value.trim(),
        recipe_path: ($('#f_recipe_path')?.value || '').trim(),
        keep_top_n: numOrNull($('#f_keep_top_n')?.value) || 10,
        serp_query: ($('#f_serp_query')?.value || '').trim(),
        search_pages: numOrNull($('#f_search_pages')?.value) || 4,
        harvest_source: (document.querySelector('input[name=harvestSource]:checked') || {}).value || 'serp',
        harvestable: $('#f_harvestable_skip')?.checked ? 0 : 1,
      };
    }

    /* ----------------------------- create ----------------------------- */
    function renderCreate(){
      const panel = $('#page');
      panel.innerHTML = `
        <div class="ed-kicker"><button type="button" class="ed-purpose-toggle" disabled style="cursor:default">Admin · New Domain</button></div>
        <h1 class="ed-title">Add a domain</h1>
        <p class="ed-notes-help" style="margin:0 0 20px;font-size:.95em">Creates a domain-master row, keyed on the full host (no scheme, no <code>www.</code>). Fill what you know now; the rest is editable later.</p>
        <section class="ed-block" style="border-top:none;padding-top:0">
          <div class="ed-form-grid">
            <div class="ed-field full"><label for="newDomain">Domain (host)</label><input id="newDomain" type="text" placeholder="ex: cooking.nytimes.com" autocomplete="off"></div>
            <div class="ed-field full"><label for="newName">Display name</label><input id="newName" type="text" placeholder="ex: NYT Cooking" autocomplete="off"></div>
            <div class="ed-field"><label for="newCountry">Country</label><input id="newCountry" type="text" placeholder="ex: Greece"></div>
            <div class="ed-field"><label for="newLanguage">Language</label><input id="newLanguage" type="text" placeholder="ex: el"></div>
          </div>
        </section>
        <div class="ed-actions" style="position:static;background:none;padding:8px 0 0">
          <button type="button" class="ed-btn primary" id="createBtn">Create domain</button>
          <button type="button" class="ed-btn" id="cancelBtn">Cancel</button>
          <span class="ed-save-hint" id="hint"></span>
        </div>`;
      $('#newDomain').focus();
      $('#cancelBtn').addEventListener('click', () => { selected = null; renderList(); renderDetail(); });
      $('#createBtn').addEventListener('click', doCreate);
    }

    async function doCreate(){
      const domain = $('#newDomain').value.trim();
      const hint = $('#hint'); const btn = $('#createBtn');
      if (!domain){ hint.style.color = 'var(--ed-warn)'; hint.textContent = 'Domain (host) is required'; $('#newDomain').focus(); return; }
      const payload = {
        domain,
        display_name: $('#newName').value.trim(),
        country: $('#newCountry').value.trim(),
        language: $('#newLanguage').value.trim(),
      };
      btn.disabled = true; btn.textContent = 'Creating…';
      try {
        const r = await fetch('/domains', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);
        await loadDomains();
        selected = data.domain || domain;
        renderList(); renderDetail();
        flash('Domain created');
      } catch (e) {
        btn.disabled = false; btn.textContent = 'Create domain';
        hint.style.color = 'var(--ed-warn)'; hint.textContent = String(e.message || e);
      }
    }

    /* ----------------------------- data + actions ----------------------------- */
    async function loadDomains(){
      const r = await fetch('/domains');
      if (!r.ok){ console.error('list domains failed', r.status); return; }
      const list = await r.json();
      domains = {};
      for (const d of list) domains[d.domain] = d;
      if (!selected){ const first = sortedRows()[0]; if (first) selected = first.domain; }
      renderList();
      renderDetail();
    }

    async function doSave(domain){
      const btn = $('#saveBtn'); const hint = $('#hint');
      btn.disabled = true; btn.textContent = 'Saving…'; btn.classList.remove('done');
      try {
        const r = await fetch(`/domains/${encodeURIComponent(domain)}`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(collectFields()),
        });
        if (!r.ok){ const e = await r.json().catch(() => ({})); throw new Error(e.detail || `HTTP ${r.status}`); }
        domains[domain] = await r.json();
        renderList();
        btn.textContent = 'Saved ✓'; btn.classList.add('done');
        if (hint){ hint.style.color = ''; hint.textContent = 'Saved'; }
        setTimeout(() => { btn.textContent = 'Save'; btn.classList.remove('done'); }, 1900);
      } catch (e) {
        btn.disabled = false; btn.textContent = 'Save';
        flash(`Save failed: ${e.message || e}`, true);
      }
    }

    async function doDelete(domain){
      if (!confirm(`Delete domain “${domain}”? This removes its master record (recipes are untouched).`)) return;
      try {
        const r = await fetch(`/domains/${encodeURIComponent(domain)}`, { method: 'DELETE' });
        if (!r.ok){ const e = await r.json().catch(() => ({})); throw new Error(e.detail || `HTTP ${r.status}`); }
        delete domains[domain];
        selected = null;
        await loadDomains();
        flash('Domain deleted');
      } catch (e) {
        flash(`Delete failed: ${e.message || e}`, true);
      }
    }

    /* --------------------- SEMrush ranks (corpus-wide) --------------------- */
    // Show the imported ranks summary (region · rows · file date) on the tools line.
    async function loadRankStatus(){
      const el = $('#rankStatus'); if (!el) return;
      try {
        const r = await fetch('/semrush-ranks');
        const regions = (await r.json()).regions || [];
        if (!regions.length){ el.textContent = 'no ranks imported — drop a SEMrush export and refresh'; return; }
        el.textContent = regions.map(g =>
          `${(g.region || '').toUpperCase()} · ${(g.rows || 0).toLocaleString()} domains${g.file_date ? ' · file ' + g.file_date : ''}`).join('  |  ');
      } catch { el.textContent = ''; }
    }

    // Re-import the newest SEMrush rank export + re-rank all domains (out-of-process).
    // Streams the job; on completion reloads the domain list so ranks/BCC update.
    async function refreshRanks(){
      const btn = $('#refreshRanksBtn'), el = $('#rankStatus');
      btn.disabled = true; const label = btn.textContent; btn.textContent = '⏳ Refreshing…';
      if (el) el.textContent = 'Queuing ranks refresh…';
      const finish = (msg) => { btn.disabled = false; btn.textContent = label; if (el && msg) el.textContent = msg; };
      try {
        const r = await fetch('/semrush-ranks/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
        const data = await r.json().catch(() => ({}));
        if (r.status === 409 && data.stream_url){ /* reattach to the in-flight run */ }
        else if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);
        let es; try { es = new EventSource(data.stream_url); } catch (e){ finish(`Stream error: ${e.message || e}`); return; }
        es.addEventListener('status', (e) => { try { const d = JSON.parse(e.data); if (el && d.status) el.textContent = `Job ${d.status}…`; } catch {} });
        es.addEventListener('done', async (e) => {
          es.close();
          let res = {}; try { const d = JSON.parse(e.data || '{}'); res = typeof d.result === 'string' ? JSON.parse(d.result) : (d.result || {}); } catch {}
          await loadDomains();           // re-render with fresh semrush_rank/bcc_rank
          if (res.imported === false){ finish(res.reason || 'No ranks file found.'); return; }
          finish(`Done — ${(res.rows || 0).toLocaleString()} ${(res.region || '').toUpperCase()} ranks · ${res.matched || 0}/${res.total || 0} domains matched.`);
          loadRankStatus();
        });
        es.onerror = () => { es.close(); finish('Stream dropped — reload to see the result.'); loadRankStatus(); };
      } catch (e) { finish(`Refresh failed: ${e.message || e}`); }
    }

    /* ----------------------------- wiring ----------------------------- */
    $('#searchToggle').addEventListener('click', () => {
      const c = $('#controls');
      c.hidden = !c.hidden;
      $('#searchToggle').classList.toggle('active', !c.hidden);
      if (!c.hidden) $('#search').focus();
    });
    const _markDirty = () => { const b = $('#saveBtn'); if (b) b.disabled = false; };
    $('#page').addEventListener('input', _markDirty);
    $('#page').addEventListener('change', _markDirty);
    $('#addToggle').addEventListener('click', () => { selected = '__new__'; renderList(); renderDetail(); nav.afterSelect(); });
    $('#search').addEventListener('input', (e) => { term = e.target.value; renderList(); });
    $('#sort').addEventListener('change', (e) => { sortKey = e.target.value; renderList(); });
    $('#refreshRanksBtn').addEventListener('click', refreshRanks);

    loadDomains();
    loadRankStatus();
  </script>
</body>
</html>
