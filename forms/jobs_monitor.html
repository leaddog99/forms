<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Best Cooks Club — Admin · Job Monitor</title>
  <!-- LIVE run monitor for the /jobs run queue: see what's running/queued/recent,
       watch a job's log stream, cancel a running job, spawn a queued one. Distinct
       from jobs_admin.html (the scheduled-jobs registry) and the nav's Jobs/Queued
       drain popup. Reads GET /jobs, /jobs/{id}, /jobs/{id}/stream; POSTs
       /jobs/{id}/cancel + /jobs/{id}/spawn. -->
  <style>
    /* Shell-width contract: this page runs wide; the header follows. */
    :root{ --shell-max: var(--shell-w, 1040px); }  /* full rail width */

    :root{ --warn:#b23b3b; --ok:#2f7a3a; --info:#2a6db2; }
    *{ box-sizing:border-box; }
    html,body{ margin:0; background:var(--bg); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
      -webkit-font-smoothing:antialiased; }
    /* 1200 to match the editor shell every other admin page uses (shellWidth: 1200) —
       this page was 980 and read as a different, narrower app. */
    .wrap{ max-width:var(--shell-max, 960px); margin:0 auto; padding:28px 18px 90px; }
    h1{ font-size:1.6rem; margin:0 0 4px; }
    .sub{ color:var(--muted); margin:0 0 18px; font-size:.95rem; }
    .toolbar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 16px;
      position:sticky; top:0; z-index:5; background:var(--bg); padding:8px 0 10px;
      border-bottom:1px solid var(--border); }
    .toolbar select{ padding:7px 9px; border:1px solid var(--border); border-radius:8px;
      background:var(--card); font-size:.88rem; color:var(--ink); }
    .toolbar .chk{ display:inline-flex; align-items:center; gap:6px; font-size:.85rem; color:var(--muted); cursor:pointer; }
    .toolbar .spacer{ flex:1; }
    .toolbar .count{ font-size:.82rem; color:var(--muted); }
    .toolbar button{ padding:7px 12px; border:1px solid var(--border); border-radius:8px;
      background:var(--card); font-size:.85rem; cursor:pointer; color:var(--ink); }
    .toolbar button:hover{ border-color:var(--accent); }

    .job{ background:var(--card); border:1px solid var(--border); border-radius:12px;
      padding:12px 14px; margin-bottom:10px; }
    .job.live{ border-color:var(--info); box-shadow:0 0 0 1px #2a6db233; }
    .job-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .pill{ font-size:.7rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
      padding:2px 9px; border-radius:999px; white-space:nowrap; }
    .pill.running{ background:#2a6db21f; color:var(--info); }
    .pill.queued{ background:#8a817522; color:var(--muted); }
    .pill.success{ background:#2f7a3a1f; color:var(--ok); }
    .pill.error{ background:#b23b3b1f; color:var(--warn); }
    .pill.cancelled{ background:#8a817522; color:#8a8175; }
    .dot{ width:7px; height:7px; border-radius:50%; background:var(--info); display:inline-block;
      animation:pulse 1.1s ease-in-out infinite; }
    @keyframes pulse{ 0%,100%{ opacity:.3 } 50%{ opacity:1 } }
    .jid{ font-weight:700; font-variant-numeric:tabular-nums; }
    .jtype{ font-size:.76rem; color:var(--muted); background:#f3eee7; padding:2px 8px; border-radius:999px; }
    .jref{ font-size:.82rem; color:var(--ink); }
    .jmeta{ width:100%; font-size:.78rem; color:var(--muted); margin-top:5px; display:flex; gap:14px; flex-wrap:wrap; }
    .jmeta b{ color:var(--ink); font-weight:600; }
    .jerr{ width:100%; font-size:.8rem; color:var(--warn); margin-top:5px; white-space:pre-wrap; }
    .jactions{ margin-left:auto; display:flex; gap:6px; }
    .jactions button{ padding:4px 10px; border:1px solid var(--border); border-radius:7px;
      background:var(--card); font-size:.8rem; cursor:pointer; color:var(--ink); }
    .jactions button:hover{ border-color:var(--accent); }
    .jactions button.danger:hover{ border-color:var(--warn); color:var(--warn); }
    .empty{ color:var(--muted); text-align:center; padding:36px 0; }

    .logpanel{ position:fixed; z-index:300; left:50%; top:84px; transform:translateX(-50%);
      width:min(640px,94vw); height:min(68vh,620px); min-width:340px; min-height:200px;
      background:#1d1f23; color:#cdd3da; border:1px solid #3a424c; border-radius:10px;
      box-shadow:0 16px 48px #0009; display:none; flex-direction:column; overflow:hidden; resize:both; }
    .logpanel.open{ display:flex; }
    /* visible resize grip hint in the bottom-right (over the native handle) */
    .logpanel::after{ content:''; position:absolute; right:3px; bottom:3px; width:11px; height:11px;
      border-right:2px solid #6a727c; border-bottom:2px solid #6a727c; pointer-events:none; }
    .logpanel-head{ display:flex; align-items:center; gap:10px; padding:10px 12px;
      border-bottom:1px solid #333a42; font-size:.9rem; cursor:move; user-select:none; touch-action:none; }
    .logpanel-head .x{ margin-left:auto; cursor:pointer; background:#333a42; border:1px solid #4a525c;
      color:#e6eaee; font-size:.82rem; font-weight:600; line-height:1; padding:6px 12px; border-radius:7px; }
    .logpanel-head .x:hover{ background:#454e58; border-color:#5a636e; }
    .logpanel-head .lstat{ font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:2px 8px; border-radius:999px; background:#2a6db233; }
    .logbody{ flex:1; overflow:auto; padding:10px 14px; font-size:12px; line-height:1.5;
      white-space:pre-wrap; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .logbody .esc{ color:#7fb3e6; }
  </style>
  <link rel="stylesheet" href="/forms/library-shell.css?v=20260830a">
  <link rel="stylesheet" href="/forms/tokens.css?v=20260826b">
</head>
<body>
  <!-- Shared app header: library-shell.js fills the <h1> with the brand and
       mounts the identity badge + both burgers into .header-inner. -->
  <header class="app-header">
    <div class="header-inner">
      <h1></h1>
    </div>
  </header>

  <div class="wrap">
    <h1>Job Monitor</h1>
    <p class="sub">Live view of the run queue — what's running, queued, and recently finished. Watch a job's log, cancel a running one, or spawn a queued one. (Scheduled jobs live under <a href="/forms/jobs_admin.html">Jobs/Scheduled</a>.)</p>

    <div class="toolbar">
      <select id="fStatus" aria-label="Status">
        <option value="active" selected>Active (running + queued)</option>
        <option value="running">Running</option>
        <option value="queued">Queued</option>
        <option value="">All recent</option>
        <option value="success">Success</option>
        <option value="error">Error</option>
        <option value="cancelled">Cancelled</option>
      </select>
      <select id="fType" aria-label="Type"><option value="">Any type</option></select>
      <label class="chk"><input type="checkbox" id="autoRefresh" checked> Auto-refresh</label>
      <button id="refreshBtn" type="button">↻ Refresh</button>
      <span class="spacer"></span>
      <span class="count" id="count"></span>
    </div>

    <div id="list"><p class="empty">Loading…</p></div>
  </div>

  <div class="logpanel" id="logPanel">
    <div class="logpanel-head">
      <span id="logTitle">Log</span>
      <span class="lstat" id="logStat"></span>
      <button class="x" id="logClose" title="Close (Esc)">✕ Close</button>
    </div>
    <div class="logbody" id="logBody"></div>
  </div>

  <script src="/forms/library-shell.js?v=20260830a"></script>
  <script>
    const $ = (s, el=document) => el.querySelector(s);
    if (window.LibraryShell && LibraryShell.initNav) LibraryShell.initNav({ currentPage: 'jobs-monitor' });
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmt = (iso) => { if(!iso) return '—'; try { return new Date(iso).toLocaleString(); } catch(_){ return iso; } };

    const TERMINAL = new Set(['success','error','cancelled']);
    const list = $('#list'), countEl = $('#count');
    let lastJobs = [], typesSeen = new Set();

    function dur(j){
      const a = j.started_at && new Date(j.started_at);
      const b = (j.finished_at && new Date(j.finished_at)) || (j.status === 'running' ? new Date() : null);
      if (!a || !b || isNaN(a) || isNaN(b)) return '';
      let s = Math.max(0, Math.round((b - a)/1000));
      const m = Math.floor(s/60); s = s%60;
      return m ? `${m}m ${s}s` : `${s}s`;
    }

    function jobCard(j){
      const live = j.status === 'running';
      const ref = j.entity_ref ? `<span class="jref">${esc(j.entity_ref)}</span>` : '';
      const d = dur(j);
      const meta = [
        `created <b>${esc(fmt(j.created_at))}</b>`,
        j.started_at ? `started <b>${esc(fmt(j.started_at))}</b>` : '',
        j.finished_at ? `finished <b>${esc(fmt(j.finished_at))}</b>` : '',
        d ? `took <b>${d}</b>` : '',
      ].filter(Boolean).join(' · ');
      const acts = [];
      acts.push(`<button data-act="log" data-id="${j.id}">📜 Log</button>`);
      if (j.status === 'running') acts.push(`<button class="danger" data-act="cancel" data-id="${j.id}">✋ Cancel</button>`);
      if (j.status === 'queued') acts.push(`<button data-act="spawn" data-id="${j.id}">▶ Run</button>`);
      const err = (j.status === 'error' && j.error_detail) ? `<div class="jerr">${esc(j.error_detail).slice(0,400)}</div>` : '';
      return `<div class="job${live?' live':''}">
        <div class="job-head">
          ${live ? '<span class="dot"></span>' : ''}
          <span class="pill ${esc(j.status)}">${esc(j.status)}</span>
          <span class="jid">#${j.id}</span>
          <span class="jtype">${esc(j.type)}</span>
          ${ref}
          <span class="jactions">${acts.join('')}</span>
        </div>
        <div class="jmeta">${meta}</div>
        ${err}
      </div>`;
    }

    async function loadJobs(){
      const status = $('#fStatus').value;
      const type = $('#fType').value;
      try {
        // 'active' = running + queued (two cheap calls merged); else one filtered call.
        let jobs;
        if (status === 'active') {
          const [r, q] = await Promise.all([
            fetch('/jobs?status=running&limit=50').then(x=>x.json()),
            fetch('/jobs?status=queued&limit=50').then(x=>x.json()),
          ]);
          jobs = [...(r||[]), ...(q||[])];
        } else {
          const qs = new URLSearchParams({ limit: 60 });
          if (status) qs.set('status', status);
          jobs = await fetch('/jobs?'+qs).then(x=>x.json());
        }
        if (type) jobs = jobs.filter(j => j.type === type);
        jobs.sort((a,b) => (b.id||0) - (a.id||0));
        lastJobs = jobs;
        // Grow the type filter from whatever we've seen.
        let added = false;
        jobs.forEach(j => { if (j.type && !typesSeen.has(j.type)) { typesSeen.add(j.type); added = true; } });
        if (added) {
          const sel = $('#fType'), cur = sel.value;
          sel.innerHTML = '<option value="">Any type</option>' +
            [...typesSeen].sort().map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
          sel.value = cur;
        }
        list.innerHTML = jobs.length ? jobs.map(jobCard).join('')
          : '<p class="empty">No jobs match.</p>';
        const running = jobs.filter(j=>j.status==='running').length;
        const queued = jobs.filter(j=>j.status==='queued').length;
        countEl.textContent = `${jobs.length} shown · ${running} running · ${queued} queued`;
      } catch (e) {
        list.innerHTML = `<p class="empty">Could not load jobs (${esc(e.message||e)}).</p>`;
      }
    }

    // ---- actions ----
    list.addEventListener('click', (ev) => {
      const btn = ev.target.closest('button[data-act]'); if (!btn) return;
      const id = Number(btn.dataset.id), act = btn.dataset.act;
      if (act === 'log') openLog(id);
      else if (act === 'cancel') cancelJob(id);
      else if (act === 'spawn') spawnJob(id);
    });

    async function cancelJob(id){
      if (!confirm(`Cancel job #${id}? (cooperative — it stops after the current unit)`)) return;
      try {
        const r = await fetch(`/jobs/${id}/cancel`, { method:'POST' });
        if (!r.ok) { const d = await r.json().catch(()=>({})); alert(`Cancel failed: ${d.detail || ('HTTP '+r.status)}`); }
      } catch(e){ alert('Cancel failed: '+(e.message||e)); }
      loadJobs();
    }

    async function spawnJob(id){
      try {
        const r = await fetch(`/jobs/${id}/spawn`, { method:'POST' });
        if (!r.ok) { const d = await r.json().catch(()=>({})); alert(`Run failed: ${d.detail || ('HTTP '+r.status)}`); return; }
        setTimeout(loadJobs, 600);
        openLog(id);
      } catch(e){ alert('Run failed: '+(e.message||e)); }
    }

    // ---- log panel (SSE for live jobs, static log file for finished) ----
    const panel = $('#logPanel'), logBody = $('#logBody'), logTitle = $('#logTitle'), logStat = $('#logStat');
    let es = null;
    function closeLog(){ if (es){ es.close(); es = null; } panel.classList.remove('open'); }
    $('#logClose').addEventListener('click', closeLog);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && panel.classList.contains('open')) closeLog(); });

    // Drag the window by its header (ignore the Close button). Resizing is native
    // (CSS resize:both). Once dragged, it keeps its last position across re-opens.
    (function makeDraggable(){
      const handle = $('.logpanel-head');
      let sx=0, sy=0, ox=0, oy=0, dragging=false;
      handle.addEventListener('pointerdown', (e) => {
        if (e.target.closest('#logClose')) return;       // let the close button work
        const r = panel.getBoundingClientRect();
        panel.style.transform = 'none';                  // drop the centering transform
        panel.style.left = r.left + 'px'; panel.style.top = r.top + 'px';
        ox = r.left; oy = r.top; sx = e.clientX; sy = e.clientY; dragging = true;
        try { handle.setPointerCapture(e.pointerId); } catch(_){}
        e.preventDefault();
      });
      handle.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        let nx = ox + (e.clientX - sx), ny = oy + (e.clientY - sy);
        nx = Math.max(0, Math.min(nx, window.innerWidth - 80));   // keep a grab-edge on-screen
        ny = Math.max(0, Math.min(ny, window.innerHeight - 40));
        panel.style.left = nx + 'px'; panel.style.top = ny + 'px';
      });
      const end = (e) => { dragging = false; try { handle.releasePointerCapture(e.pointerId); } catch(_){} };
      handle.addEventListener('pointerup', end);
      handle.addEventListener('pointercancel', end);
    })();

    function setLogStat(s){ logStat.textContent = s || ''; }
    function appendLog(line){
      const atBottom = logBody.scrollHeight - logBody.scrollTop - logBody.clientHeight < 40;
      logBody.insertAdjacentText('beforeend', (line.endsWith('\n') ? line : line + '\n'));
      if (atBottom) logBody.scrollTop = logBody.scrollHeight;
    }

    async function openLog(id){
      if (es){ es.close(); es = null; }
      const job = lastJobs.find(j => j.id === id);
      logTitle.textContent = `Job #${id}` + (job ? ` · ${job.type}` : '');
      logBody.textContent = '';
      setLogStat(job ? job.status : '');
      panel.classList.add('open');

      // Finished job → just load its static log file (no stream replay games).
      if (job && TERMINAL.has(job.status)) {
        if (job.log_url) {
          try { logBody.textContent = await fetch(job.log_url).then(x=>x.text()); }
          catch(e){ logBody.textContent = '(could not load log file: '+(e.message||e)+')'; }
          logBody.scrollTop = logBody.scrollHeight;
        } else { logBody.textContent = '(no log file for this job)'; }
        return;
      }

      // Running/queued → live stream.
      es = new EventSource(`/jobs/${id}/stream`);
      es.addEventListener('log', e => { try { appendLog(JSON.parse(e.data).line); } catch(_){ appendLog(e.data); } });
      es.addEventListener('status', e => { try { setLogStat(JSON.parse(e.data).status); } catch(_){} loadJobs(); });
      es.addEventListener('done', e => {
        try { setLogStat(JSON.parse(e.data).status || 'done'); } catch(_){ setLogStat('done'); }
        if (es){ es.close(); es = null; }
        loadJobs();
      });
      es.onerror = () => { /* network blip / closed — leave what we have, refresh list */ loadJobs(); };
    }

    // ---- wiring ----
    $('#fStatus').addEventListener('change', loadJobs);
    $('#fType').addEventListener('change', loadJobs);
    $('#refreshBtn').addEventListener('click', loadJobs);

    let timer = null;
    function tick(){ if ($('#autoRefresh').checked) loadJobs(); }
    function startTimer(){ if (!timer) timer = setInterval(tick, 4000); }
    $('#autoRefresh').addEventListener('change', () => { if ($('#autoRefresh').checked) loadJobs(); });

    loadJobs();
    startTimer();
  </script>
</body>
</html>
