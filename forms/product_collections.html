<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Best Cooks Club — Admin · Product Collections</title>
  <!-- Product-collection editor on the shared master/detail editor shell. A COLLECTION is a
       named saved Amazon search URL: the curator builds the search by hand in Amazon's own
       UI until the result set is right, and the URL carries every criterion, so the URL IS
       the query. Refresh runs it — EasyParser SEARCH for the cohort, then free per-ASIN star
       histograms to rescore the top N. The WHOLE cohort is kept (winners ★ + dimmed
       also-rans) so selection is auditable, not just its survivors.
       Cloned from domains.html per memory/feedback_editor_template_not_runtime; typography
       and controls deliberately identical. See memory/project_amazon_collection_selection. -->
  <link rel="stylesheet" href="/forms/editor-shell.css?v=20260828b">
  <link rel="stylesheet" href="/forms/tokens.css?v=20260826b">
  <link rel="stylesheet" href="/forms/components.css?v=20260813b">
  <style>
    .pc-form .ed-field { margin-bottom: 10px; }
    .pc-form label { display: block; font-size: .78rem; font-weight: 600; margin-bottom: 3px; color: var(--ed-ink-soft); }
    .pc-form input, .pc-form textarea, .pc-form select { width: 100%; padding: 8px 10px;
      border: 1px solid var(--line); border-radius: 7px; font: inherit; font-size: .9rem; background: var(--card); }
    .pc-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pc-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .pc-form-actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
    .muted { color: var(--ed-ink-soft); }
    /* Cohort rows — winners solid, also-rans dimmed but PRESENT. */
    .cd { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0;
      border-top: 1px solid var(--line); font-size: .88rem; }
    .cd:first-child { border-top: 0; }
    .cd.dim { opacity: .55; }
    .cd img { width: 44px; height: 44px; object-fit: contain; border: 1px solid var(--line);
      border-radius: 6px; background: var(--card); flex: 0 0 auto; }
    .cd-main { flex: 1; min-width: 0; }
    .cd-t { font-weight: 600; }
    .cd-meta { font-size: .78rem; color: var(--ed-ink-soft); }
    .cd-sc { flex: 0 0 auto; text-align: right; font-variant-numeric: tabular-nums; min-width: 104px; }
    .cd-sc b { font-size: 1rem; }
    .star { color: #c8901b; }
    .pill-w { display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .03em;
      text-transform: uppercase; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line);
      color: var(--ed-ink-soft); margin-left: 5px; }
    .pill-w.polarizing { color: #b4552f; border-color: #f0d8cb; background: #fbefe8; }
    .pill-w.clean { color: #1f8a54; border-color: #cfe9da; background: #eaf6ef; }
    .medal { font-size: .72rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; }
    .medal.gold { background: #fbf1d4; color: #96700c; }
    .medal.silver { background: #eceff1; color: #5c6b73; }
    .medal.bronze { background: #f6e3d6; color: #96552a; }
    #joblog { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .74rem;
      white-space: pre-wrap; max-height: 230px; overflow: auto; background: var(--bg);
      border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; margin-top: 8px; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <button class="ed-back" id="edBack" aria-label="Toggle list"></button>
      <div class="ed-brand">Best Cooks Club</div>
    </div>
  </header>
  <div class="ed-scrim" id="edScrim"></div>

  <div class="ed-app">
    <aside class="ed-sidebar">
      <div class="ed-sidebar-head">
        <h2>Collections <span class="ed-count" id="count"></span></h2>
        <div class="ed-head-actions">
          <button class="ed-icon-btn" id="searchToggle" title="Search" aria-label="Search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
          <button class="ed-icon-btn" id="addToggle" title="Add a collection" aria-label="Add">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>
      </div>
      <div class="ed-controls" id="controls" hidden>
        <input type="search" id="search" placeholder="Search collections…">
        <select id="sort">
          <option value="name">Sort: name (A–Z)</option>
          <option value="category">Sort: category</option>
          <option value="recent">Sort: recently run</option>
          <option value="stale">Sort: least recently run</option>
          <option value="size">Sort: most candidates</option>
        </select>
      </div>
      <ul class="ed-list" id="list"><li class="ed-empty">Loading…</li></ul>
    </aside>

    <main class="ed-content"><div class="ed-page" id="page"></div></main>
  </div>

  <script src="/forms/library-shell.js?v=20260831b"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    LibraryShell.initNav({ currentPage: 'collections' });
    const nav = LibraryShell.initEditorNav({
      backButton: '#edBack', scrim: '#edScrim',
      listLabel: 'Collections', listMode: 'docked', shellWidth: 1200,
    });
    const { escapeHtml, flash, urlField } = LibraryShell;

    let rows = [], byName = {}, cats = [];
    let selected = null, term = '', sortBy = 'name';
    let mode = 'view';            // 'view' | 'add' | 'edit'
    let detail = null;            // full collection + candidates
    // RealRank by default (curator 2026-08-31): it's THE index; unscored rows
    // sink to the bottom naturally (NULL sorts last on DESC). Wilson stays as
    // an option under its honest name.
    let candOrder = 'realrank';
    let es = null;                // job SSE

    async function load(keep){
      try {
        const d = await (await fetch('/product-collections')).json();
        rows = d.collections || []; cats = d.ws_categories || [];
        byName = Object.fromEntries(rows.map(r => [r.name, r]));
        $('#count').textContent = rows.length ? `(${rows.length})` : '';
        if (keep && byName[keep]) selected = keep;
        renderList(); await renderDetail();
      } catch(e){ $('#page').innerHTML = `<p class="muted">Load failed: ${escapeHtml(e.message||e)}</p>`; }
    }

    /* ---------------- list ---------------- */
    function sorted(list){
      const by = {
        name:     (a,b) => a.name.localeCompare(b.name),
        category: (a,b) => (a.ws_path||'~').localeCompare(b.ws_path||'~') || a.name.localeCompare(b.name),
        recent:   (a,b) => (b.last_run_at||'').localeCompare(a.last_run_at||''),
        stale:    (a,b) => (a.last_run_at||'').localeCompare(b.last_run_at||''),
        size:     (a,b) => (b.candidate_count||0) - (a.candidate_count||0),
      }[sortBy] || ((a,b)=>a.name.localeCompare(b.name));
      return [...list].sort(by);
    }

    function renderList(){
      const t = term.trim().toLowerCase();
      const list = sorted(rows.filter(r => !t ||
        (r.name+' '+(r.display_name||'')+' '+(r.ws_path||'')).toLowerCase().includes(t)));
      // Shared list-row component (ed-item) — same fix as curated_collections
      // 2026-08-28: classless li's + undefined .ed-sub rendered as bare text.
      $('#list').innerHTML = list.length ? list.map(r => `
        <li class="ed-item ${r.name===selected?'selected':''}" data-name="${escapeHtml(r.name)}">
          <div class="ed-item-top"><span class="ed-item-name">${escapeHtml(r.display_name || r.name)}</span></div>
          <div class="ed-item-meta">${escapeHtml(r.ws_path || '— uncategorized —')} · ${
            r.candidate_count||0} candidates${r.selected_count?` · ${r.selected_count}★`:''}${
            r.last_run_at?` · ${ago(r.last_run_at)}`:' · never run'}</div>
        </li>`).join('') : '<li class="ed-empty">No collections</li>';
      $('#list').querySelectorAll('li[data-name]').forEach(li =>
        li.addEventListener('click', async () => {
          selected = li.dataset.name; mode='view'; detail=null;
          renderList(); await renderDetail(); nav.afterSelect();
        }));
    }

    function ago(iso){
      const d = Math.floor((Date.now() - Date.parse(iso)) / 86400000);
      return isNaN(d) ? '' : (d<=0 ? 'today' : d===1 ? '1d ago' : d+'d ago');
    }

    /* ---------------- detail ---------------- */
    async function ensureDetail(){
      if (detail && detail.name === selected) return detail;
      detail = await (await fetch(`/product-collections/${encodeURIComponent(selected)}?order=${candOrder}`)).json();
      return detail;
    }

    async function renderDetail(){
      if (mode === 'add') return renderForm(null);
      if (mode === 'edit' && selected) return renderForm(await ensureDetail());
      if (!selected || !byName[selected]) return renderIntro();
      let c;
      try { c = await ensureDetail(); }
      catch(e){ $('#page').innerHTML = `<p class="muted">Load failed: ${escapeHtml(e.message||e)}</p>`; return; }

      const all = c.candidates || [];
      const cands = all.filter(x => !x.excluded);
      const excluded = all.filter(x => x.excluded);
      const screened = cands.filter(x => x.screened);
      $('#page').innerHTML = `
        <div class="ed-kicker"><button type="button" class="ed-purpose-toggle" id="back">← Collections</button></div>
        <h1 class="ed-title">${escapeHtml(c.display_name || c.name)}</h1>
        <div class="ed-status-strip">
          <span class="ed-pill"><i class="d"></i>${escapeHtml(c.ws_path || 'uncategorized')}</span>
          <span class="ed-pill"><i class="d"></i>${cands.length} candidates</span>
          <span class="ed-pill"><i class="d"></i>${screened.length} screened</span>
          <span class="ed-pill"><i class="d"></i>keep ${c.keep_top_n}</span>
          <span class="ed-pill"><i class="d"></i>${c.last_run_at ? 'run '+ago(c.last_run_at) : 'never run'}</span>
        </div>
        <div style="display:flex;gap:8px;margin:6px 0 4px;align-items:center;flex-wrap:wrap">
          <button type="button" class="ed-btn primary" id="refreshBtn">↻ Refresh</button>
          <button type="button" class="ed-btn" id="editBtn">Edit</button>
          <span class="muted" id="jobStatus" style="font-size:.82rem"></span>
          <button type="button" class="ed-btn" id="delBtn" style="margin-left:auto;color:#b23b3b">Delete</button>
        </div>
        <div id="joblog" hidden></div>

        <section class="ed-block">
          <h3 class="ed-block-label">The search</h3>
          <div style="display:flex;gap:8px;align-items:center">
            <input id="urlRO" value="${escapeHtml(c.url||'')}" readonly style="flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:.86rem;background:var(--bg)">
            ${LibraryShell.urlControl(c.url||'', {display:false})}
          </div>
          <p class="muted" style="font-size:.8rem;margin:6px 0 0">Built in Amazon's own UI; every
            criterion lives in the URL. Refresh translates it to a search call at run time —
            ${c.pages} page${c.pages===1?'':'s'} (1 credit each).</p>
          ${c.notes?`<p style="margin-top:8px">${escapeHtml(c.notes)}</p>`:''}
        </section>

        <section class="ed-block">
          <h3 class="ed-block-label">Cohort
            <span class="muted" style="font-weight:400">— everything the search returned, kept</span></h3>
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
            <select id="candOrder" style="padding:6px 8px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:.82rem">
              <option value="realrank">Order: RealRank</option>
              <option value="wilson">Order: Wilson screen</option>
              <option value="position">Order: Amazon's own</option>
              <option value="ratings">Order: most rated</option>
              <option value="rating">Order: highest stars</option>
            </select><button type="button" class="info-dot" data-info-title="The two scores"
              data-info="RealRank is THE index — computed from the real star histogram, but only
              for the top candidates a fetch was spent on (the shortlist). Wilson screen is the
              cheap stage-1 gate every candidate gets: a lower bound on quality implied by the
              star average and count, so 4.8★ from 22,000 ratings beats 4.9★ from 111. Ordering
              by RealRank shows the scored shortlist first; unscored rows sink to the bottom
              with their Wilson number."></button>
            <span class="muted" style="font-size:.8rem">Dimmed rows were returned but not screened.</span>
            <button type="button" class="ed-btn" id="materializeBtn" style="margin-left:auto"
              title="Create/update a catalog product record for every medaled candidate (find-or-create by ASIN, then brand+title — no duplicates; re-running updates)">⬇ Medalists → catalog</button>
            <button type="button" class="ed-btn" id="screenOffclassBtn"
              title="One cheap AI pass over the titles: candidates that aren't this class (smoked when you asked for sweet, accessories, bundles) get the standard restorable exclusion.">✨ Screen off-class</button>
            <span class="muted" id="matHint" style="font-size:.8rem"></span>
          </div>
          ${cands.length ? cands.map(candRow).join('') : '<p class="muted">— no run yet —</p>'}
          ${excluded.length ? `
            <h3 class="ed-block-label" style="margin-top:14px">Excluded
              <span class="muted" style="font-weight:400">— removed by you, stays out</span><button
                type="button" class="info-dot" data-info-title="Excluded candidates"
                data-info="Removing a candidate is a persistent exclusion, not a one-off delete:
                the search would return the same ASIN on every refresh, so the row is kept,
                flagged, and skipped by refresh, screening, medals and materialize until you
                restore it. Excluding cleared any medal it held."></button></h3>
            ${excluded.map(x => `
              <div class="cd dim">
                ${x.image?`<a href="${x.asin?asinHref(x.asin):escapeHtml(x.link||'#')}" target="_blank" rel="noopener" title="Open on Amazon"><img src="${escapeHtml(x.image)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"></a>`:'<div style="width:44px"></div>'}
                <div class="cd-main">
                  <div class="cd-t">${escapeHtml(x.title||x.asin)}</div>
                  <div class="cd-meta"><span class="star">★</span>${x.rating ?? '—'} · ${(x.ratings_total||0).toLocaleString()} ratings${x.asin?` · ASIN <a href="${asinHref(x.asin)}" target="_blank" rel="noopener">${escapeHtml(x.asin)}</a>`:''}${x.link?` · <a href="${escapeHtml(x.link)}" target="_blank" rel="noopener">open ↗</a>`:''}</div>
                </div>
                <div class="cd-sc"><button type="button" class="ed-btn" data-restore="${escapeHtml(x.asin)}" style="padding:2px 8px;font-size:.74rem">Restore</button></div>
              </div>`).join('')}` : ''}
        </section>`;

      $('#candOrder').value = candOrder;
      $('#back').addEventListener('click', () => { selected=null; detail=null; renderList(); renderDetail(); });
      $('#editBtn').addEventListener('click', () => { mode='edit'; renderDetail(); });
      $('#refreshBtn').addEventListener('click', doRefresh);
      $('#screenOffclassBtn')?.addEventListener('click', async () => {
        const b = $('#screenOffclassBtn');
        b.disabled = true; const lbl = b.textContent; b.textContent = 'Screening…';
        try {
          const r = await fetch(`/product-collections/${encodeURIComponent(selected)}/screen-offclass`, { method: 'POST' });
          const d = await r.json();
          if (!r.ok) throw new Error(d.detail || 'HTTP '+r.status);
          flash && flash(d.excluded.length
            ? `${d.excluded.length} off-class excluded: ${d.excluded.map(x=>x.reason).slice(0,4).join(' · ')}`
            : 'All candidates look on-class');
          detail = null; await renderDetail();
        } catch(e){ flash && flash('Screen failed: ' + (e.message||e)); }
        finally { b.disabled = false; b.textContent = lbl; }
      });
      $('#materializeBtn')?.addEventListener('click', async () => {
        const btn = $('#materializeBtn'), hint = $('#matHint');
        btn.disabled = true; hint.textContent = 'materializing…';
        try {
          const r = await fetch(`/product-collections/${encodeURIComponent(selected)}/materialize`, { method: 'POST' });
          const d = await r.json();
          if (!r.ok) throw new Error(d.detail || `HTTP ${r.status}`);
          const n = (d.materialized || []).length;
          const msg = n
            ? `✓ ${n} medalist${n === 1 ? '' : 's'}: ${d.created} created, ${d.merged} merged — see Products`
            : 'no medals yet — medal candidates first';
          detail = null; await renderDetail();     // re-render wipes the hint element…
          const h = $('#matHint'); if (h) h.textContent = msg;   // …so restate on the fresh one
        } catch (e) {
          hint.textContent = `failed: ${e.message || e}`;
          btn.disabled = false;
        }
      });
      $('#candOrder').addEventListener('change', async e => {
        candOrder = e.target.value; detail = null; await renderDetail();
      });
      $('#page').querySelectorAll('[data-medal]').forEach(b => b.addEventListener('click', async () => {
        const { asin, medal } = b.dataset;
        // Surface failure (2026-08-31): this used to ignore the response, so a
        // failed medal re-rendered silently and read as "the button does nothing".
        try {
          const r = await fetch(`/product-collections/${encodeURIComponent(selected)}/medal`, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ asin, medal }) });
          if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || 'HTTP ' + r.status);
          detail = null; await renderDetail();
          // Say it saved — a repaint alone reads as nothing (chip-save lesson).
          const st = $('#jobStatus');
          if (st) st.textContent = medal ? `✓ ${medal} — saved` : '✓ medal cleared';
        } catch (e) {
          const st = $('#jobStatus'); if (st) st.textContent = `medal failed: ${e.message || e}`;
          console.error(e);
        }
      }));
      // Armed two-click, the sub-item standard: first click asks, second commits.
      $('#page').querySelectorAll('[data-exclude]').forEach(b => b.addEventListener('click', async () => {
        if (!b.dataset.armed) {
          b.dataset.armed = '1'; b.textContent = 'sure?'; b.style.fontWeight = '800';
          setTimeout(() => { if (b.isConnected) { b.dataset.armed=''; b.textContent='remove'; b.style.fontWeight=''; } }, 3000);
          return;
        }
        b.disabled = true;
        try {
          const r = await fetch(`/product-collections/${encodeURIComponent(selected)}/candidates/${encodeURIComponent(b.dataset.exclude)}`, { method:'DELETE' });
          if (!r.ok) throw new Error((await r.json()).detail || 'HTTP '+r.status);
          detail = null; await renderDetail();
        } catch(e){ b.disabled = false; b.textContent = 'failed'; console.error(e); }
      }));
      $('#page').querySelectorAll('[data-restore]').forEach(b => b.addEventListener('click', async () => {
        b.disabled = true;
        try {
          const r = await fetch(`/product-collections/${encodeURIComponent(selected)}/candidates/${encodeURIComponent(b.dataset.restore)}/restore`, { method:'POST' });
          if (!r.ok) throw new Error((await r.json()).detail || 'HTTP '+r.status);
          detail = null; await renderDetail();
        } catch(e){ b.disabled = false; b.textContent = 'failed'; console.error(e); }
      }));
      wireDelete();
    }

    // Same treatment as curated_collections (2026-08-31): clean /dp/ link
    // built from the ASIN (never the harvested link's tracking). Images come
    // from the stored search-result photo; the old AsinImage widget endpoint
    // is DEAD (DNS gone) — never reference it.
    const asinHref = (asin) => `https://www.amazon.com/dp/${encodeURIComponent(asin)}`;

    function candRow(x){
      const pol = (x.polarization||'').toLowerCase();
      // Medals are only offered on SCREENED candidates: a gold awarded off an unscreened
      // average would be exactly the judgement stage 2 exists to prevent.
      // Clear-medal renders as '–': the earlier '×' beside G/S/B read as
      // "remove this row" while removal didn't exist (delete audit 2026-08-31).
      // The AWARDED medal paints its button in the medal palette — a bold-only
      // state at .68rem was invisible and read as "the button does nothing"
      // (curator 2026-08-31; same lesson as the dish chips' quiet save).
      const MPAL = { gold: 'background:#fbf1d4;color:#96700c;border-color:#d9b44a',
                     silver: 'background:#eceff1;color:#5c6b73;border-color:#9fb0b8',
                     bronze: 'background:#f6e3d6;color:#96552a;border-color:#c98d5f' };
      // Touch-sized (2026-09-05, curator: "too small for most fingers"):
      // 40px targets, comfortably tappable on the iPad.
      const medals = !x.screened ? '' : ['gold','silver','bronze',''].map(m =>
        `<button type="button" class="ed-btn" data-medal="${m}" data-asin="${escapeHtml(x.asin)}"
           title="${m||'clear medal'}" style="min-width:40px;min-height:38px;padding:6px 10px;font-size:.9em${
             x.medal===m && m ? ';font-weight:800;'+MPAL[m] : ''}"
           >${m ? m[0].toUpperCase() : '–'}</button>`).join(' ');
      // OFF-FORM chip: deterministic contradicting-form guard (sweet vs smoked
      // — the whole-vs-ground rule, surfaced post-harvest). Flags, never hides.
      const FORMS = ['sweet','smoked','hot','whole','ground','powder','sticks','seeds','dried','fresh','instant'];
      const collForms = FORMS.filter(f => (selected||'').toLowerCase().includes(f));
      const titleForms = FORMS.filter(f => (x.title||'').toLowerCase().includes(f));
      const clash = collForms.length ? titleForms.filter(f => !collForms.includes(f)) : [];
      const offForm = clash.length
        ? `<span class="rv-src" style="background:#fff2df;color:#8a5a1b;border:1px solid #d9a55a" title="Title says ${clash.join('/')} but the collection asked for ${collForms.join('/')}">⚠ ${escapeHtml(clash[0])} ≠ ${escapeHtml(collForms[0])}</span>` : '';
      return `
        <div class="cd ${x.screened?'':'dim'}">
          ${x.image
            ? (x.asin
                ? `<a href="${asinHref(x.asin)}" target="_blank" rel="noopener" title="Open on Amazon"><img src="${escapeHtml(x.image)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"></a>`
                : `<img src="${escapeHtml(x.image)}" alt="" onerror="this.style.visibility='hidden'">`)
            : '<div style="width:44px"></div>'}
          <div class="cd-main">
            <div class="cd-t">${escapeHtml(x.title||x.asin)}
              ${offForm}
              ${x.medal?`<span class="medal ${escapeHtml(x.medal)}">${escapeHtml(x.medal)}</span>`:''}
              ${x.product_id?`<span class="pill-w" title="Materialized into the product catalog (${escapeHtml(x.product_id)})" style="background:#e2efeb;color:#0f6e5c">in catalog</span>`:''}</div>
            <div class="cd-meta">
              <span class="star">★</span>${x.rating ?? '—'} · ${(x.ratings_total||0).toLocaleString()} ratings
              ${x.price?` · ${escapeHtml(x.price)}`:''} · #${x.position ?? '?'} on Amazon
              ${x.asin?` · ASIN <a href="${asinHref(x.asin)}" target="_blank" rel="noopener" title="Open on Amazon">${escapeHtml(x.asin)}</a>`:''}
              ${pol?`<span class="pill-w ${escapeHtml(pol)}">${escapeHtml(pol)}</span>`:''}
              ${x.link?` · <a href="${escapeHtml(x.link)}" target="_blank" rel="noopener">open ↗</a>`:''}
            </div>
          </div>
          <div class="cd-sc">
            ${x.realrank_score!=null?`<b>${x.realrank_score}</b><div class="muted" style="font-size:.7rem">RealRank</div>`
                                    :`<b class="muted">${x.wilson_score ?? '—'}</b><div class="muted" style="font-size:.7rem">screen</div>`}
            ${medals?`<div style="margin-top:4px">${medals}</div>`:''}
            <div style="margin-top:4px"><button type="button" class="ed-btn" data-exclude="${escapeHtml(x.asin)}"
              title="Remove from this collection — stays out across refreshes; restorable below"
              style="padding:1px 8px;font-size:.68rem;color:#b23b3b">remove</button></div>
          </div>
        </div>`;
    }

    /* ---------------- refresh + job window ---------------- */
    async function doRefresh(){
      const btn = $('#refreshBtn'), st = $('#jobStatus'), log = $('#joblog');
      btn.disabled = true; st.textContent = 'Starting…'; log.hidden = false; log.textContent = '';
      try {
        const r = await fetch(`/product-collections/${encodeURIComponent(selected)}/refresh`, { method:'POST' });
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || 'HTTP '+r.status);
        st.textContent = `job #${d.job_id} running…`;
        if (es) es.close();
        es = new EventSource(`/jobs/${d.job_id}/stream`);
        es.addEventListener('log', e => {
          log.textContent += (e.data || '') + '\n'; log.scrollTop = log.scrollHeight;
        });
        es.addEventListener('status', e => { st.textContent = `job #${d.job_id} ${e.data}`; });
        es.addEventListener('done', async () => {
          es.close(); es = null; btn.disabled = false;
          detail = null; await load(selected);
        });
        es.onerror = () => { es && es.close(); es = null; btn.disabled = false; };
      } catch(e){ btn.disabled = false; st.textContent = 'Failed: ' + (e.message||e); }
    }

    /* ---------------- add / edit ---------------- */
    function renderIntro(){
      $('#page').innerHTML = `
        <div class="ed-kicker"><span class="ed-purpose-toggle" style="cursor:default">Product selection · ${rows.length} collections</span></div>
        <h1 class="ed-title">Product collections</h1>
        <p class="muted">A collection is a saved Amazon search. Build the search in Amazon
          until the results are right, paste the URL here, and Refresh keeps every ASIN it
          returns — screening the strongest against their real star histograms. Pick one (☰)
          or ＋ to add.<button type="button" class="info-dot"
          data-info-title="Search vs Curated — the two supply lines"
          data-info="This page asks WHAT THOUSANDS OF OWNERS SAY: an Amazon search returns a
          cohort, a free Wilson screen ranks it, the top keep-N get real star histograms and a
          RealRank score, and YOU judge with medals. Its sibling, Curated collections, asks WHAT
          THE NAMED AUTHORITIES SAY: it reads the expert reviews for a product class, ranks with
          written reasoning, and verifies each pick against Amazon. The two never feed each
          other — they converge in the ONE product catalog (find-or-create by ASIN, then
          brand+title), so a product picked by both carries both kinds of evidence on one
          record. Use Search for classes no authority covers (egg separators); use Curated
          where the reviewers have real coverage (Dutch ovens)."></button></p>`;
    }

    function renderForm(c){
      const isEdit = !!c;
      const v = c || {};
      $('#page').innerHTML = `
        <div class="ed-kicker"><button type="button" class="ed-purpose-toggle" id="cancel">← Cancel</button></div>
        <h1 class="ed-title">${isEdit ? 'Edit collection' : 'Add a collection'}</h1>
        <div class="pc-form">
          <div class="pc-row2">
            <div class="ed-field"><label>Name ${isEdit?'(locked — the join key)':'*'}</label>
              <input id="f_name" value="${escapeHtml(v.name||'')}" ${isEdit?'disabled':''} placeholder="Best Dutch Ovens"></div>
            <div class="ed-field"><label>Display name</label>
              <input id="f_display" value="${escapeHtml(v.display_name||'')}" placeholder="optional"></div>
          </div>
          <div class="ed-field"><label>Amazon search URL *</label>
            <div style="display:flex;gap:8px;align-items:center">
              <input id="f_url" value="${escapeHtml(v.url||'')}" placeholder="https://www.amazon.com/s?k=%22dutch+ovens%22" style="flex:1">
              ${LibraryShell.urlControl('', {inputId:'f_url'})}
            </div>
            <p class="muted" style="font-size:.78rem;margin:5px 0 0">Defaults to the
              QUOTED-PHRASE model built from the name — quotes hold Amazon to the topic
              (curator standard, 2026-09-05; the unquoted form drifted off-topic). Edit
              freely for refinements/sorts; a hand-built URL is never overwritten.</p></div>
          <div class="pc-row3">
            <div class="ed-field"><label>Category (WS taxonomy)</label>
              <input id="f_cat" list="dl_cat" value="${escapeHtml(v.ws_path||'')}" placeholder="auto on create">
              <datalist id="dl_cat">${cats.map(x=>`<option value="${escapeHtml(x.path)}">`).join('')}</datalist></div>
            <div class="ed-field"><label>Keep top N (screen)</label>
              <input id="f_keep" type="number" min="1" max="50" value="${v.keep_top_n ?? 10}"></div>
            <div class="ed-field"><label>Pages (1 credit each)</label>
              <input id="f_pages" type="number" min="1" max="5" value="${v.pages ?? 1}"></div>
          </div>
          <div class="ed-field"><label>Notes</label>
            <textarea id="f_notes" style="min-height:70px">${escapeHtml(v.notes||'')}</textarea></div>
          <div class="pc-form-actions">
            <button type="button" class="ed-btn primary" id="save">${isEdit?'Save':'Create'}</button>
            <span class="muted" id="formStatus"></span>
          </div>
        </div>`;
      $('#cancel').addEventListener('click', () => { mode='view'; renderDetail(); });
      $('#save').addEventListener('click', () => saveForm(isEdit ? c : null));
      // Quoted-phrase default: the URL auto-builds from the name as the curator
      // types — k=%22<name>%22 — and keeps following the name while the field
      // still holds an auto-built value. The moment the curator edits the URL
      // by hand, auto-fill stands down (dataset.auto no longer matches).
      const nameEl = $('#f_name'), urlEl = $('#f_url');
      if (nameEl && urlEl && !isEdit){
        const quotedUrl = (n) => 'https://www.amazon.com/s?k=%22' +
          encodeURIComponent(n.trim().toLowerCase()).replace(/%20/g, '+') + '%22';
        nameEl.addEventListener('input', () => {
          const cur = urlEl.value.trim();
          if (cur && cur !== urlEl.dataset.auto) return;   // hand-built — leave it
          urlEl.value = nameEl.value.trim() ? quotedUrl(nameEl.value) : '';
          urlEl.dataset.auto = urlEl.value;
        });
      }
      (isEdit ? $('#f_url') : $('#f_name')).focus();
    }

    async function saveForm(existing){
      const catPath = ($('#f_cat').value||'').trim();
      const cat = cats.find(x => x.path === catPath);
      const body = {
        display_name: ($('#f_display').value||'').trim(),
        url: ($('#f_url').value||'').trim(),
        keep_top_n: Number($('#f_keep').value)||10,
        pages: Number($('#f_pages').value)||1,
        notes: ($('#f_notes').value||'').trim(),
      };
      if (cat) { body.ws_category_id = cat.id; body.ws_path = cat.path; }
      const st = $('#formStatus'); st.textContent = 'Saving…';
      try {
        let r;
        if (existing) {
          r = await fetch(`/product-collections/${encodeURIComponent(existing.name)}`, {
            method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
        } else {
          body.name = ($('#f_name').value||'').trim();
          r = await fetch('/product-collections', {
            method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
        }
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || 'HTTP '+r.status);
        mode='view'; detail=null; await load(d.name || (existing && existing.name));
        flash && flash('Saved');
      } catch(e){ st.textContent = 'Failed: ' + (e.message||e); }
    }

    function wireDelete(){
      const del = $('#delBtn');
      del?.addEventListener('click', async () => {
        if (del.dataset.armed !== '1'){
          del.dataset.armed='1'; del.textContent='Confirm delete?';
          setTimeout(()=>{ if(del.isConnected){ del.dataset.armed=''; del.textContent='Delete'; } }, 3000);
          return;
        }
        del.disabled = true; del.textContent = 'Deleting…';
        try {
          const r = await fetch(`/product-collections/${encodeURIComponent(selected)}`, { method:'DELETE' });
          if (!r.ok) throw new Error('HTTP '+r.status);
          selected=null; detail=null; await load(); flash && flash('Deleted');
        } catch(e){ del.disabled=false; del.textContent='Delete'; flash && flash('Delete failed: '+(e.message||e)); }
      });
    }

    /* ---------------- controls ---------------- */
    $('#searchToggle').addEventListener('click', () => {
      const c = $('#controls'); c.hidden = !c.hidden; if (!c.hidden) $('#search').focus();
    });
    $('#search').addEventListener('input', e => { term = e.target.value; renderList(); });
    $('#sort').addEventListener('change', e => { sortBy = e.target.value; renderList(); });
    $('#addToggle').addEventListener('click', () => { selected=null; detail=null; mode='add'; renderList(); renderDetail(); nav.afterSelect(); });

    // Deep link: #<collection name> opens that collection directly — lets the
    // curated editor's "our cohort ↗" links land on the analysis (2026-09-05).
    load(decodeURIComponent((location.hash || '').slice(1)) || undefined);
  </script>
</body>
</html>
