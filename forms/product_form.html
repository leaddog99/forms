<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Best Cooks Club — Product</title>
<link rel="stylesheet" href="/forms/tokens.css">
<style>
  body { margin: 0; background: var(--bg, #faf7f2); color: var(--ink, #2b2622);
         font-family: Georgia, 'Times New Roman', serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 26px 22px 90px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--ed-ink-soft, #8a7f72); font-size: .9rem; margin: 0 0 18px; }
  .stage { background: var(--card, #fff); border: 1px solid var(--line, #e7ddcf); border-radius: 10px; padding: 14px 16px; margin-bottom: 18px; }
  textarea { width: 100%; min-height: 90px; font-family: ui-monospace, Consolas, monospace; font-size: .82rem;
             border: 1px solid var(--line, #e7ddcf); border-radius: 8px; padding: 9px 11px; resize: vertical; box-sizing: border-box; }
  input[type=text], input[type=number] { width: 100%; font: inherit; font-size: .92rem; padding: 7px 9px;
             border: 1px solid var(--line, #e7ddcf); border-radius: 8px; background: #fff; box-sizing: border-box; }
  label.f { display: block; margin: 10px 0 2px; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ed-ink-soft, #8a7f72); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px 14px; }
  .block { background: var(--card, #fff); border: 1px solid var(--line, #e7ddcf); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  .block h3 { margin: 0 0 6px; font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--ed-ink-soft, #8a7f72); }
  .facts { background: #fbeecb; border: 1px solid #e9d49a; }
  .fact { font-size: .9rem; margin: 6px 0; }
  .fact .tier { font-weight: 700; }
  .fact .verdict { font-style: italic; color: #5a4a2a; }
  .voice { font-size: .9rem; margin-top: 4px; }
  .merge { background: #eef4ff; border: 1px solid #cbd9f2; }
  .merge label { display: block; font-size: .9rem; margin: 4px 0; cursor: pointer; }
  .offer { display: grid; grid-template-columns: 1.2fr 1fr .8fr 2fr; gap: 8px; margin: 6px 0; align-items: center; }
  .btn { font: inherit; font-size: .92rem; padding: 9px 18px; border-radius: 9px; border: 1px solid var(--line, #e7ddcf);
         background: var(--card, #fff); cursor: pointer; }
  .btn.primary { background: var(--accent, #8a5a2b); color: #fff; border-color: var(--accent, #8a5a2b); }
  .btn:disabled { opacity: .55; cursor: default; }
  .bar { position: sticky; bottom: 0; background: var(--bg, #faf7f2); padding: 12px 0; margin-top: 6px; border-top: 1px solid var(--line, #e7ddcf); display: flex; gap: 10px; align-items: center; }
  .msg { font-size: .9rem; }
  .msg.err { color: #a11; } .msg.ok { color: #2e7d32; }
  .chip { display: inline-block; font-size: .74rem; padding: 2px 8px; border-radius: 999px; background: #ece7de; margin-left: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Product <span id="action" class="chip" style="display:none"></span></h1>
  <p class="sub">Extract a product from a retailer page, review the facts we already hold, edit, and save. One product, many vendors.</p>

  <!-- Stage: from the bookmarklet (staged token) OR paste markdown/URL to test -->
  <div class="stage" id="stage">
    <label class="f">Source URL</label>
    <input type="text" id="s_url" placeholder="https://www.amazon.com/dp/…">
    <label class="f">Page markdown (auto-filled by the bookmarklet; paste to test)</label>
    <textarea id="s_md" placeholder="# Product name…"></textarea>
    <div style="margin-top:10px"><button class="btn primary" id="extractBtn">Extract product</button> <span class="msg" id="stageMsg"></span></div>
  </div>

  <div id="form" style="display:none">
    <!-- ATK reverse-table facts -->
    <div class="block facts" id="factsBlock" style="display:none">
      <h3>What we already know (from reviews)</h3>
      <div id="factsBody"></div>
    </div>

    <!-- Vendor-merge suggestion -->
    <div class="block merge" id="mergeBlock" style="display:none">
      <h3>Looks familiar</h3>
      <div id="mergeBody"></div>
    </div>

    <div class="block">
      <h3>Product</h3>
      <div class="grid2">
        <div><label class="f">Name</label><input type="text" id="p_name"></div>
        <div><label class="f">Brand</label><input type="text" id="p_brand"></div>
        <div><label class="f">Category (aisle)</label><input type="text" id="p_category" placeholder="Cookware"></div>
        <div><label class="f">Product class (size-scoped)</label><input type="text" id="p_class" placeholder="Saucepans (2 qt)"></div>
      </div>
      <label class="f">Image URL</label><input type="text" id="p_image">
    </div>

    <div class="block">
      <h3>Specs — size is how it maps to the right class</h3>
      <div class="grid3">
        <div><label class="f">Model #</label><input type="text" id="sp_model"></div>
        <div><label class="f">MPN</label><input type="text" id="sp_mpn"></div>
        <div><label class="f">GTIN/UPC</label><input type="text" id="sp_gtin"></div>
        <div><label class="f">Capacity</label><input type="text" id="sp_capacity"></div>
        <div><label class="f">Dimensions</label><input type="text" id="sp_dims"></div>
        <div><label class="f">Weight</label><input type="text" id="sp_weight"></div>
        <div style="grid-column:1/3"><label class="f">Material</label><input type="text" id="sp_material"></div>
        <div><label class="f">Dishwasher</label><input type="text" id="sp_dish"></div>
      </div>
    </div>

    <div class="block">
      <h3>Vendors (offers)</h3>
      <div id="offers"></div>
    </div>

    <div class="block">
      <h3>BCC editorial — our voice</h3>
      <label class="f">Pick (Best Overall / Best Value / …)</label><input type="text" id="p_pick">
      <label class="f">Blurb</label><textarea id="p_blurb" style="min-height:70px;font-family:inherit;font-size:.92rem"></textarea>
    </div>

    <div class="bar">
      <button class="btn primary" id="saveBtn">Save product</button>
      <span class="msg" id="saveMsg"></span>
    </div>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const val = (id) => ($('#' + id)?.value || '').trim();
const set = (id, v) => { const e = $('#' + id); if (e) e.value = v == null ? '' : v; };
let CURRENT = null;      // the extracted/edited product
let MERGE_INTO = null;   // product_id to merge into, or null = new

function qs(k) { return new URLSearchParams(location.search).get(k); }

async function loadStaged() {
  const token = qs('staged');
  if (qs('url')) set('s_url', qs('url'));
  if (!token) return;
  try {
    const r = await fetch('/staged-markdown/' + encodeURIComponent(token));
    if (!r.ok) return;
    const d = await r.json();
    set('s_md', d.markdown || '');
    if (d.source_url) set('s_url', d.source_url);
    // auto-extract when the bookmarklet staged it
    if (d.markdown) extract();
  } catch {}
}

async function extract() {
  const md = val('s_md'), url = val('s_url');
  if (!md) { $('#stageMsg').textContent = 'Paste the page markdown (or use the bookmarklet).'; return; }
  $('#extractBtn').disabled = true; $('#stageMsg').textContent = 'Extracting…';
  try {
    const r = await fetch('/extract-product', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ markdown: md, source_url: url }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || ('HTTP ' + r.status));
    CURRENT = d.product;
    fillForm(d.product);
    renderFacts(d.facts || []);
    renderMerge(d.matches || {});
    $('#form').style.display = '';
    $('#stageMsg').textContent = 'Extracted — review, edit, and save.';
  } catch (e) {
    $('#stageMsg').textContent = 'Extract failed: ' + (e.message || e);
  } finally { $('#extractBtn').disabled = false; }
}

function fillForm(p) {
  set('p_name', p.name); set('p_brand', p.brand); set('p_category', p.category); set('p_class', p.product_class);
  set('p_image', p.image_url);
  const s = p.specs || {};
  set('sp_model', s.model_number); set('sp_mpn', s.mpn); set('sp_gtin', s.gtin);
  set('sp_capacity', s.capacity); set('sp_dims', s.dimensions_in); set('sp_weight', s.weight);
  set('sp_material', s.material); set('sp_dish', s.dishwasher_safe);
  set('p_pick', p.bcc_pick); set('p_blurb', p.bcc_blurb);
  renderOffers(p.retailer_offers || []);
}

function renderOffers(offers) {
  $('#offers').innerHTML = offers.map((o, i) => `
    <div class="offer" data-i="${i}">
      <input type="text" class="of-retailer" value="${(o.retailer||'').replace(/"/g,'&quot;')}" placeholder="Amazon">
      <input type="text" class="of-id" value="${(o.asin||o.sku||'').replace(/"/g,'&quot;')}" placeholder="ASIN / SKU">
      <input type="number" class="of-price" value="${o.price ?? ''}" placeholder="price" step="0.01">
      <input type="text" class="of-url" value="${(o.source_url||'').replace(/"/g,'&quot;')}" placeholder="url">
    </div>`).join('') || '<div class="sub">No vendor offers.</div>';
}

function renderFacts(facts) {
  const b = $('#factsBlock');
  if (!facts.length) { b.style.display = 'none'; return; }
  b.style.display = '';
  $('#factsBody').innerHTML = facts.map((f, i) => `
    <div class="fact">
      <span class="tier">${f.reviewer || 'Reviewer'} — ${f.tier || ''}</span> · ${f.product_class || ''}
      <div class="verdict">"${(f.verdict||'').replace(/</g,'&lt;')}"</div>
      <div class="voice" id="voice_${i}"></div>
      <button class="btn" style="font-size:.8rem;padding:4px 10px;margin-top:4px" data-voice="${i}">Rewrite in our voice → blurb</button>
    </div>`).join('');
  facts.forEach((f, i) => $(`[data-voice="${i}"]`)?.addEventListener('click', async (e) => {
    e.target.disabled = true; e.target.textContent = 'Rewriting…';
    try {
      const r = await fetch('/product-fact-voice', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fact: f }) });
      const d = await r.json();
      $('#voice_' + i).textContent = d.text || '';
      if (d.text && !val('p_blurb')) set('p_blurb', d.text);
    } catch {} finally { e.target.textContent = 'Rewrite in our voice → blurb'; e.target.disabled = false; }
  }));
}

function renderMerge(matches) {
  const b = $('#mergeBlock');
  const cand = (matches.candidates || []).filter(c => c.confident);
  const exactId = matches.exact;
  if (!exactId && !cand.length) { b.style.display = 'none'; MERGE_INTO = null; return; }
  b.style.display = '';
  const opts = [];
  if (exactId) opts.push({ id: exactId, label: 'Same manufacturer key — add this vendor to the existing product', pick: true });
  cand.forEach(c => { if (c.product_id !== exactId) opts.push({ id: c.product_id, label: `Add as a vendor to "${c.name}" (similarity ${(1 - c.distance).toFixed(2)})` }); });
  opts.push({ id: '', label: 'No — this is a NEW product', pick: !exactId });
  $('#mergeBody').innerHTML = '<div class="sub">We may already have this product. Add this vendor to it, or create new:</div>' +
    opts.map((o, i) => `<label><input type="radio" name="merge" value="${o.id}" ${o.pick ? 'checked' : ''}> ${o.label}</label>`).join('');
  MERGE_INTO = exactId || '';
  document.querySelectorAll('input[name=merge]').forEach(r => r.addEventListener('change', e => { MERGE_INTO = e.target.value || null; }));
}

function collect() {
  return {
    ...(CURRENT || {}),
    name: val('p_name'), brand: val('p_brand'), category: val('p_category'), product_class: val('p_class'),
    image_url: val('p_image'), bcc_pick: val('p_pick'), bcc_blurb: val('p_blurb'),
    specs: { model_number: val('sp_model'), mpn: val('sp_mpn'), gtin: val('sp_gtin'),
             material: val('sp_material'), capacity: val('sp_capacity'), dimensions_in: val('sp_dims'),
             weight: val('sp_weight'), dishwasher_safe: val('sp_dish') },
    retailer_offers: [...document.querySelectorAll('#offers .offer')].map(row => {
      const g = (c) => row.querySelector(c)?.value?.trim() || '';
      const id = g('.of-id'), price = g('.of-price');
      const o = { retailer: g('.of-retailer'), source_url: g('.of-url') };
      if (/^[A-Z0-9]{10}$/i.test(id)) o.asin = id; else if (id) o.sku = id;
      if (price) o.price = parseFloat(price);
      return o;
    }).filter(o => o.retailer || o.source_url),
  };
}

async function save() {
  $('#saveBtn').disabled = true; $('#saveMsg').textContent = 'Saving…'; $('#saveMsg').className = 'msg';
  try {
    const r = await fetch('/products', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ product: collect(), merge_into: MERGE_INTO || null }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || ('HTTP ' + r.status));
    $('#saveMsg').textContent = `${d.action} — product ${d.product_id.slice(0, 8)} · vendors: ${(d.vendors || []).join(', ')}`;
    $('#saveMsg').className = 'msg ok';
    const chip = $('#action'); chip.textContent = d.action; chip.style.display = '';
  } catch (e) {
    $('#saveMsg').textContent = 'Save failed: ' + (e.message || e); $('#saveMsg').className = 'msg err';
  } finally { $('#saveBtn').disabled = false; }
}

$('#extractBtn').addEventListener('click', extract);
$('#saveBtn').addEventListener('click', save);
loadStaged();
</script>
</body>
</html>
