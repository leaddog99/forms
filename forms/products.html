<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Best Cooks Club — Admin · Products</title>
  <!-- Product catalog ACDV editor on the shared master/detail editor shell (cloned from
       ws_taxonomy.html / domains.html per memory/feedback_editor_template_not_runtime).
       Add / Change / Delete / View the `products` table: sidebar grouped category > class >
       product; detail pane shows specs, verdicts, offers, image + Edit/Delete; add/edit form
       re-embeds via the backend. Endpoints: GET /products/list, GET/PUT/DELETE /products/{id},
       POST /products (create). Replaces the old read-only demo viewer. -->
  <link rel="stylesheet" href="/forms/editor-shell.css?v=20260828b">
  <link rel="stylesheet" href="/forms/tokens.css?v=20260826b">
  <link rel="stylesheet" href="/forms/components.css?v=20260813b">
  <style>
    .pc-group { padding: 9px 14px 4px; font-size: .72rem; letter-spacing: .06em;
      text-transform: uppercase; color: var(--ed-ink-soft); font-weight: 700;
      background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; }
    .pc-class { padding: 5px 14px 3px 20px; font-size: .74rem; font-weight: 600;
      color: var(--ink); background: var(--bg); }
    .pc-tag { display: inline-block; font-size: .62rem; font-weight: 700; letter-spacing: .04em;
      text-transform: uppercase; padding: 1px 6px; border-radius: 999px; margin-left: 6px;
      background: var(--accent-soft, #f4ece6); color: var(--accent, #b8602a); vertical-align: middle; }
    .pc-form .ed-field { margin-bottom: 10px; }
    .pc-form label { display: block; font-size: .78rem; font-weight: 600; margin-bottom: 3px; color: var(--ed-ink-soft); }
    .pc-form input, .pc-form textarea, .pc-form select { width: 100%; padding: 8px 10px;
      border: 1px solid var(--line); border-radius: 7px; font: inherit; font-size: .9rem; background: var(--card); }
    .pc-form textarea { min-height: 60px; resize: vertical; }
    .pc-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pc-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .pc-form-actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
    .pc-fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 12px 0; }
    .pc-fieldset > legend { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em;
      font-weight: 700; color: var(--ed-ink-soft); padding: 0 6px; }
    .pc-hero { max-width: 180px; max-height: 180px; border-radius: 10px; border: 1px solid var(--line);
      object-fit: contain; background: var(--card); }
    .pc-specs { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: .9rem; }
    .pc-specs dt { color: var(--ed-ink-soft); }
    .pc-specs dd { margin: 0; }
    .pc-verdict { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; background: var(--bg); }
    .pc-verdict .rev { font-weight: 600; }
    .pc-offer { display: flex; gap: 10px; align-items: baseline; padding: 4px 0; border-bottom: 1px dashed var(--line); }
    .pc-offer:last-child { border-bottom: 0; }
    .pc-price { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent-dark); }
    /* RealRank — an AUDIT surface, not a sales card. Coverage and freshness read first;
       the prose is secondary. Staff are deciding whether to trust it, not whether to buy. */
    .rr-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .rr-score { display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
      width: 46px; height: 46px; border-radius: 10px; background: #0f6e6a; color: #fff; flex: 0 0 auto; }
    .rr-score.pending { background: #8fa3ab; }
    .rr-score .n { font-size: 1.05rem; font-weight: 800; line-height: 1; }
    .rr-score .l { font-size: .5rem; letter-spacing: .1em; text-transform: uppercase; opacity: .9; }
    .rr-stale { color: #b4552f; font-weight: 700; }
    .rr-ok { color: #1f8a54; font-weight: 700; }
    .rr-cov { font-size: .84rem; line-height: 1.9; margin: 0 0 10px; }
    .rr-cov .s { display: inline-block; margin-right: 12px; white-space: nowrap; }
    .rr-cov .miss { color: #b4552f; font-weight: 700; }
    .rr-hist { display: grid; grid-template-columns: 26px 1fr 40px; gap: 3px 8px;
      align-items: center; font-size: .78rem; max-width: 320px; }
    .rr-bar { height: 7px; background: #eef1f2; border-radius: 99px; overflow: hidden; }
    .rr-bar span { display: block; height: 100%; background: #e6a817; }
    .rr-find { border-top: 1px solid var(--line); padding: 8px 0; font-size: .88rem; }
    .rr-find:first-child { border-top: 0; }
    .rr-find .who { font-weight: 700; }
    .rr-via { font-size: .68rem; text-transform: uppercase; letter-spacing: .04em;
      color: var(--ed-ink-soft); background: var(--bg); border: 1px solid var(--line);
      border-radius: 5px; padding: 1px 5px; margin-left: 6px; }
    .rr-note { font-size: .8rem; color: var(--ed-ink-soft); background: var(--bg);
      border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
    .rr-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
    @media (max-width: 620px) { .rr-cols { grid-template-columns: 1fr; } }
    .rr-cols ul { margin: 4px 0 0; padding-left: 18px; font-size: .86rem; }
    .muted { color: var(--ed-ink-soft); }
    /* Curation — where it placed against its rivals. */
    .cu-p { display: flex; gap: 10px; align-items: flex-start; border-top: 1px solid var(--line);
      padding: 9px 0; font-size: .88rem; }
    .cu-p:first-child { border-top: 0; }
    .cu-badge { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; display: grid;
      place-items: center; font-size: .8rem; font-weight: 800; background: var(--bg);
      border: 1px solid var(--line); color: var(--ed-ink-soft); }
    .cu-badge.p1 { background: #fbf1d4; color: #96700c; border-color: #eedfb4; }
    .cu-sec { font-weight: 700; }
    .cu-line { margin: 3px 0 0; font-size: .83rem; }
    .cu-line b { font-weight: 600; color: var(--ed-ink-soft); }
    .cu-meta { font-size: .78rem; color: var(--ed-ink-soft); margin-top: 5px; }
    .cu-pend { font-size: .68rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
      padding: 1px 6px; border-radius: 999px; color: #8a5a12; background: #fbf1d4;
      border: 1px solid #eedfb4; margin-left: 6px; }
    .cu-ok { font-size: .68rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
      padding: 1px 6px; border-radius: 999px; color: #1f8a54; background: #eaf6ef;
      border: 1px solid #cfe9da; margin-left: 6px; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <button class="ed-back" id="edBack" aria-label="Toggle list"></button>
      <div class="ed-brand">Best Cooks Club</div>
    </div>
  </header>
  <div class="ed-scrim" id="edScrim"></div>

  <div class="ed-app">
    <aside class="ed-sidebar">
      <div class="ed-sidebar-head">
        <h2>Products <span class="ed-count" id="count"></span></h2>
        <div class="ed-head-actions">
          <button class="ed-icon-btn" id="searchToggle" title="Search" aria-label="Search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
          <button class="ed-icon-btn" id="addToggle" title="Add a product" aria-label="Add">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>
      </div>
      <div class="ed-controls" id="controls" hidden>
        <input type="search" id="search" placeholder="Search products…">
      </div>
      <ul class="ed-list" id="list"><li class="ed-empty">Loading…</li></ul>
    </aside>

    <main class="ed-content"><div class="ed-page" id="page"></div></main>
  </div>

  <script src="/forms/library-shell.js?v=20260831b"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    LibraryShell.initNav({ currentPage: 'products' });
    const nav = LibraryShell.initEditorNav({
      backButton: '#edBack', scrim: '#edScrim',
      listLabel: 'Products', listMode: 'docked', shellWidth: 1200,
    });
    const { escapeHtml, flash, urlField } = LibraryShell;

    const PICKS = ['', 'Best Overall', 'Best Value', 'Premium'];
    let rows = [];          // light list rows
    let byId = {};          // product_id -> light row
    let full = {};          // product_id -> full data (lazy)
    let classes = [];       // [{name, category}]
    let categories = [];
    let selected = null;    // product_id or null
    let term = '';
    let mode = 'view';      // 'view' | 'add' | 'edit'
    let importData = null;  // {product, facts, matches, source_url} when arriving via the bookmarklet (?staged)
    let mergeInto = null;   // product_id to add this vendor to (dedup), or null = save as a new product

    const qs = (k) => new URLSearchParams(location.search).get(k);

    // Bookmarklet landing — same handshake as the recipe grabber: the product bookmarklet
    // stages the page and opens products.html?staged=<token>. We fetch the staged markdown,
    // run /extract-product, and drop straight into the prefilled Add form (facts + merge
    // dedup included) — inside the normal ACDV shell, list one tap away in the menu.
    async function tryStagedImport(){
      const token = qs('staged'), urlParam = qs('url') || '';
      if (!token && !urlParam) return false;
      renderImporting();
      try {
        let md = '', src = urlParam;
        if (token){
          const r = await fetch('/staged-markdown/' + encodeURIComponent(token));
          if (r.ok){ const d = await r.json(); md = d.markdown || ''; src = d.source_url || src; }
        }
        if (!md){ renderImportFailed('Nothing staged to import — the token may have expired. Re-run the grab.'); return false; }
        const post = () => fetch('/extract-product', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ markdown: md, source_url: src }) });
        let r = await post();
        // /extract-product is gated on edit_master, so an expired or absent
        // session answers 403 (not 401). Both were previously unhandled: the
        // catch below only flashed a toast and returned false, and the boot
        // caller does nothing on false — leaving the page stranded on the
        // "Grabbing product…" screen renderImporting() already painted. That is
        // the hang. The capture is in hand and the token is still valid, so
        // offer sign-in and retry rather than sending anyone back to re-grab.
        // Same handshake as reviews.html; the server stays the authority.
        if (r.status === 401 || r.status === 403){
          // WHICH credential is missing decides which prompt. /extract-product
          // needs edit_master, and a staff account whose 12h master token has
          // expired reads as 'member' (staff_locked) while still being perfectly
          // signed in — so signing in again cannot fix it. Ask /auth/me and
          // prompt for the unlock in that case, the login otherwise.
          const me = await fetch('/auth/me').then(x => x.json()).catch(() => null);
          const res = me && me.staff_locked
            ? await LibraryShell.unlockDialog({
                title: 'Unlock to import',
                message: 'This product is captured and waiting. Your curator session expired — unlock to decode it. Nothing has been spent yet.'
              })
            : await LibraryShell.signInDialog({
                title: 'Sign in to import',
                message: 'This product is captured and waiting. Sign in with curator permissions to decode it — nothing has been spent yet.'
              });
          if (!res || !res.ok){
            renderImportFailed('Import cancelled — nothing was spent. Re-run the grab when you are signed in.');
            return false;
          }
          renderImporting();
          r = await post();
        }
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.detail || ('HTTP ' + r.status));
        importData = { product: d.product || {}, facts: d.facts || [], matches: d.matches || {}, source_url: src };
        mergeInto = (d.matches && d.matches.exact) || null;
        mode = 'add'; selected = null;
        return true;
      } catch (e){ renderImportFailed(e.message || String(e)); return false; }
    }

    function renderImportFailed(msg){
      $('#page').innerHTML = `<div class="ed-kicker"><span class="ed-purpose-toggle" style="cursor:default">Import failed</span></div>
        <h1 class="ed-title">Couldn’t import that page</h1>
        <p class="muted">${escapeHtml(msg)}</p>
        <p class="muted">The catalog is still available from the menu.</p>`;
    }

    function renderImporting(){
      $('#page').innerHTML = `<div class="ed-kicker"><span class="ed-purpose-toggle" style="cursor:default">Importing…</span></div>
        <h1 class="ed-title">Grabbing product…</h1>
        <p class="muted">Extracting the review page and matching it against the catalog. This opens as a prefilled draft.</p>`;
    }

    // ---- import extras: source link, merge/dedup, review facts (ported from the old
    //      standalone product_form.html so the bookmarklet lands in the real editor) ----
    function importSourceHtml(){
      const src = importData && importData.source_url;
      if (!src) return '';
      return `<div class="ed-field" style="margin-bottom:10px"><label>Grabbed from (source)</label>
        <div style="display:flex;gap:6px;align-items:stretch">
          <input id="imp_src" type="url" value="${escapeHtml(src)}" readonly style="flex:1 1 auto;min-width:0;background:var(--bg)">
          ${LibraryShell.urlControl(src, { inputId: 'imp_src', display: false })}
        </div></div>`;
    }

    function importMergeHtml(){
      const m = (importData && importData.matches) || {};
      const cand = (m.candidates || []).filter(c => c.confident);
      if (!m.exact && !cand.length) return '';
      const opt = (id, label, checked) =>
        `<label style="display:block;margin:3px 0;font-size:.88rem"><input type="radio" name="imp_merge" value="${escapeHtml(id)}" ${checked?'checked':''}> ${label}</label>`;
      let rows = '';
      if (m.exact) rows += opt(m.exact, 'Same manufacturer key — <b>add this vendor to the existing product</b>', true);
      cand.forEach(c => { if (c.product_id !== m.exact)
        rows += opt(c.product_id, `Add as a vendor to “${escapeHtml(c.name||'')}” <span class="muted">(similarity ${(1-(c.distance||0)).toFixed(2)})</span>`, false); });
      rows += opt('', 'No — this is a <b>new</b> product', !m.exact);
      return `<fieldset class="pc-fieldset"><legend>Possible duplicate</legend>
        <div class="muted" style="margin-bottom:4px;font-size:.84rem">We may already have this. Add this vendor to it, or create new:</div>${rows}</fieldset>`;
    }

    function importFactsHtml(){
      const facts = (importData && importData.facts) || [];
      if (!facts.length) return '';
      const body = facts.map((f, i) => `
        <div class="pc-verdict">
          <div class="rev">${escapeHtml(f.reviewer||'Reviewer')} ${f.tier?`— <strong>${escapeHtml(f.tier)}</strong>`:''} <span class="muted">${escapeHtml(f.product_class||'')}</span></div>
          ${f.verdict?`<div class="muted" style="margin-top:3px">“${escapeHtml(f.verdict)}”</div>`:''}
          <div id="imp_voice_${i}" style="margin-top:3px"></div>
          <button type="button" class="ed-btn" style="font-size:.78rem;padding:4px 10px;margin-top:5px" data-voice="${i}">Rewrite in our voice → blurb</button>
        </div>`).join('');
      return `<section class="ed-block"><h3 class="ed-block-label">Review facts (source verdicts)</h3>${body}</section>`;
    }

    function wireImportExtras(){
      document.querySelectorAll('input[name=imp_merge]').forEach(r =>
        r.addEventListener('change', e => { mergeInto = e.target.value || null; }));
      const facts = (importData && importData.facts) || [];
      facts.forEach((f, i) => $(`[data-voice="${i}"]`)?.addEventListener('click', async (e) => {
        e.target.disabled = true; const orig = e.target.textContent; e.target.textContent = 'Rewriting…';
        try {
          const r = await fetch('/product-fact-voice', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fact: f }) });
          const d = await r.json();
          if (d.text){ $('#imp_voice_' + i).textContent = d.text; const b = $('#f_blurb'); if (b && !b.value.trim()) b.value = d.text; }
        } catch {} finally { e.target.textContent = orig; e.target.disabled = false; }
      }));
    }

    async function load(keep){
      try {
        const r = await fetch('/products/list');
        const d = await r.json();
        rows = d.products || []; classes = d.classes || []; categories = d.categories || [];
        byId = {}; rows.forEach(p => byId[p.product_id] = p);
        if (keep && byId[keep]) selected = keep;
        else if (selected && !byId[selected]) selected = null;
        renderList(); renderDetail();
      } catch (e){
        $('#list').innerHTML = `<li class="ed-empty">Failed to load: ${escapeHtml(e.message||e)}</li>`;
      }
    }

    const uniq = (arr) => [...new Set(arr.filter(Boolean))].sort();
    const classNames = () => uniq(classes.map(c => c.name));
    const catNames = () => uniq(categories.concat(classes.map(c => c.category)));

    /* ---------------- list (category > class > product) ---------------- */
    function renderList(){
      const t = term.toLowerCase();
      const list = rows.filter(p => !t
        || [p.name, p.brand, p.product_class, p.category, p.tier, p.bcc_pick]
             .some(v => (v||'').toLowerCase().includes(t)));
      $('#count').textContent = `(${list.length})`;
      const ul = $('#list'); ul.innerHTML = '';
      if (!list.length){ ul.innerHTML = '<li class="ed-empty">No products</li>'; return; }
      const byCat = new Map();
      for (const p of list){
        const cat = p.category || '—';
        if (!byCat.has(cat)) byCat.set(cat, new Map());
        const clsMap = byCat.get(cat), key = p.product_class || '—';
        if (!clsMap.has(key)) clsMap.set(key, []);
        clsMap.get(key).push(p);
      }
      for (const [cat, clsMap] of byCat){
        const n = [...clsMap.values()].reduce((a,v)=>a+v.length,0);
        const h = document.createElement('li'); h.className = 'pc-group'; h.textContent = `${cat} (${n})`;
        ul.appendChild(h);
        for (const [cls, items] of clsMap){
          if (cls !== '—'){ const s = document.createElement('li'); s.className = 'pc-class'; s.textContent = cls; ul.appendChild(s); }
          for (const p of items){
            const li = document.createElement('li');
            li.className = 'ed-item' + (p.product_id === selected && mode==='view' ? ' selected' : '');
            const pick = p.bcc_pick ? `<span class="pc-tag">${escapeHtml(p.bcc_pick)}</span>` : '';
            const meta = [];
            // The curated placement leads: it is why this row exists at all when a
            // Collections/Curated run created it.
            if (p.placement) meta.push(`<b>${escapeHtml(p.placement)}</b>`);
            if (p.tier) meta.push(escapeHtml(p.tier));
            meta.push(p.has_image ? '🖼' : 'no image');
            meta.push(`${p.offers} offer${p.offers===1?'':'s'}`);
            li.innerHTML =
              `<div class="ed-item-top"><span class="ed-item-name">${escapeHtml(p.brand ? p.brand+' · ' : '')}${escapeHtml(p.name||'(unnamed)')}</span>${pick}</div>` +
              `<div class="ed-item-meta">${meta.join(' · ')}</div>`;
            li.addEventListener('click', () => { selected = p.product_id; mode='view'; renderList(); renderDetail(); nav.afterSelect(); });
            ul.appendChild(li);
          }
        }
      }
    }

    /* ---------------- detail (dispatch on mode) ---------------- */
    async function ensureFull(id){
      if (full[id]) return full[id];
      const r = await fetch(`/products/${encodeURIComponent(id)}`);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return (full[id] = await r.json());
    }

    async function renderDetail(){
      if (mode === 'add')  return renderForm(null);
      if (mode === 'edit' && selected){ try { return renderForm(await ensureFull(selected)); } catch(e){ return renderIntro(e); } }
      if (selected == null || !byId[selected]) return renderIntro();
      let p;
      try { p = await ensureFull(selected); }
      catch (e){ $('#page').innerHTML = `<p class="muted">Load failed: ${escapeHtml(e.message||e)}</p>`; return; }
      const specs = p.specs || {};
      const specRows = [['Material','material'],['Capacity','capacity'],['Dimensions','dimensions_in'],
        ['Weight','weight'],['Model #','model_number'],['MPN','mpn'],['GTIN','gtin'],['Dishwasher','dishwasher_safe']]
        .filter(([,k]) => specs[k]).map(([lbl,k]) => `<dt>${lbl}</dt><dd>${escapeHtml(String(specs[k]))}</dd>`).join('');
      const verds = (p.verdicts||[]).map(v => `
        <div class="pc-verdict"><div class="rev">${escapeHtml(v.reviewer||'')} ${v.tier?`— <strong>${escapeHtml(v.tier)}</strong>`:''}</div>
        ${v.summary?`<div class="muted" style="margin-top:3px">${escapeHtml(v.summary)}</div>`:''}</div>`).join('');
      const offers = (p.retailer_offers||[]).map(o => {
        const price = (o.price != null) ? `<span class="pc-price">$${Number(o.price).toFixed(2)}</span>` : '';
        const links = [
          o.source_url ? `<a href="${escapeHtml(o.source_url)}" target="_blank" rel="noopener" title="Where we found it">source ↗</a>` : '',
          o.affiliate_url ? `<a href="${escapeHtml(o.affiliate_url)}" target="_blank" rel="noopener" title="Our buy link">buy ↗</a>` : '',
        ].filter(Boolean).join(' · ');
        return `<div class="pc-offer"><span>${escapeHtml(o.retailer||'—')}</span>${price}${links?`<span style="margin-left:auto">${links}</span>`:''}</div>`;
      }).join('');
      $('#page').innerHTML = `
        <div class="ed-kicker"><button type="button" class="ed-purpose-toggle" id="backToIntro">← Catalog</button></div>
        <h1 class="ed-title">${escapeHtml(p.name||'(unnamed)')}${p.bcc_pick?`<span class="pc-tag">${escapeHtml(p.bcc_pick)}</span>`:''}</h1>
        <div class="ed-status-strip">
          ${p.brand?`<span class="ed-pill"><i class="d"></i>${escapeHtml(p.brand)}</span>`:''}
          <span class="ed-pill"><i class="d"></i>${escapeHtml(p.category||'—')}</span>
          <span class="ed-pill"><i class="d"></i>${escapeHtml(p.product_class||'—')}</span>
          ${(p.verdicts&&p.verdicts[0]&&p.verdicts[0].tier)?`<span class="ed-pill"><i class="d"></i>${escapeHtml(p.verdicts[0].tier)}</span>`:''}
        </div>
        <div style="display:flex;gap:8px;margin:6px 0 4px;align-items:center">
          <button type="button" class="ed-btn" id="editBtn">Edit</button>
          <button type="button" class="ed-btn" id="rrBtn">${(p.realrank || p.realstory) ? 'Re-run analysis' : 'Run RealRank + RealStory'}</button>
          <span class="muted" id="rrStatus" style="font-size:.82rem"></span>
          <button type="button" class="ed-btn" id="delBtn" style="margin-left:auto;color:#b23b3b">Delete</button>
        </div>
        ${curationBlock(p)}
        ${realrankBlock(p)}
        ${p.image_url?`<section class="ed-block"><img class="pc-hero" src="${escapeHtml(p.image_url)}" alt="" onerror="this.style.display='none'"></section>`:''}
        ${p.bcc_blurb?`<section class="ed-block"><h3 class="ed-block-label">BCC blurb</h3><p>${escapeHtml(p.bcc_blurb)}</p></section>`:''}
        ${p.description?`<section class="ed-block"><h3 class="ed-block-label">Description (embedding source)</h3><p>${escapeHtml(p.description)}</p></section>`:''}
        <section class="ed-block"><h3 class="ed-block-label">Specs</h3>${specRows?`<dl class="pc-specs">${specRows}</dl>`:'<p class="muted">— none —</p>'}</section>
        <section class="ed-block"><h3 class="ed-block-label">Reviews</h3>${verds||'<p class="muted">— none —</p>'}</section>
        <section class="ed-block"><h3 class="ed-block-label">Offers</h3>${offers||'<p class="muted">— none —</p>'}</section>`;
      $('#backToIntro')?.addEventListener('click', () => { selected=null; mode='view'; renderList(); renderDetail(); });
      $('#editBtn')?.addEventListener('click', () => { mode='edit'; renderDetail(); });
      $('#rrBtn')?.addEventListener('click', runRealRank);
      $('#cuApprove')?.addEventListener('click', async (e) => {
        e.target.disabled = true; e.target.textContent = 'Approving…';
        try {
          const r = await fetch(`/products/${encodeURIComponent(selected)}/curation/approve`, {
            method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
          if (!r.ok) throw new Error('HTTP '+r.status);
          delete full[selected]; await renderDetail(); flash && flash('Placement approved');
        } catch(err){ e.target.disabled=false; e.target.textContent='Approve placement';
                      flash && flash('Approve failed: '+(err.message||err)); }
      });
      $('#rrApprove')?.addEventListener('click', async (e) => {
        e.target.disabled = true; e.target.textContent = 'Approving…';
        try {
          const r = await fetch(`/products/${encodeURIComponent(selected)}/realstory/approve`, {
            method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
          if (!r.ok) throw new Error('HTTP '+r.status);
          delete full[selected]; await renderDetail(); flash && flash('Approved');
        } catch(err){ e.target.disabled=false; e.target.textContent='Approve for use';
                      flash && flash('Approve failed: '+(err.message||err)); }
      });
      const del = $('#delBtn');
      del?.addEventListener('click', async () => {
        if (del.dataset.armed !== '1'){
          del.dataset.armed='1'; del.textContent='Confirm delete?';
          setTimeout(()=>{ if(del.isConnected){ del.dataset.armed=''; del.textContent='Delete'; } }, 3000); return;
        }
        del.disabled=true; del.textContent='Deleting…';
        const id = selected;
        try {
          const r = await fetch(`/products/${encodeURIComponent(id)}`, { method:'DELETE' });
          if (!r.ok) throw new Error('HTTP '+r.status);
          delete full[id]; selected=null; mode='view';
          await load(); flash && flash('Deleted');
        } catch(e){ del.disabled=false; del.textContent='Delete'; flash && flash('Delete failed: '+(e.message||e)); }
      });
    }

    /* ---------------- Curation (where it placed against its rivals) ----------------
       The third block of the trio and the only RELATIVE one: RealRank scores what owners
       think, RealStory says what we think of the product alone, this says where it came in
       against the others. Written by a Collections/Curated run.

       `edge_over_next` leads each placement after the reasoning, because ranking here is
       model judgment against stated weights rather than arithmetic — no weighted score is
       computed — so that sentence IS the audit trail. Without it a rank can only be
       accepted, never challenged. */
    function curationBlock(p){
      const cu = p.curation;
      const pls = (cu && cu.placements) || [];
      if (!pls.length) return `<section class="ed-block">
        <h3 class="ed-block-label">Curation <span class="muted" style="font-weight:400">placement</span></h3>
        <p class="muted">Not placed in a curated ranking. A
          <a href="/forms/curated_collections.html">Collections/Curated</a> run ranks a whole
          class from the expert reviews and records each pick's placement here.</p></section>`;

      const age = daysSince(cu.ranked_at);
      const approved = !!cu.approved_by;
      // Overall first, then categories — the order it would be published in.
      const sorted = [...pls].sort((a,b) =>
        ((a.section?1:0) - (b.section?1:0)) ||
        String(a.section||'').localeCompare(String(b.section||'')) ||
        ((a.place||9) - (b.place||9)));

      const rows = sorted.map(x => {
        const srcs = (x.source_links||[]).filter(Boolean);
        const price = (x.typical_price != null)
          ? `$${Number(x.typical_price).toFixed(2)} typical${
              x.price_type==='sale' && x.current_price!=null
                ? ` · on sale ${'$'+Number(x.current_price).toFixed(2)}` : ''}`
          : '';
        return `
          <div class="cu-p">
            <div class="cu-badge ${x.place===1?'p1':''}">${x.place ?? '?'}</div>
            <div style="flex:1;min-width:0">
              <div class="cu-sec">${escapeHtml(x.section || 'Overall')}</div>
              ${x.best_for?`<div class="cu-line"><b>Best for:</b> ${escapeHtml(x.best_for)}</div>`:''}
              ${x.why_it_ranks_here?`<p style="margin:4px 0 0">${escapeHtml(x.why_it_ranks_here)}</p>`:''}
              ${x.edge_over_next?`<div class="cu-line"><b>Ahead of the next:</b> ${escapeHtml(x.edge_over_next)}</div>`:''}
              ${x.important_tradeoff?`<div class="cu-line"><b>The catch:</b> ${escapeHtml(x.important_tradeoff)}</div>`:''}
              <div class="cu-meta">${price}${
                srcs.length?`${price?' · ':''}sources: ${srcs.slice(0,4).map((u,i)=>
                  `<a href="${escapeHtml(u)}" target="_blank" rel="noopener">${i+1}</a>`).join(' ')}`:''}</div>
            </div>
          </div>`;
      }).join('');

      return `
        <section class="ed-block">
          <h3 class="ed-block-label">Curation <span class="muted" style="font-weight:400">placement</span>
            ${approved ? `<span class="cu-ok">approved</span>`
                       : `<span class="cu-pend">unapproved</span>`}</h3>
          <div class="cu-meta" style="margin:0 0 8px">
            Ranked within <b>${escapeHtml(cu.product_class || p.product_class || '—')}</b>
            by <a href="/forms/curated_collections.html">${escapeHtml(cu.collection||'—')}</a>
            ${age!=null?` · ${age===0?'today':age+'d ago'}`:''}
            ${cu.job_id?` · job #${cu.job_id}`:''}
            ${approved?` · by ${escapeHtml(cu.approved_by)}`:''}
          </div>
          ${rows}
          ${approved ? '' : `<div style="margin-top:10px">
            <button type="button" class="ed-btn" id="cuApprove">Approve placement</button>
            <span class="muted" style="font-size:.8rem;margin-left:8px">Confirms this product
              really belongs where the ranking put it. A placement drives a buy link, so
              nothing earns off an automated ranking no one has read.</span></div>`}
        </section>`;
    }

    /* ---------------- RealRank (audit surface) ----------------
       Ordered by what a staff decision needs, which is the INVERSE of the consumer card:
       can I trust it (coverage, freshness, how each source was fetched) comes first; the
       verdict prose comes last. A ✕ in the coverage line is a to-do — that source needs a
       bookmarklet capture. */
    const RR_TTL_DAYS = 90;

    function daysSince(iso){
      if (!iso) return null;
      const t = Date.parse(iso); if (isNaN(t)) return null;
      return Math.floor((Date.now() - t) / 86400000);
    }

    function rrHistogram(owner){
      const h = owner.histogram || [];
      if (h.length !== 5) return '';
      const total = h.reduce((a,b)=>a+b,0) || 1;
      return `<div class="rr-hist">${h.map((c,i)=>{
        const pct = 100*c/total;
        return `<span>${5-i}★</span><span class="rr-bar"><span style="width:${pct.toFixed(0)}%"></span></span>`
             + `<span>${pct.toFixed(0)}%</span>`;
      }).join('')}</div>`;
    }

    function realrankBlock(p){
      // Two halves, different lifetimes: realrank = the score (refreshes with ratings),
      // realstory = our write-up + attributed findings (rarely changes, needs a human read).
      const rr = p.realrank, rs = p.realstory;
      const r = (rr || rs) ? Object.assign({}, rs || {}, rr || {}) : null;
      if (!r) return `<section class="ed-block"><h3 class="ed-block-label">RealRank + RealStory</h3>
        <p class="muted">No analysis yet — <em>Run RealRank</em> gathers the named expert
        reviews plus Amazon owner ratings and attaches the result here.</p></section>`;
      const age = daysSince((rs && rs.generated_at) || (rr && rr.computed_at));
      const stale = age != null && age > RR_TTL_DAYS;
      const owner = r.owner || {};
      const pol = owner.polarization || {};
      const score = (r.score == null)
        ? `<span class="rr-score pending"><span class="n">—</span><span class="l">score</span></span>`
        : `<span class="rr-score"><span class="n">${escapeHtml(String(r.score))}</span><span class="l">score</span></span>`;

      const mark = { fetched: '✔', searched: '·', unavailable: '✕' };
      const cov = (r.coverage || []).map(c =>
        `<span class="s ${c.status==='unavailable'?'miss':''}">${mark[c.status]||'·'} ${escapeHtml(c.name||'')}</span>`
      ).join('');

      const finds = (r.findings || []).map(f => `
        <div class="rr-find">
          <span class="who">${escapeHtml(f.name||'')}</span>
          ${f.verdict_or_award?` — ${escapeHtml(f.verdict_or_award)}`:''}
          <span class="rr-via">${escapeHtml(f.via||'?')}</span>
          ${f.url?` <a href="${escapeHtml(f.url)}" target="_blank" rel="noopener">↗</a>`:''}
          ${(f.key_facts||[]).length?`<div class="muted" style="margin-top:2px">${escapeHtml((f.key_facts||[]).join('; '))}</div>`:''}
          ${f.short_quote?`<div class="muted" style="font-style:italic;margin-top:2px">“${escapeHtml(f.short_quote)}”</div>`:''}
        </div>`).join('');

      const alt = r.cheaper_alternative;
      return `
        <section class="ed-block"><h3 class="ed-block-label">RealRank <span class="muted" style="font-weight:400">score</span> + RealStory <span class="muted" style="font-weight:400">assessment</span></h3>
          ${!rs ? `<p class="muted" style="font-size:.82rem;margin:0 0 8px">Owner score only —
            computed from the real star histogram, which is arithmetic and needs no sign-off.
            The written assessment (verdict, pros/cons, attributed findings) comes from
            <em>Run RealRank + RealStory</em> above and is what gets approved.</p>` : ''}
          <div class="rr-head">
            ${score}
            <div>
              <div><strong>${escapeHtml(r.verdict||'—')}</strong>${pol.label?` · ${escapeHtml(pol.label)}`:''}</div>
              <div class="muted" style="font-size:.8rem">
                ${age==null?'ran (date unknown)':`ran ${age===0?'today':age+'d ago'}`}
                ${stale?`<span class="rr-stale">· STALE (&gt;${RR_TTL_DAYS}d)</span>`:''}
                ${r.job_id?` · <a href="/forms/jobs_monitor.html" title="job #${r.job_id}">job #${r.job_id}</a>`:''}
                ${r.model?` · ${escapeHtml(r.model)}`:''}
              </div>
            </div>
            <div style="margin-left:auto;text-align:right">
              ${!rs
                // Score WITHOUT a write-up — the state a curated-collection run leaves, since
                // it computes the owner score but never writes a RealStory. Offering "approve"
                // here asked to sign off on something that does not exist, and 404'd.
                ? `<span class="muted" style="font-size:.78rem">score only —<br>no write-up yet</span>`
                : rs.approved_by
                ? `<span class="rr-ok">✔ approved</span><div class="muted" style="font-size:.75rem">${escapeHtml(rs.approved_by)}</div>`
                : `<button type="button" class="ed-btn" id="rrApprove">Approve write-up</button>
                   <div class="muted" style="font-size:.7rem;max-width:150px;margin-top:3px">
                     Clears the write-up below to be published.</div>`}
            </div>
          </div>
          <p class="rr-cov">${cov || '<span class="muted">no coverage recorded</span>'}</p>
          ${owner.review_count ? `
            <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start">
              ${rrHistogram(owner)}
              <div class="muted" style="font-size:.84rem">
                ${escapeHtml(String(owner.avg_rating||'—'))}★ · ${Number(owner.review_count).toLocaleString()} ratings<br>
                ${(owner.sources||[]).map(s=>escapeHtml(`${s.source} ${s.count?Number(s.count).toLocaleString():''}`)).join(' + ')}
              </div>
            </div>
            <div class="rr-note"><strong>${escapeHtml(r.score_basis||'')}</strong>${
              pol.label?` — ${escapeHtml(pol.label)}: 1★ ${pol.one_star_pct}% vs ${pol.detractor_pct}% total detractors${pol.j_shaped?' (J-shaped)':''}.`:''
            }</div>` : '<p class="muted">No owner histogram — score pending a ratings feed.</p>'}
          ${(r.pros||[]).length||(r.cons||[]).length ? `<div class="rr-cols">
            <div><strong>Pros</strong><ul>${(r.pros||[]).map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></div>
            <div><strong>Cons</strong><ul>${(r.cons||[]).map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></div>
          </div>`:''}
          ${alt&&alt.name?`<div class="rr-note"><strong>Cheaper alternative:</strong>
            ${escapeHtml(alt.name)} ${escapeHtml(alt.approx_price||'')} — ${escapeHtml(alt.why||'')}</div>`:''}
          <details style="margin-top:10px"><summary class="muted" style="cursor:pointer;font-size:.85rem">
            Findings (${(r.findings||[]).length}) · one-liner · summary</summary>
            <p style="font-size:.9rem"><em>${escapeHtml(r.one_liner||'')}</em></p>
            ${finds}
            <p class="muted" style="font-size:.86rem;margin-top:8px">${escapeHtml(r.summary||'')}</p>
            ${r.files&&r.files.html?`<p style="font-size:.85rem">Posting: <code>${escapeHtml(r.files.html)}</code></p>`:''}
          </details>
        </section>`;
    }

    async function runRealRank(){
      const btn = $('#rrBtn'), st = $('#rrStatus');
      btn.disabled = true; st.textContent = 'Starting…';
      try {
        const r = await fetch(`/products/${encodeURIComponent(selected)}/realrank`, {
          method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || 'HTTP '+r.status);
        st.innerHTML = `job #${d.job_id} running — <a href="/forms/jobs_monitor.html" target="_blank">monitor</a>`;
        // Poll rather than hold a connection: a full run is minutes (8 fetches + research).
        const poll = setInterval(async () => {
          try {
            const j = await (await fetch(`/jobs/${d.job_id}`)).json();
            if (['success','error','cancelled'].includes(j.status)){
              clearInterval(poll);
              btn.disabled = false;
              st.textContent = `job #${d.job_id} ${j.status}`;
              if (j.status === 'success'){ delete full[selected]; await renderDetail(); }
            } else { st.textContent = `job #${d.job_id} ${j.status}…`; }
          } catch(e){ /* keep polling; the job outlives a blip */ }
        }, 5000);
      } catch(e){
        btn.disabled = false; st.textContent = 'Failed: ' + (e.message||e);
      }
    }

    function renderIntro(err){
      $('#page').innerHTML = `
        <div class="ed-kicker"><span class="ed-purpose-toggle" style="cursor:default">Product catalog · ${rows.length} products · ${classes.length} classes</span></div>
        <h1 class="ed-title">Products</h1>
        <p class="muted">${err?('Load error: '+escapeHtml(err.message||err)):'Pick a product from the list (☰), or ＋ to add one. These are the sellable products the recipe “Shop the tools” commerce join links to.'}</p>`;
    }

    /* ---------------- add / edit form ---------------- */
    function renderForm(existing){
      const isEdit = !!existing;
      const imp = !existing && !!importData;                    // arrived via the bookmarklet
      const p = existing || (imp ? importData.product : {}) || {};
      const s = p.specs || {};
      const o = (p.retailer_offers && p.retailer_offers[0]) || {};
      const dl = (id, opts) => `<datalist id="${id}">${uniq(opts).map(x=>`<option value="${escapeHtml(x)}">`).join('')}</datalist>`;
      const pickOpts = PICKS.map(x => `<option value="${escapeHtml(x)}" ${(p.bcc_pick||'')===x?'selected':''}>${x||'— none —'}</option>`).join('');
      $('#page').innerHTML = `
        <div class="ed-kicker"><button type="button" class="ed-purpose-toggle" id="cancelForm">← Cancel</button></div>
        <h1 class="ed-title">${isEdit ? 'Edit product' : (imp ? 'Import product' : 'Add a product')}</h1>
        <p class="ed-submeta">${isEdit ? 'Edits re-embed the product (affects the recipe→product match immediately).' : (imp ? 'Grabbed from the review page — review, edit, and save. Duplicate check + source verdicts below.' : 'A blank product to fill in by hand. Class + Category link it into the taxonomy / recipe match.')}</p>
        <div class="pc-form">
          ${imp ? importSourceHtml() : ''}
          ${imp ? importMergeHtml() : ''}
          <div class="pc-row2">
            <div class="ed-field"><label>Brand</label><input id="f_brand" value="${escapeHtml(p.brand||'')}" placeholder="USA Pan"></div>
            <div class="ed-field"><label>Name</label><input id="f_name" value="${escapeHtml(p.name||'')}" placeholder="USA Pan 1 lb Small Loaf Pan"></div>
          </div>
          <div class="pc-row2">
            <div class="ed-field"><label>Category</label><input id="f_cat" list="dl_cat" value="${escapeHtml(p.category||'')}" placeholder="Bakeware">${dl('dl_cat', catNames())}</div>
            <div class="ed-field"><label>Product class</label><input id="f_class" list="dl_class" value="${escapeHtml(p.product_class||'')}" placeholder="Loaf Pans (1 lb)">${dl('dl_class', classNames())}</div>
          </div>
          <div class="pc-row2">
            <div class="ed-field"><label>BCC pick</label><select id="f_pick">${pickOpts}</select></div>
            ${urlField('f_img', 'Image URL', p.image_url||'', { ph: 'https://…' })}
          </div>
          <div class="ed-field"><label>BCC blurb (our voice)</label><textarea id="f_blurb" placeholder="Why we like it…">${escapeHtml(p.bcc_blurb||'')}</textarea></div>
          <div class="ed-field"><label>Description (factual — feeds the embedding)</label><textarea id="f_desc" placeholder="Material, construction, use, sizes…">${escapeHtml(p.description||'')}</textarea></div>

          <fieldset class="pc-fieldset"><legend>Specs</legend>
            <div class="pc-row3">
              <div class="ed-field"><label>Material</label><input id="s_material" value="${escapeHtml(s.material||'')}"></div>
              <div class="ed-field"><label>Capacity</label><input id="s_capacity" value="${escapeHtml(s.capacity||'')}"></div>
              <div class="ed-field"><label>Dimensions (in)</label><input id="s_dims" value="${escapeHtml(s.dimensions_in||'')}"></div>
            </div>
            <div class="pc-row3">
              <div class="ed-field"><label>Weight</label><input id="s_weight" value="${escapeHtml(s.weight||'')}"></div>
              <div class="ed-field"><label>Model #</label><input id="s_model" value="${escapeHtml(s.model_number||'')}"></div>
              <div class="ed-field"><label>Dishwasher</label><input id="s_dish" value="${escapeHtml(s.dishwasher_safe||'')}"></div>
            </div>
            <div class="pc-row3">
              <div class="ed-field"><label>MPN</label><input id="s_mpn" value="${escapeHtml(s.mpn||'')}"></div>
              <div class="ed-field"><label>GTIN</label><input id="s_gtin" value="${escapeHtml(s.gtin||'')}"></div>
              <div class="ed-field"></div>
            </div>
          </fieldset>

          <fieldset class="pc-fieldset"><legend>Primary offer</legend>
            <div class="pc-row3">
              <div class="ed-field"><label>Retailer</label><input id="o_ret" value="${escapeHtml(o.retailer||'')}" placeholder="Williams Sonoma"></div>
              <div class="ed-field"><label>Price ($)</label><input id="o_price" type="number" step="0.01" value="${o.price!=null?o.price:''}"></div>
              <div class="ed-field"></div>
            </div>
            <div class="pc-row2">
              ${urlField('o_src', 'Source URL (where it was found)', o.source_url||'', { ph: 'https://…' })}
              ${urlField('o_url', 'Buy URL (our affiliate link)', o.affiliate_url||'', { ph: 'https://…' })}
            </div>
          </fieldset>

          ${imp ? importFactsHtml() : ''}

          <div class="pc-form-actions">
            <button type="button" class="ed-btn primary" id="saveForm">${isEdit ? 'Save + re-embed' : (imp ? 'Save product' : 'Add product')}</button>
            <span class="muted" id="formStatus"></span>
          </div>
        </div>`;
      $('#cancelForm').addEventListener('click', () => { importData = null; mergeInto = null; mode='view'; renderDetail(); });
      $('#saveForm').addEventListener('click', () => saveForm(isEdit ? existing : null));
      if (imp) wireImportExtras();
      $('#f_name').focus();
    }

    function buildOffer(existingOffers){
      const ret = $('#o_ret').value.trim();
      const src = $('#o_src')?.value.trim() || '';
      const aff = $('#o_url').value.trim();
      const priceRaw = $('#o_price').value.trim();
      const price = priceRaw === '' ? null : Number(priceRaw);
      const offers = Array.isArray(existingOffers) ? existingOffers.map(x => ({...x})) : [];
      if (!ret && !src && !aff && price == null) return offers;   // nothing to write
      const first = { ...(offers[0]||{}) };
      first.retailer = ret; first.price = price;
      if (src) first.source_url = src;
      if (aff) first.affiliate_url = aff;
      offers[0] = first;
      return offers;
    }

    async function saveForm(existing){
      const isEdit = !!existing;
      const imp = !existing && !!importData;
      // Offers to build FROM: the edit target's, else the extracted product's (import) — so
      // extra vendors/fields the extractor found survive the single-offer editor.
      const baseOffers = existing ? existing.retailer_offers : (imp ? importData.product.retailer_offers : []);
      const fields = {
        brand: $('#f_brand').value.trim(), name: $('#f_name').value.trim(),
        category: $('#f_cat').value.trim(), product_class: $('#f_class').value.trim(),
        bcc_pick: $('#f_pick').value, image_url: $('#f_img').value.trim(),
        bcc_blurb: $('#f_blurb').value.trim(), description: $('#f_desc').value.trim(),
        specs: {
          material: $('#s_material').value.trim(), capacity: $('#s_capacity').value.trim(),
          dimensions_in: $('#s_dims').value.trim(), weight: $('#s_weight').value.trim(),
          model_number: $('#s_model').value.trim(), dishwasher_safe: $('#s_dish').value.trim(),
          mpn: $('#s_mpn')?.value.trim() || '', gtin: $('#s_gtin')?.value.trim() || '',
        },
        retailer_offers: buildOffer(baseOffers),
      };
      // On import, start from the extracted product so its verdicts/sources (not in the form)
      // survive, then override with the curator's edits.
      const body = imp ? { ...importData.product, ...fields } : fields;
      if (!body.name){ $('#formStatus').textContent = 'Name is required.'; return; }
      const btn = $('#saveForm'); btn.disabled = true; $('#formStatus').textContent = 'Saving…';
      try {
        let savedId;
        if (isEdit){
          const r = await fetch(`/products/${encodeURIComponent(existing.product_id)}`, {
            method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
          if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || ('HTTP '+r.status));
          savedId = existing.product_id; full[savedId] = await r.json();
        } else {
          const r = await fetch('/products', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify(imp ? { product: body, merge_into: mergeInto || null } : { product: body }) });
          if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || ('HTTP '+r.status));
          savedId = (await r.json()).product_id; delete full[savedId];
        }
        // Import consumed — clear it and strip ?staged from the URL so a reload doesn't re-import.
        if (imp){ importData = null; mergeInto = null; try { history.replaceState({}, '', location.pathname); } catch {} }
        selected = savedId; mode='view';
        await load(savedId);
        flash && flash(isEdit ? 'Saved + re-embedded' : 'Product saved');
      } catch (e){
        $('#formStatus').textContent = 'Failed: ' + (e.message||e); btn.disabled = false;
      }
    }

    /* ---------------- controls ---------------- */
    $('#searchToggle').addEventListener('click', () => {
      const c = $('#controls'); c.hidden = !c.hidden; if (!c.hidden) $('#search').focus();
    });
    $('#search').addEventListener('input', e => { term = e.target.value; renderList(); });
    $('#addToggle').addEventListener('click', () => { importData=null; mergeInto=null; selected=null; mode='add'; renderList(); renderDetail(); nav.afterSelect(); });

    // URL-field ↗/⧉ icons are wired globally by LibraryShell (urlControl/_ensureUrlCtl) —
    // no per-form handler needed. See memory/feedback_url_field_control.

    // Boot: load the catalog, then — if the product bookmarklet landed us here with ?staged —
    // auto-extract and open the prefilled Add form (inside the normal ACDV shell, list in the menu).
    (async () => {
      // Deep-link: ?product=<id> selects that record on open — the curated-
      // collections page has linked here this way since the picks shipped,
      // but nothing ever READ the param, so 'product record ↗' landed on the
      // intro screen (found on the Tube Pan run, 2026-08-30).
      const want = (qs('product') || '').trim();   // product_id is a UUID string
      await load(want || undefined);
      if (want){
        if (byId[want]) { mode = 'view'; renderList(); renderDetail(); nav.afterSelect(); }
        else LibraryShell.flash && LibraryShell.flash('Product not found — it may have been deleted');
      }
      const staged = qs('staged') || qs('url');
      if (await tryStagedImport()){ renderList(); renderDetail(); nav.afterSelect(); }
      else if (staged){
        // A FAILED import must still leave a usable page. This branch did not
        // exist: tryStagedImport returned false and the boot simply stopped,
        // stranding the user on the "Grabbing product…" screen forever — the
        // reported hang. Populate the master list so the catalog is reachable,
        // but do NOT call renderDetail(), which writes #page and would wipe the
        // failure message explaining what went wrong.
        renderList();
      }
    })();
  </script>
</body>
</html>
