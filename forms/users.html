<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Best Cooks Club — Admin · Users</title>
  <!-- Users admin editor on the shared master/detail editor shell
       (editor-shell.css + LibraryShell.initEditorNav). Second clone of the
       a/c/d/v template — the editable-record case. See
       memory/project_admin_editor_nav.md. -->
  <link rel="stylesheet" href="/forms/editor-shell.css?v=20260618c">
  <link rel="stylesheet" href="/forms/tokens.css?v=20260617b">
  <link rel="stylesheet" href="/forms/components.css?v=20260617c">
  <style>
    /* page-specific bits (avatar, identity strip) — shell stays generic */
    .u-avatar{ width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff;
      display:flex; align-items:center; justify-content:center; font-size:.6em; font-weight:700;
      flex:0 0 auto; letter-spacing:.02em; }
    .u-avatar.gated{ background:#7a5e3a; }
    .u-avatar.lg{ width:46px; height:46px; font-size:1.05em; }
    .u-head{ display:flex; align-items:center; gap:14px; margin:0 0 12px; }
    .u-head .ed-title{ margin:0; }
    .ed-field .warn-hint{ color:var(--ed-warn); font-size:.78em; margin-top:5px; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <button class="ed-back" id="edBack" aria-label="Toggle list"></button>
      <div class="ed-brand">Best Cooks Club</div>
    </div>
  </header>
  <div class="ed-scrim" id="edScrim"></div>

  <div class="ed-app">
    <aside class="ed-sidebar">
      <div class="ed-sidebar-head">
        <h2>Users <span class="ed-count" id="count"></span></h2>
        <div class="ed-head-actions">
          <button class="ed-icon-btn" id="searchToggle" title="Search &amp; sort" aria-label="Search and sort">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
          <button class="ed-icon-btn" id="addToggle" title="New user" aria-label="New user">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>
      </div>

      <div class="ed-attn" id="attn"><div class="ed-attn-title" id="attnTitle"></div><div class="ed-attn-copy" id="attnCopy"></div></div>

      <div class="ed-controls" id="controls" hidden>
        <input type="search" id="search" placeholder="Search name or email…">
        <select id="sort" aria-label="Sort users">
          <option value="attention">Sort: needs attention</option>
          <option value="name">Sort: name (A–Z)</option>
          <option value="role">Sort: role (staff first)</option>
          <option value="newest">Sort: newest</option>
        </select>
      </div>

      <div class="ed-legend">
        <span><i class="d ok"></i>staff</span>
        <span><i class="d none"></i>member</span>
        <span><i class="d warn"></i>incomplete</span>
      </div>

      <ul class="ed-list" id="list"><li class="ed-empty">Loading…</li></ul>
    </aside>

    <main class="ed-content"><div class="ed-page" id="page"></div></main>
  </div>

  <script src="/forms/library-shell.js?v=20260805a"></script>
  <script>
    const $ = (s) => document.querySelector(s);

    LibraryShell.initNav({ currentPage: 'users' });
    const nav = LibraryShell.initEditorNav({
      backButton: '#edBack', scrim: '#edScrim',
      listLabel: 'Users', listMode: 'docked', shellWidth: 1200,
    });
    const { escapeHtml, fmtDate, flash } = LibraryShell;

    const ROLES = ['owner', 'admin', 'editor', 'author', 'contributor', 'member'];
    const STATUSES = ['test', 'free', 'paid', 'comped'];
    const STAFF = new Set(['owner', 'admin', 'editor', 'author']);

    let users = {};               // keyed by user_id
    let selected = null;          // user_id | 0 (master) | '__new__'
    let term = '';
    let sortKey = 'attention';

    const isStaff = (u) => STAFF.has(u.role);
    const incomplete = (u) => !u.email;
    const needsAttention = (u) => incomplete(u);
    const flag = (u) => incomplete(u) ? 'warn' : (isStaff(u) ? 'ok' : 'none');
    function initials(name){
      const p = (name || '').trim().split(/\s+/);
      return ((p[0]?.[0] || '') + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase() || '?';
    }

    function sortedUsers(){
      const t = term.toLowerCase();
      const rows = Object.values(users).filter(u =>
        !t || u.name.toLowerCase().includes(t) || (u.email || '').toLowerCase().includes(t));
      const sorters = {
        attention: (a, b) => (needsAttention(b) - needsAttention(a)) || a.name.localeCompare(b.name),
        name:    (a, b) => a.name.localeCompare(b.name),
        role:    (a, b) => (isStaff(b) - isStaff(a)) || ROLES.indexOf(a.role) - ROLES.indexOf(b.role) || a.name.localeCompare(b.name),
        newest:  (a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')),
      };
      return rows.sort(sorters[sortKey] || sorters.attention);
    }

    /* ----------------------------- list ----------------------------- */
    function renderList(){
      const rows = sortedUsers();
      $('#count').textContent = `(${rows.length})`;

      const attn = Object.values(users).filter(needsAttention).length;
      const panel = $('#attn'), title = $('#attnTitle'), copy = $('#attnCopy');
      if (attn){ panel.classList.remove('none'); title.textContent = `${attn} incomplete`; copy.textContent = 'Missing email — can’t be contacted or linked to a Ghost member.'; }
      else { panel.classList.add('none'); title.textContent = 'All profiles complete'; copy.textContent = 'Every user has an email on file.'; }

      const ul = $('#list'); ul.innerHTML = '';

      // Pinned Master curator identity (#0) — loginable, not a users-table row.
      const m = document.createElement('li');
      m.className = 'ed-item' + (selected === 0 ? ' selected' : '');
      m.style.marginBottom = '10px';
      m.innerHTML = `<div class="ed-item-top"><span class="u-avatar gated">M</span><span class="ed-item-name">Master (curator)</span></div><div class="ed-item-meta" style="margin-left:33px;color:var(--accent)">#0 · saves to master · admin</div>`;
      m.addEventListener('click', () => { selected = 0; renderList(); renderMain(); nav.afterSelect(); });
      ul.appendChild(m);

      if (!rows.length){ ul.insertAdjacentHTML('beforeend', '<li class="ed-empty">No matches</li>'); return; }
      for (const u of rows){
        const li = document.createElement('li');
        li.className = 'ed-item' + (u.user_id === selected ? ' selected' : '');
        li.innerHTML =
          `<div class="ed-item-top"><span class="u-avatar">${escapeHtml(initials(u.name))}</span>` +
          `<span class="ed-item-name">${escapeHtml(u.name)}</span><span class="ed-item-flag ${flag(u)}"></span></div>` +
          `<div class="ed-item-meta" style="margin-left:33px">#${u.user_id} · ${escapeHtml(u.email || '(no email)')} · ${escapeHtml(u.role)}</div>`;
        li.addEventListener('click', () => { selected = u.user_id; renderList(); renderMain(); nav.afterSelect(); });
        ul.appendChild(li);
      }
    }

    /* ----------------------------- dispatch ----------------------------- */
    function user(){ return users[selected]; }
    function renderMain(){
      if (selected === '__new__') return renderCreate();
      if (selected === 0) return renderMaster();
      const u = user();
      if (!u){ const first = sortedUsers()[0]; selected = first ? first.user_id : 0; return renderMain(); }
      renderDetail(u);
    }

    function stripPills(u){
      const out = [];
      out.push(`<span class="ed-pill ${isStaff(u) ? 'ok' : ''}"><i class="d"></i>${escapeHtml(u.role)}</span>`);
      out.push(`<span class="ed-pill ${u.status === 'paid' ? 'good' : ''}"><i class="d"></i>${escapeHtml(u.status || 'test')}${u.subscription_tier ? ' · ' + escapeHtml(u.subscription_tier) : ''}</span>`);
      if (incomplete(u)) out.push(`<span class="ed-pill warn"><i class="d"></i>No email</span>`);
      // Claimed vs proven. Every account created before mail existed reads
      // unverified, which is the truth rather than a defect — nothing enforces
      // it yet, so this is a status, not an alarm.
      else out.push(u.email_verified
        ? `<span class="ed-pill good"><i class="d"></i>email verified</span>`
        : `<span class="ed-pill"><i class="d"></i>email unverified</span>`);
      return out.join('');
    }

    function renderDetail(u){
      $('#page').innerHTML = `
        <div class="ed-kicker">
          <button type="button" class="ed-purpose-toggle" id="purposeToggle">Admin · Edit User <span id="purposeArrow">▾</span></button>
          <div class="ed-purpose-pop" id="purposePop" hidden>
            <strong>Purpose:</strong> edit a user’s identity, role and billing status, log in as them for testing, or remove them. When Ghost is wired in, identity/role sync from the member session and most of this becomes read-only.
          </div>
        </div>

        <div class="u-head">
          <span class="u-avatar lg">${escapeHtml(initials(u.name))}</span>
          <h1 class="ed-title" id="detailTitle">${escapeHtml(u.name || '(no name)')}</h1>
        </div>
        <div class="ed-status-strip" id="statusStrip">${stripPills(u)}</div>
        <p class="ed-submeta">user #${u.user_id} · joined ${fmtDate(u.created_at)} · updated ${fmtDate(u.updated_at)}</p>

        <section class="ed-block">
          <h3 class="ed-block-label">Identity</h3>
          <div class="ed-form-grid">
            <div class="ed-field"><label for="f_name">Name</label><input id="f_name" type="text" value="${escapeHtml(u.name || '')}"></div>
            <div class="ed-field"><label for="f_email">Email</label><input id="f_email" type="email" value="${escapeHtml(u.email || '')}" placeholder="name@example.com">
              ${incomplete(u) ? '<div class="warn-hint">No email on file — flagged incomplete.</div>' : ''}</div>
          </div>
        </section>

        <section class="ed-block">
          <h3 class="ed-block-label">Access &amp; billing</h3>
          <div class="ed-form-grid">
            <div class="ed-field"><label for="f_role">Role</label><select id="f_role">${ROLES.map(r => `<option ${r === u.role ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
            <div class="ed-field"><label for="f_status">Account status</label><select id="f_status">${STATUSES.map(s => `<option ${s === (u.status || 'test') ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
            <div class="ed-field full"><label for="f_tier">Subscription tier</label><input id="f_tier" type="text" value="${escapeHtml(u.subscription_tier || '')}" placeholder="e.g. Pro, Basic, Admin (optional)"></div>
          </div>
        </section>

        <section class="ed-block">
          <h3 class="ed-block-label">Password</h3>
          <div class="ed-callout info"><span class="mark">○</span><span>${u.has_password
            ? 'This account is <strong>hardened</strong> — it requires a login and the identity header alone is no longer accepted for it.'
            : 'No password set. This account still resolves on the <strong>unverified identity header</strong>, so anyone who can reach the app could act as it. Setting one hardens it immediately.'}</span></div>
          <div id="pwMount"></div>
          <div class="warn-hint" id="pwHint"></div>
          <div class="ed-actions" style="margin-top:8px">
            <button type="button" class="ed-btn" id="setPwBtn">${u.has_password ? 'Change password' : 'Set password'}</button>
          </div>
        </section>

        <section class="ed-block">
          <h3 class="ed-block-label">Email address</h3>
          <div class="ed-callout info"><span class="mark">○</span><span>${u.email_verified
            ? `Confirmed <strong>${escapeHtml(fmtDate(u.email_verified_at))}</strong> — this person clicked a link we sent to <strong>${escapeHtml(u.email || '')}</strong>, so the address is proven rather than claimed.`
            : 'This address is <strong>claimed, not proven</strong> — nobody has clicked a link sent to it. Nothing enforces verification yet, so this is a status rather than a fault; accounts made before we could send mail all read this way. It matters most before a password reset exists, since a reset mailed to an unproven address is a way into the account.'}</span></div>
          <div class="ed-actions" style="margin-top:8px">
            <button type="button" class="ed-btn" id="sendVerifyBtn"${u.email_verified || !u.email ? ' disabled' : ''}>Send confirmation email</button>
          </div>
          <div class="warn-hint" id="verifyHint"></div>
        </section>

        <section class="ed-block">
          <h3 class="ed-block-label">Bookmarklet key</h3>
          <div class="ed-callout info"><span class="mark">○</span><span>One key <strong>per device</strong> — phone, tablet, desktop each get their own, so adding one never breaks the others, and losing a device means revoking just that row. The key proves <em>who</em> is grabbing; what they may grab follows from their role, so a member's bookmarklet saves recipes while the product and review grabbers stay with staff. Shown <strong>once</strong>: only a hash is stored, so a lost key is replaced, never recovered.</span></div>
          <div id="keyList" class="ed-kv" style="margin-bottom:10px"><div class="k">Devices</div><div class="v">loading…</div></div>
          <div id="keyReveal" hidden style="margin-bottom:10px"></div>
          <div class="ed-form-grid">
            <div class="ed-field"><label for="keyLabel">New device name</label>
              <input id="keyLabel" type="text" placeholder="Desktop, Phone, iPad…" maxlength="60"></div>
          </div>
          <div class="ed-actions" style="margin-top:8px">
            <button type="button" class="ed-btn" id="genKeyBtn">Add device</button>
          </div>
        </section>

        <section class="ed-block">
          <h3 class="ed-block-label">Activity</h3>
          <div class="ed-kv">
            <div class="k">User ID</div><div class="v">#${u.user_id}</div>
            <div class="k">Joined</div><div class="v">${fmtDate(u.created_at)}</div>
            <div class="k">Last updated</div><div class="v">${fmtDate(u.updated_at)}</div>
            <div class="k">Ghost member</div><div class="v">${u.ghost_uuid ? 'linked' : 'not linked'}</div>
          </div>
        </section>

        <div class="ed-actions">
          <button type="button" class="ed-btn primary" id="saveBtn">Save</button>
          <button type="button" class="ed-btn" id="loginBtn">Log in</button>
          <button type="button" class="ed-btn danger" id="deleteBtn">Delete</button>
          <span class="ed-save-hint" id="hint"></span>
        </div>`;

      $('#purposeToggle').addEventListener('click', () => {
        const p = $('#purposePop'), a = $('#purposeArrow');
        p.hidden = !p.hidden; a.textContent = p.hidden ? '▾' : '▴';
      });
      $('#saveBtn').addEventListener('click', () => doSave(u));
      $('#loginBtn').addEventListener('click', () => login(u.user_id));
      $('#deleteBtn').addEventListener('click', () => doDelete(u));
      $('#saveBtn').disabled = true;   // enabled by the dirty-tracker on first edit
      wirePassword(u);
      wireEmailVerification(u);
      wireApiKey(u);
    }

    /* ------------------------ email verification ------------------------ */

    function wireEmailVerification(u){
      const btn = $('#sendVerifyBtn'), hint = $('#verifyHint');
      if (!btn || btn.disabled) return;
      btn.addEventListener('click', async () => {
        const say = (m, bad) => { hint.textContent = m; hint.style.color = bad ? '' : 'var(--muted,#8a7f72)'; };
        btn.disabled = true; say('Sending…');
        try {
          const r = await fetch('/auth/send-verification', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: u.user_id })
          });
          const d = await r.json().catch(() => ({}));
          if (!r.ok) {
            // A mail failure has to say so. Reporting "sent" when nothing left
            // the building is the failure mode this whole surface exists to
            // avoid — the person waits for a message that will never arrive.
            say(d.detail || `Could not send (HTTP ${r.status}).`, true);
            btn.disabled = false;
            return;
          }
          if (d.already_verified) { say('Already confirmed.'); return; }
          say(`Sent to ${u.email}. The link works for 24 hours.`);
        } catch (e) {
          say('Could not reach the server: ' + e.message, true);
          btn.disabled = false;
        }
      });
    }

    /* ------------------- password + bookmarklet key ------------------- */

    function wirePassword(u){
      const btn = $('#setPwBtn'), hint = $('#pwHint'), mount = $('#pwMount');
      if (!btn || !mount) return;
      // Shared control: two entries that must match, each with its own reveal.
      // A typo in a masked field would otherwise only surface at the NEXT login,
      // by which point the account is locked and the fix is a shell on the box.
      const pwf = LibraryShell.passwordField({
        id: 'f_pw',
        label: u.has_password ? 'New password' : 'Set password',
        onChange: (ok) => { btn.disabled = !ok; },
      });
      mount.appendChild(pwf.el);
      btn.disabled = true;
      const input = { get value(){ return pwf.value(); }, set value(v){ if (!v) pwf.clear(); }, focus: () => pwf.focus() };
      const say = (m, bad) => { hint.textContent = m; hint.style.color = bad ? '' : 'var(--muted,#8a7f72)'; };
      btn.addEventListener('click', async () => {
        const pw = (input.value || '');
        if (pw.length < 8) { say('At least 8 characters.', true); input.focus(); return; }
        btn.disabled = true; say('Saving…');
        try {
          const r = await fetch(`/users/${u.user_id}/password`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pw })
          });
          if (!r.ok) { const d = await r.json().catch(() => ({})); say(d.detail || `Failed (${r.status})`, true); return; }
          input.value = '';
          say('');
          flash('Password set — this account now requires a login.');
          await loadUsers(); renderList(); renderMain();
        } catch (e) { say('Could not reach the server: ' + e.message, true); }
        finally { btn.disabled = false; }
      });

    }

    function wireApiKey(u){
      const gen = $('#genKeyBtn'), reveal = $('#keyReveal'), list = $('#keyList');
      if (!gen) return;

      function shortUA(ua){
        const b = /(Edg|Chrome|Firefox|Safari)\//.exec(ua || '');
        const o = /(Windows|Android|iPhone|iPad|Macintosh|Linux)/.exec(ua || '');
        return [b && b[1], o && o[1]].filter(Boolean).join(' on ');
      }

      function renderKeys(keys){
        if (!keys || !keys.length){
          list.innerHTML = '<div class="k">Devices</div><div class="v">— none yet —</div>';
          return;
        }
        // Metadata only; the server never returns a hash. last_seen_ua is a
        // recognition hint, not identity — a browser offers nothing better.
        list.innerHTML = keys.map(function(k){
          const ua = shortUA(k.last_seen_ua);
          return '<div class="k">' + escapeHtml(k.label || 'Unnamed device') + '</div>' +
            '<div class="v" style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">' +
              '<span>' + (k.last_used_at ? 'used ' + escapeHtml(fmtDate(k.last_used_at)) : 'never used') + '</span>' +
              '<span style="font-size:.8em;color:var(--muted,#8a7f72)">added ' + escapeHtml(fmtDate(k.created_at)) +
                (ua ? ' · ' + escapeHtml(ua) : '') + '</span>' +
              '<button type="button" class="ed-btn" data-revoke="' + k.id + '" style="padding:2px 9px;font-size:.8em">Revoke</button>' +
            '</div>';
        }).join('');
        list.querySelectorAll('[data-revoke]').forEach(function(b){
          b.addEventListener('click', function(){ doRevoke(parseInt(b.dataset.revoke, 10)); });
        });
      }

      async function loadKeys(){
        try {
          const r = await fetch(`/users/${u.user_id}/api-keys`);
          if (!r.ok) throw new Error(r.status);
          renderKeys((await r.json()).keys);
        } catch (e) {
          list.innerHTML = '<div class="k">Devices</div><div class="v">could not load</div>';
        }
      }

      async function doRevoke(id){
        if (!confirm('Revoke this device? Its bookmarklet stops working immediately. Other devices are unaffected.')) return;
        const r = await fetch(`/users/${u.user_id}/api-keys/${id}`, { method: 'DELETE' });
        if (!r.ok) { flash(`Revoke failed (${r.status})`, true); return; }
        flash('Device revoked.');
        renderKeys((await r.json()).keys);
      }

      gen.addEventListener('click', async function(){
        const label = ($('#keyLabel').value || '').trim();
        if (!label) { flash('Name the device — that is the only way to tell them apart later.', true); $('#keyLabel').focus(); return; }
        gen.disabled = true;
        try {
          const r = await fetch(`/users/${u.user_id}/api-keys`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ label: label })
          });
          if (!r.ok) { const d = await r.json().catch(function(){ return {}; }); flash(d.detail || `Failed (${r.status})`, true); return; }
          const d = await r.json();
          $('#keyLabel').value = '';
          reveal.hidden = false;
          reveal.innerHTML =
            '<div class="ed-callout info" style="margin:0"><span class="mark">!</span><span>' +
            '<strong>Copy this now — it will not be shown again.</strong></span></div>' +
            '<div class="ed-field full" style="margin-top:8px"><label for="newKey">Key for ' +
            escapeHtml(d.label || 'this device') + '</label>' +
            '<div style="display:flex;gap:6px;align-items:stretch">' +
            '<input id="newKey" type="text" readonly value="' + escapeHtml(d.api_key) + '" style="flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85em">' +
            LibraryShell.urlControl(d.api_key, { inputId: 'newKey', display: false }) +
            '</div></div>' +
            '<p class="ed-submeta">Install it from <a href="/forms/install.html">the bookmarklet page</a> on that device.</p>';
          renderKeys(d.keys);
        } catch (e) { flash('Could not reach the server: ' + e.message, true); }
        finally { gen.disabled = false; }
      });

      loadKeys();
    }

    async function login(uid){
      // The user switcher. An account WITH a password can no longer be entered
      // by setting the identity header — it needs a real login, so ask for the
      // password and exchange it for a session token first. Accounts without one
      // still switch straight through, which is what keeps the rollout gradual.
      const u = users[uid];
      if (u && u.has_password) {
        // The shared dialog rather than a native prompt(): prompt() shows the
        // password in clear text, password managers can't fill it, and its
        // errors have nowhere to go but an alert. `userId` keeps it bound to the
        // row that was clicked — no email box to sign in as somebody else. It
        // stores the session token itself and refreshes the identity badge.
        const r = await LibraryShell.signInDialog({
          userId: uid,
          title: `Sign in as ${u.name || ('user ' + uid)}`,
          message: 'This account has a password, so switching to it needs a real login.',
        });
        if (!r.ok) return;
      } else {
        try { localStorage.removeItem('app:session_token'); } catch (e) { /* private mode */ }
      }
      // The user switcher: set identity + current view, open the recipe form
      // as that user (same behaviour as the old picker's pickUser).
      try {
        localStorage.setItem('app:self_user_id', String(uid));
        localStorage.setItem('sidebar:user_id', String(uid));
        // Switching to a member drops any curator token — don't leave an owner
        // grant lying in localStorage after logging out of Master.
        if (String(uid) !== '0') localStorage.removeItem('app:master_token');
      } catch (e) { /* private mode */ }
      window.location.href = '/forms/recipe_form_styled.html';
    }

    async function loginAsMaster(){
      // Master (uid 0) is password-gated as of 2026-07-29. The header alone used
      // to grant owner — admin_ui/edit_master/delete_master/manage_users — which
      // on a public hostname was a full admin bypass. Exchange the password for
      // a short-lived token, then log in normally.
      const hint = $('#masterHint');
      const pw = $('#masterPw');
      const show = (msg, bad) => {
        if (!hint) return;
        hint.textContent = msg;
        hint.style.color = bad ? 'var(--danger, #c0392b)' : 'var(--muted, #666)';
      };
      if (!pw || !pw.value) { show('Enter the Master password.', true); pw && pw.focus(); return; }
      show('Checking…');
      try {
        const r = await fetch('/auth/master', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw.value })
        });
        if (r.status === 503) {
          const d = await r.json().catch(() => ({}));
          show(d.detail || 'No master password is configured. Run: python set_master_password.py', true);
          return;
        }
        if (r.status === 429) { show('Too many attempts. Wait 15 minutes.', true); return; }
        if (!r.ok) { show('Incorrect password.', true); pw.value = ''; pw.focus(); return; }
        const { token } = await r.json();
        if (!token) { show('Server returned no token.', true); return; }
        try { localStorage.setItem('app:master_token', token); } catch (e) { /* private mode */ }
        pw.value = '';
        login(0);
      } catch (e) {
        show('Could not reach the server: ' + e.message, true);
      }
    }

    async function doSave(u){
      const hint = $('#hint'); const btn = $('#saveBtn');
      const name = $('#f_name').value.trim();
      const email = $('#f_email').value.trim();
      if (!name){ hint.style.color = 'var(--ed-warn)'; hint.textContent = 'Name is required'; $('#f_name').focus(); return; }
      if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ hint.style.color = 'var(--ed-warn)'; hint.textContent = 'Enter a valid email'; $('#f_email').focus(); return; }
      const body = { name, email, role: $('#f_role').value, status: $('#f_status').value, subscription_tier: $('#f_tier').value.trim() };
      hint.style.color = ''; btn.disabled = true; btn.textContent = 'Saving…'; btn.classList.remove('done');
      try {
        const r = await fetch(`/users/${u.user_id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);
        users[u.user_id] = data;                       // adopt server's canonical row
        // Update title/pills/avatar in place — no destructive re-render.
        $('#detailTitle').textContent = data.name;
        $('#statusStrip').innerHTML = stripPills(data);
        document.querySelector('.u-head .u-avatar').textContent = initials(data.name);
        renderList();
        btn.textContent = 'Saved ✓'; btn.classList.add('done'); hint.textContent = 'Saved';
        setTimeout(() => { btn.textContent = 'Save'; btn.classList.remove('done'); }, 1900);  // stays disabled until next edit
      } catch (e) {
        btn.disabled = false; btn.textContent = 'Save';
        hint.style.color = 'var(--ed-warn)'; hint.textContent = String(e.message || e);
      }
    }

    async function doDelete(u){
      if (!confirm(`Delete user “${u.name || '(no name)'}” (#${u.user_id})?`)) return;
      try {
        const r = await fetch(`/users/${u.user_id}`, { method: 'DELETE' });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);
        delete users[u.user_id];
        const first = sortedUsers()[0];
        selected = first ? first.user_id : 0;
        renderList(); renderMain();
        flash('User deleted');
      } catch (e) {
        // 409 = user still owns recipes (server refuses) — surface it clearly.
        flash(String(e.message || e), true);
      }
    }

    function renderMaster(){
      $('#page').innerHTML = `
        <div class="ed-kicker"><button type="button" class="ed-purpose-toggle" disabled style="cursor:default">Admin · Master Collection</button></div>
        <div class="u-head"><span class="u-avatar lg gated">M</span><h1 class="ed-title">Master (curator)</h1></div>
        <div class="ed-status-strip"><span class="ed-pill ok"><i class="d"></i>owner</span><span class="ed-pill"><i class="d"></i>user #0 · curator</span></div>
        <p class="ed-submeta">The curator identity — works like any user, but saves to the master collection and unlocks the admin tools.</p>
        <section class="ed-block">
          <h3 class="ed-block-label">Access</h3>
          <div class="ed-callout info"><span class="mark">○</span><span>Log in as <strong>Master</strong> to curate. Saves land in the <strong>master collection</strong> and the <strong>admin pages</strong> (Domains, Dishes, Chapters, Jobs, System…) become available. It’s a reserved identity (user&nbsp;0), not a row in this table, so there’s nothing to edit here. <strong>Password required</strong> — unlike a member login, which only needs picking a name. If it reports that no password is configured, run <code>python set_master_password.py</code> on the server and restart.</span></div>
        </section>
        <div class="ed-actions" style="position:static;background:none;padding:8px 0 0">
          <div class="ed-field" style="max-width:340px;margin:0 0 14px">
            <label for="masterPw">Master password</label>
            <input id="masterPw" type="password" autocomplete="current-password"
                   placeholder="Required" spellcheck="false">
            <div id="masterHint" style="margin-top:6px;font-size:13px;color:var(--muted,#666)"></div>
          </div>
          <button type="button" class="ed-btn primary" id="masterLoginBtn">Log in as Master</button>
        </div>`;
      $('#masterLoginBtn').addEventListener('click', loginAsMaster);
      const pwEl = $('#masterPw');
      if (pwEl) pwEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginAsMaster(); });
    }

    function renderCreate(){
      $('#page').innerHTML = `
        <div class="ed-kicker"><button type="button" class="ed-purpose-toggle" disabled style="cursor:default">Admin · New User</button></div>
        <h1 class="ed-title" style="margin:0 0 18px">Add a user</h1>
        <section class="ed-block" style="border-top:none;padding-top:0">
          <div class="ed-form-grid">
            <div class="ed-field"><label for="n_name">Name</label><input id="n_name" type="text" placeholder="Required" autocomplete="off"></div>
            <div class="ed-field"><label for="n_email">Email</label><input id="n_email" type="email" placeholder="name@example.com (optional)" autocomplete="off"></div>
            <div class="ed-field"><label for="n_role">Role</label><select id="n_role">${ROLES.map(r => `<option ${r === 'member' ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
            <div class="ed-field"><label for="n_status">Account status</label><select id="n_status">${STATUSES.map(s => `<option ${s === 'test' ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
            <div class="ed-field full"><label for="n_tier">Subscription tier</label><input id="n_tier" type="text" placeholder="optional"></div>
          </div>
        </section>
        <div class="ed-actions" style="position:static;background:none;padding:8px 0 0">
          <button type="button" class="ed-btn primary" id="createBtn">Create</button>
          <button type="button" class="ed-btn" id="cancelBtn">Cancel</button>
          <span class="ed-save-hint" id="hint"></span>
        </div>`;
      $('#n_name').focus();
      $('#cancelBtn').addEventListener('click', () => { const first = sortedUsers()[0]; selected = first ? first.user_id : 0; renderList(); renderMain(); });
      $('#createBtn').addEventListener('click', doCreate);
    }

    async function doCreate(){
      const hint = $('#hint'); const btn = $('#createBtn');
      const name = $('#n_name').value.trim();
      const email = $('#n_email').value.trim();
      if (!name){ hint.style.color = 'var(--ed-warn)'; hint.textContent = 'Name is required'; $('#n_name').focus(); return; }
      if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ hint.style.color = 'var(--ed-warn)'; hint.textContent = 'Enter a valid email'; $('#n_email').focus(); return; }
      const body = { name, email, role: $('#n_role').value, status: $('#n_status').value, subscription_tier: $('#n_tier').value.trim() };
      hint.style.color = ''; btn.disabled = true; btn.textContent = 'Creating…';
      try {
        const r = await fetch('/users', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);
        users[data.user_id] = data;
        selected = data.user_id;
        renderList(); renderMain();
        flash('User created');
      } catch (e) {
        btn.disabled = false; btn.textContent = 'Create';
        hint.style.color = 'var(--ed-warn)'; hint.textContent = String(e.message || e);
      }
    }

    /* ----------------------------- data + wiring ----------------------------- */
    async function loadUsers(){
      const r = await fetch('/users');
      if (!r.ok){ $('#list').innerHTML = `<li class="ed-empty">Failed to load (${r.status})</li>`; return; }
      const list = await r.json();
      users = {};
      for (const u of list) users[u.user_id] = u;
      // Land on the first real user so the page is populated, not a splash.
      if (selected == null) { const first = sortedUsers()[0]; selected = first ? first.user_id : 0; }
      renderList();
      renderMain();
    }

    $('#searchToggle').addEventListener('click', () => {
      const c = $('#controls'); c.hidden = !c.hidden;
      $('#searchToggle').classList.toggle('active', !c.hidden);
      if (!c.hidden) $('#search').focus();
    });
    // Dirty-tracker: Save stays disabled until something in the detail changes.
    const _markDirty = () => { const b = $('#saveBtn'); if (b) b.disabled = false; };
    $('#page').addEventListener('input', _markDirty);
    $('#page').addEventListener('change', _markDirty);
    $('#addToggle').addEventListener('click', () => { selected = '__new__'; renderList(); renderMain(); nav.afterSelect(); });
    $('#search').addEventListener('input', (e) => { term = e.target.value; renderList(); });
    $('#sort').addEventListener('change', (e) => { sortKey = e.target.value; renderList(); });

    loadUsers();
  </script>
</body>
